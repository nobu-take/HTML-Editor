        '- 飾りが増えても、本文が読みにくくならないようにする'
      ] },

    { key: 'fix', name: 'HTMLを直す',
      body: 'このHTMLに、メールとして問題になる箇所がないか確認し、修正してください。修正した箇所は最後に箇条書きで教えてください。' },
    { key: 'mobile', name: 'スマホで読みやすく',
      body: 'スマートフォンの画面で読みやすくなるよう、余白・文字サイズ・改行位置を調整してください。' },
    { key: 'english', name: '英訳する',
      body: '本文を英語に訳してください。レイアウトはそのまま保ってください。' }
  ];

  /** AIに必ず伝えるHTMLメールの前提 */
  var AI_RULES = [
    '- レイアウトは table で組む（div の flex や grid は Outlook で崩れます）',
    '- 装飾はすべてインラインの style 属性で書く。<style> ブロックや外部CSSは使わない',
    '- 本文の幅は 600px。`width:100%; max-width:600px` の形を保つ',
    '- Outlook は border-radius と max-width を無視するため、それらに依存しない見た目にする',
    '- img には必ず alt を付ける。src は絶対URLにする',
    '- bgcolor / align / cellpadding などの属性は Outlook 対策で意図的に使っています。取り除かないでください',
    '- 日本語のフォント指定は既存のものをそのまま使う'
  ].join('\n');

  function openAi() {
    if (!state.aiPreset) state.aiPreset = AI_PRESETS[0].key;

    renderAiPresets();
    el['ai-answer'].value = '';
    hideAiStatus();
    buildPrompt();
    show(el['ai-modal']);
  }

  /**
   * 依頼の種類を並べる。
   *
   * 横に流して折り返す形にしていたが、登録した依頼が増えるほど背が高く
   * なり、下の入力欄を押し下げてしまう。数が増えても場所が変わらないよう、
   * 縦のリストにして、入りきらないぶんはスクロールさせる。
   *
   * 右側には、選んだ依頼で実際にAIへ渡す文を出す。選んだものが何を
   * 頼むのかは、名前だけでは分からない。
   */
  function renderAiPresets() {
    var box = el['ai-presets'];
    box.textContent = '';

    var all = AI_PRESETS.concat(state.prompts.map(function (prompt) {
      return { key: prompt.id, name: prompt.name, body: prompt.body, custom: true };
    }));

    all.forEach(function (preset) {
      var button = document.createElement('button');
      button.className = 'ai-preset';
      button.title = preset.body;

      var name = document.createElement('span');
      name.textContent = preset.name;
      button.appendChild(name);

      // 自分で登録したものは、組み込みと見分けられるようにする
      if (preset.custom) {
        var mark = document.createElement('i');
        mark.textContent = '登録';
        button.appendChild(mark);
      }

      button.classList.toggle('active', preset.key === state.aiPreset);

      button.addEventListener('click', function () {
        state.aiPreset = preset.key;
        renderAiPresets();
        buildPrompt();
      });

      box.appendChild(button);
    });

    // 選んだものが見えていないと、どこにいるのか分からない
    var here = box.querySelector('.ai-preset.active');
    if (here && here.scrollIntoView) here.scrollIntoView({ block: 'nearest' });

    renderAiPresetBody();
  }

  /** 選んだ依頼で、AIへ実際に渡す文を見せる */
  function renderAiPresetBody() {
    var out = el['ai-preset-body'];
    if (!out) return;

    var preset = currentPreset();
    out.textContent = preset.body || '';
  }

  function currentPreset() {
    var all = AI_PRESETS.concat(state.prompts.map(function (prompt) {
      return { key: prompt.id, name: prompt.name, body: prompt.body };
    }));

    return all.filter(function (preset) { return preset.key === state.aiPreset; })[0] || AI_PRESETS[0];
  }

  /** 依頼・前提・出力形式・現在のHTMLを組み立てる */
  function buildPrompt() {
    var preset = currentPreset();
    var question = el['ai-question'].value.trim();
    var includeHtml = el['ai-include'].checked;

    var lines = [
      'あなたはHTMLメールの制作者です。次の依頼に答えてください。',
      '',
      '# 依頼',
      preset.body
    ];

    if (question) lines.push(question);

    // 依頼の種類ごとに気をつけてほしいこと。持っている依頼だけ。
    if (preset.extra) lines.push('', '# この依頼での注意', preset.extra.join('\n'));

    lines.push('', '# 守ってほしい前提', AI_RULES, '', '# 出力の形式');

    if (includeHtml) {
      lines.push(
        '修正後のHTML全文を、```html で始まるコードブロックひとつだけで返してください。',
        'コードブロックの外に説明を書く場合は、コードブロックのあとにまとめてください。',
        '',
        '# 現在のHTML',
        '```html',
        currentSource().trim(),
        '```'
      );
    } else {
      lines.push(
        'HTMLを提示する場合は、```html で始まるコードブロックひとつだけにまとめてください。',
        '文章の提案だけで足りる場合は、そのまま日本語で答えてください。'
      );
    }

    el['ai-prompt'].value = lines.join('\n');
  }

  function copyPrompt() {
    copyText(el['ai-prompt'].value);
  }

  // --- 回答の取り込み -------------------------------------------------------

  /** ```html … ``` の囲みを外し、HTMLだけを取り出す */
  function extractHtml(text) {
    var fenced = String(text).match(/```(?:html)?\s*\n([\s\S]*?)```/i);
    return (fenced ? fenced[1] : String(text)).trim();
  }

  function checkAnswer() {
    var html = extractHtml(el['ai-answer'].value);

    if (!html) {
      showAiStatus('取り込む内容がありません。AIの回答を貼り付けてください。', true);
      return null;
    }
    if (!/<[a-z][\s\S]*>/i.test(html)) {
      showAiStatus('HTMLが見つかりません。コードブロックごと貼り付けても構いません。', true);
      return null;
    }

    var isFullDocument = /<html[\s>]/i.test(html);
    showAiStatus(isFullDocument
      ? 'HTML全文として読み取れました（' + html.length + '文字）。「全体を置き換える」が使えます。'
      : '部分的なHTMLとして読み取れました（' + html.length + '文字）。「選択位置に挿入」が使えます。');

    return { html: html, isFullDocument: isFullDocument };
  }

  function applyAnswer(mode) {
    var result = checkAnswer();
    if (!result) return;

    if (mode === 'replace') {
      if (!result.isFullDocument &&
          !window.confirm('貼り付けられた内容は HTML の全文ではないようです。\n本文をこの内容で置き換えますか？')) {
        return;
      }

      pushUndo();
      setSource(result.html, true);
      hide(el['ai-modal']);
      setStatus('AIの回答で置き換えました（Ctrl + Z で戻せます）', 'ok');
      return;
    }

    if (!wys.doc) {
      showAiStatus('挿入するにはプレビューを表示してください。', true);
      return;
    }

    hide(el['ai-modal']);
    insertRow(result.html, 'AIの回答');
  }

  function showAiStatus(text, isError) {
    el['ai-status'].textContent = text;
    el['ai-status'].classList.toggle('warn', !!isError);
    show(el['ai-status']);
  }

  function hideAiStatus() {
    el['ai-status'].textContent = '';
    hide(el['ai-status']);
  }

  // --- 依頼の登録・編集 -----------------------------------------------------

  function openPrompts() {
    renderPromptList();
    editPrompt(null);
    show(el['prompt-modal']);
  }

  function renderPromptList() {
    var list = el['prompt-list'];
    list.textContent = '';

    if (!state.prompts.length) {
      list.appendChild(emptyNode('まだ登録された依頼はありません。右側に名前と指示を書いて「この内容で登録」を押すと、ここに並びます。'));
      return;
    }

    state.prompts.forEach(function (prompt) {
      var item = document.createElement('div');
      item.className = 'item' + (prompt.id === state.editingPromptId ? ' active' : '');

      var name = document.createElement('div');
      name.className = 'item-title';
      name.textContent = prompt.name;
      item.appendChild(name);

      var body = document.createElement('div');
      body.className = 'item-meta';
      body.textContent = prompt.body.slice(0, 60);
      item.appendChild(body);

      var actions = document.createElement('div');
      actions.className = 'item-actions';
      actions.appendChild(smallButton('編集', function () { editPrompt(prompt); }));
      actions.appendChild(smallButton('削除', function () {
        if (!window.confirm('依頼「' + prompt.name + '」を削除します。よろしいですか？')) return;
        call('deletePrompt', prompt.id).then(function (prompts) {
          state.prompts = prompts || [];
          if (state.editingPromptId === prompt.id) editPrompt(null);
          renderPromptList();
          renderAiPresets();
          setStatus('依頼を削除しました', 'ok');
        }, function (err) {
          setStatus(message(err), 'err');
        });
      }, 'danger'));

      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  function editPrompt(prompt) {
    state.editingPromptId = prompt ? prompt.id : null;
    el['prompt-name'].value = prompt ? prompt.name : '';
    el['prompt-body'].value = prompt ? prompt.body : '';
    el['prompt-editing'].textContent = prompt
      ? '「' + prompt.name + '」を編集中'
      : '新しい依頼として登録します';
    renderPromptList();
  }

  function storePrompt() {
    var payload = {
      id: state.editingPromptId,
      name: el['prompt-name'].value,
      body: el['prompt-body'].value
    };

    el['prompt-save'].disabled = true;
    call('savePrompt', payload).then(function (prompts) {
      el['prompt-save'].disabled = false;
      state.prompts = prompts || [];
      editPrompt(null);
      renderAiPresets();
      setStatus('依頼を登録しました', 'ok');
    }, function (err) {
      el['prompt-save'].disabled = false;
      setStatus(message(err), 'err');
    });
  }

  // -------------------------------------------------------------------------
  // Webページ用の書き出し
  //
  // メール用HTMLは Outlook 対策で align / bgcolor / cellpadding といった
  // HTML5では廃止された属性を使っている。Webページとして使うときは、
  // それらを同じ意味のCSSへ置き換え、レスポンシブ用のCSSと見出しを補う。
  // -------------------------------------------------------------------------

  /** 廃止属性 → CSS の対応。tag は適用対象を絞りたいときだけ指定する */
  var ATTR_TO_CSS = [
    { attr: 'bgcolor', prop: 'background-color' },
    { attr: 'valign', prop: 'vertical-align' },
    { attr: 'align', prop: 'text-align', tags: ['TD', 'TH', 'TR', 'P', 'DIV'] }
  ];

  var RESPONSIVE_CSS = [
    '      img { max-width: 100%; height: auto; }',
    '      table { border-collapse: collapse; }',
    '      @media (max-width: 640px) {',
    '        .wrap { width: 100% !important; }',
    '        .col { width: 100% !important; float: none !important; display: block !important; }',
    '        .pad { padding-left: 16px !important; padding-right: 16px !important; }',
    '      }'
  ].join('\n');

  /**
   * メール用HTMLをWebページ向けに変換する。
   * @param {string} html
   * @param {Object} options {headings, responsive}
   * @return {Object} {html, report}
   */
  function convertForWeb(html, options) {
    options = options || {};

    var doc = new DOMParser().parseFromString(html, 'text/html');
    var report = { attributes: 0, headings: 0, columns: 0 };

    convertObsoleteAttributes(doc, report);

    if (options.responsive !== false) {
      tagResponsiveHooks(doc, report);
    }
    if (options.headings !== false) {
      promoteHeadings(doc, report);
    }

    ensureViewport(doc);

    if (options.responsive !== false) {
      appendStyle(doc, RESPONSIVE_CSS);
    }

    var doctype = doc.doctype ? '<!DOCTYPE ' + doc.doctype.name + '>\n' : '<!DOCTYPE html>\n';
    return { html: doctype + doc.documentElement.outerHTML + '\n', report: report };
  }

  /** style に未指定のときだけ書き込む（元の指定を上書きしない） */
  function setStyleIfAbsent(elem, property, value) {
    if (!value) return false;
    if (elem.style.getPropertyValue(property)) return false;
    elem.style.setProperty(property, value);
    return true;
  }

  function convertObsoleteAttributes(doc, report) {
    ATTR_TO_CSS.forEach(function (rule) {
      doc.querySelectorAll('[' + rule.attr + ']').forEach(function (elem) {
        if (rule.tags && rule.tags.indexOf(elem.tagName) === -1) return;
        setStyleIfAbsent(elem, rule.prop, elem.getAttribute(rule.attr));
        elem.removeAttribute(rule.attr);
        report.attributes++;
      });
    });

    // table の align は回り込みなので text-align では代替できない
    doc.querySelectorAll('table[align], img[align]').forEach(function (elem) {
      var value = (elem.getAttribute('align') || '').toLowerCase();
      if (value === 'left' || value === 'right') {
        setStyleIfAbsent(elem, 'float', value);
      } else if (value === 'center') {
        setStyleIfAbsent(elem, 'margin-left', 'auto');
        setStyleIfAbsent(elem, 'margin-right', 'auto');
      }
      elem.removeAttribute('align');
      report.attributes++;
    });

    // 幅・高さ。img の width/height は HTML5 でも有効なので触らない
    doc.querySelectorAll('table[width], td[width], th[width], table[height], td[height]')
      .forEach(function (elem) {
        ['width', 'height'].forEach(function (name) {
          var raw = elem.getAttribute(name);
          if (!raw) return;
          setStyleIfAbsent(elem, name, /%$/.test(raw) ? raw : parseInt(raw, 10) + 'px');
          elem.removeAttribute(name);
          report.attributes++;
        });
      });

    doc.querySelectorAll('table[border], table[cellpadding], table[cellspacing]')
      .forEach(function (table) {
        var padding = parseInt(table.getAttribute('cellpadding'), 10);
        var border = parseInt(table.getAttribute('border'), 10);

        if (!isNaN(border)) {
          setStyleIfAbsent(table, 'border', border ? border + 'px solid currentColor' : '0');
        }
        setStyleIfAbsent(table, 'border-collapse',
          parseInt(table.getAttribute('cellspacing'), 10) ? 'separate' : 'collapse');

        // cellpadding は各セルの padding に置き換える
        if (padding) {
          table.querySelectorAll('td, th').forEach(function (cell) {
            setStyleIfAbsent(cell, 'padding', padding + 'px');
          });
        }

        ['border', 'cellpadding', 'cellspacing'].forEach(function (name) {
          if (table.hasAttribute(name)) {
            table.removeAttribute(name);
            report.attributes++;
          }
        });
      });
  }

  /** メディアクエリで掴むための目印を付ける */
  function tagResponsiveHooks(doc, report) {
    doc.querySelectorAll('table').forEach(function (table) {
      // 追従指定（width:100%; max-width:600px）でも本文テーブルと判定できるようにする
      var width = parseInt(table.style.maxWidth, 10) || parseInt(table.style.width, 10) || 0;

      if (width >= 480) {
        table.classList.add('wrap');
      } else if (width > 0 && width <= 400 && table.style.float) {
        table.classList.add('col');
        report.columns++;
      }
    });

    doc.querySelectorAll('td, th').forEach(function (cell) {
      var left = parseInt(cell.style.paddingLeft, 10) || 0;
      if (left >= 24) cell.classList.add('pad');
    });
  }

  /**
   * 大きめの太字テキストを見出しに昇格させる。
   * 見た目を変えないよう、中身を font: inherit の h 要素で包むだけにする。
   */
  function promoteHeadings(doc, report) {
    var used = false;

    doc.querySelectorAll('td, div, p').forEach(function (elem) {
      if (elem.querySelector('h1, h2, h3, table, ul, ol, img')) return;
      if (!elem.textContent.trim()) return;

      var weight = elem.style.fontWeight;
      var size = parseInt(elem.style.fontSize, 10) || 0;
      if (size < 18 || (weight !== 'bold' && parseInt(weight, 10) < 600)) return;

      var level = !used ? 1 : (size >= 24 ? 2 : 3);
      used = true;

      var heading = doc.createElement('h' + level);
      heading.setAttribute('style', 'margin:0; font:inherit; color:inherit;');
      while (elem.firstChild) heading.appendChild(elem.firstChild);
      elem.appendChild(heading);

      report.headings++;
    });
  }

  function ensureViewport(doc) {
    if (doc.querySelector('meta[name="viewport"]')) return;

    var meta = doc.createElement('meta');
    meta.setAttribute('name', 'viewport');
    meta.setAttribute('content', 'width=device-width, initial-scale=1');
    if (doc.head) doc.head.appendChild(meta);
  }

  function appendStyle(doc, css) {
    if (!doc.head) return;
    var style = doc.createElement('style');
    style.textContent = '\n' + css + '\n    ';
    doc.head.appendChild(style);
  }

  // --- テキスト版 -----------------------------------------------------------
  //
  // HTMLを表示しない受信者向けの本文を作る。「テキスト版をコピー」で使う。
  // レイアウトの再現ではなく「読める順序で、欠けずに届くこと」を優先する。
  //
  // 配信システムのテキスト欄に貼る想定。Gmailの下書きには同梱しない
  // （Gmailが送信時に自前で作るため。経緯は HANDOVER.md の8章）。

  /** テキスト版に出さない要素 */
  var TEXT_DROP = 'style, script, head, title, meta, link';

  /** 行そのものとして扱う要素 */
  var TEXT_BLOCK = /^(p|div|table|td|th|ul|ol|section|article|header|footer|main|pre|address|figure|figcaption|dl|dt|dd)$/;

  var TEXT_HEADING = '■ ';
  var TEXT_BULLET = '・';
  var TEXT_RULE = '------------------------------';

  /**
   * HTMLからテキスト版を作る。
   * @param {string} html
   * @return {string}
   */
  function htmlToPlainText(html) {
    var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');

    doc.querySelectorAll(TEXT_DROP).forEach(function (node) { node.remove(); });

    // プリヘッダーなど、画面に出さないための隠し要素も落とす
    doc.querySelectorAll('[style]').forEach(function (node) {
      if (/display\s*:\s*none/i.test(node.getAttribute('style') || '')) node.remove();
    });

    var out = [];
    textNode(doc.body || doc.documentElement, out);
    return tidyText(out.join(''));
  }

  /** ノード1つをテキストにして out へ積む */
  function textNode(node, out) {
    if (node.nodeType === 3) {
      out.push(node.nodeValue.replace(/[\s\u00a0]+/g, ' '));
      return;
    }
    if (node.nodeType !== 1) return;   // コメントなど

    var tag = node.tagName.toLowerCase();
    var children = function () {
      for (var i = 0; i < node.childNodes.length; i++) textNode(node.childNodes[i], out);
    };

    switch (tag) {
      case 'br':
        out.push('\n');
        return;

      case 'hr':
        out.push('\n' + TEXT_RULE + '\n');
        return;

      case 'img':
        // 飾りの画像には alt が無いので、そのまま消える
        var alt = (node.getAttribute('alt') || '').trim();
        if (alt) out.push('[' + alt + ']');
        return;

      case 'a':
        textLink(node, out);
        return;

      case 'li':
        // 行末に改行は足さない。次の項目が行頭で改行するので、足すと空行になる
        out.push(textMarker(node));
        children();
        return;

      case 'tr':
        textRow(node, out, children);
        return;

      case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6':
        out.push('\n\n' + TEXT_HEADING);
        children();
        out.push('\n\n');
        return;

      case 'blockquote':
        out.push('\n');
        children();
        out.push('\n');
        return;
    }

    // 「区切り線」の部品は、空の div に罫線を引いているだけなので線に置き換える
    if (tag === 'div' && /border-top\s*:/i.test(node.getAttribute('style') || '')
        && !node.textContent.replace(/[\s\u00a0]/g, '')) {
      out.push('\n' + TEXT_RULE + '\n');
      return;
    }

    if (TEXT_BLOCK.test(tag)) {
      out.push('\n');
      children();
      out.push('\n');
      return;
    }

    children();   // span, strong, em, font など
  }

  /** リンクは「文言 (URL)」。文言がURLそのものなら重ねない */
  function textLink(node, out) {
    var label = textOf(node);
    var href = (node.getAttribute('href') || '').trim();

    if (!href || /^(#|mailto:|tel:)/i.test(href) || href === label) {
      out.push(label);
      return;
    }
    out.push(label ? label + ' (' + href + ')' : href);
  }

  /** 箇条書きの行頭。番号付きなら通し番号にする */
  function textMarker(node) {
    var parent = node.parentNode;
    if (!parent || parent.tagName.toLowerCase() !== 'ol') return '\n' + TEXT_BULLET;

    var order = 1;
    for (var i = 0; i < parent.children.length; i++) {
      if (parent.children[i] === node) break;
      if (parent.children[i].tagName.toLowerCase() === 'li') order++;
    }
    return '\n' + order + '. ';
  }

  /**
   * 表の行。
   *
   * 情報テーブルのように1行に2つ以上の中身があるときだけ「項目: 内容」にまとめる。
   * 体裁のためのテーブル（セルが1つ）は、そのまま中身を流す。2カラムの部品は
   * テーブルを2つ横に並べる作りなので、こちらも1セル扱いになり縦に並ぶ。
   */
  function textRow(node, out, children) {
    var cells = [];

    for (var i = 0; i < node.children.length; i++) {
      var tag = node.children[i].tagName.toLowerCase();
      if (tag === 'td' || tag === 'th') cells.push(textOf(node.children[i]));
    }

    var filled = cells.filter(function (text) { return text !== ''; });

    if (cells.length >= 2 && filled.length >= 2) {
      out.push('\n' + filled.join(filled.length === 2 ? ': ' : ' | '));
      return;
    }

    out.push('\n');
    children();
    out.push('\n');
  }

  /** 要素の中身だけをテキストにして返す */
  function textOf(node) {
    var buf = [];
    for (var i = 0; i < node.childNodes.length; i++) textNode(node.childNodes[i], buf);
    return tidyText(buf.join(''));
  }

  /** 余分な空白と空行を整える。空行は最大1行 */
  function tidyText(text) {
    return String(text)
      .replace(/[ \t]+/g, ' ')
      .replace(/ *\n */g, '\n')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  // --- 画面 -----------------------------------------------------------------

  function openWebExport() {
    runWebExport();
    show(el['web-modal']);
  }

  function runWebExport() {
    var result = convertForWeb(currentSource(), {
      headings: el['web-headings'].checked,
      responsive: el['web-responsive'].checked
    });

    state.webExport = result.html;
    el['web-output'].value = result.html;
    el['web-report'].textContent = '廃止属性を ' + result.report.attributes + ' 箇所CSSへ変換'
      + '／見出しを ' + result.report.headings + ' 箇所昇格'
      + '／カラムを ' + result.report.columns + ' 箇所レスポンシブ化しました。';
  }

  function copyWebExport() {
    copyText(state.webExport);
  }

  function saveWebExport() {
    if (!writable(state.location)) {
      setStatus('この保存場所には書き込めません', 'err');
      return;
    }

    var title = sanitizeName(el.title.value || '無題') + '（Web版）';

    setBusy(true, '保存中…');
    call('saveDoc', {
      id: null,
      location: state.location,
      title: title,
      tags: parseTags(el.tags.value),
      html: state.webExport
    }).then(function (result) {
      setBusy(false, '「' + result.title + '」として保存しました', 'ok');
      hide(el['web-modal']);
      refreshList();
      openDoc(result.id);
    }, function (err) {
      setBusy(false, message(err), 'err');
    });
  }

  function sanitizeName(text) {
    return String(text).replace(/（Web版）$/, '').trim();
  }

  // -------------------------------------------------------------------------
  // 保存場所
  // -------------------------------------------------------------------------

  function refreshLocations() {
    return call('getLocations').then(function (locations) {
      state.locations = locations || {};

      // 共有側が使えなくなっていたらマイドライブへ戻す
      if (state.location === 'shared' && !usable('shared')) {
        state.location = 'my';
        state.id = null;
      }

      renderLocationBar();
      updateButtons();
    }, function (err) {
      setStatus(message(err), 'err');
    });
  }

  function locationInfo(key) {
    return state.locations[key] || {};
  }

  /** その保存場所が読み取りだけでも使える状態か */
  function usable(key) {
    var info = locationInfo(key);
    return key === 'my' ? true : (info.configured && !info.error);
  }

  /** 書き込みできる保存場所か */
  function writable(key) {
    var info = locationInfo(key);
    return key === 'my' ? info.canWrite !== false : (usable(key) && !!info.canWrite);
  }

  function renderLocationBar() {
    el['loc-my'].classList.toggle('active', state.location === 'my');
    el['loc-shared'].classList.toggle('active', state.location === 'shared');
    el['loc-shared'].disabled = !usable('shared');

    // コピー・移動の相手先は常にもう一方
    var other = state.location === 'my' ? 'shared' : 'my';
    var otherLabel = other === 'my' ? 'マイドライブ' : '共有の場所';
    // textContent で書き換えるとアイコンのSVGごと消えるので、説明は title に入れる
    setHint(el['copy-to'], otherLabel + 'へコピー');
    setHint(el['move-to'], otherLabel + 'へ移動');

    // 行き先が変わると説明もずれるので、あわせて直す
    setNote(el['copy-to'], '原稿を' + otherLabel + 'へ複製します');
    setNote(el['move-to'], '原稿を' + otherLabel + 'へ移します');
  }

  /** 行き先の名前を差し替える。アイコンは消さずに、文字の部分だけ入れ替える */
  function setHint(button, text) {
    button.title = text;
    button.setAttribute('aria-label', text);

    var label = button.querySelector('.label');
    if (label) label.textContent = text;
  }

  /** メニュー項目の一行説明を差し替える */
  function setNote(button, text) {
    var note = button.querySelector('.mi span');
    if (note) note.textContent = text;
  }

  function switchLocation(key) {
    if (state.location === key) return;
    confirmDiscard(function () {
      state.location = key;
      state.id = null;
      state.activeTag = '';
      renderLocationBar();
      newDoc(defaultHtml());
      refreshList();
    });
  }


  // --- 保存先の設定 ---------------------------------------------------------


  function appendOption(select, value, label) {
    var option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    select.appendChild(option);
  }







  // --- コピーと移動 ---------------------------------------------------------

  function transferDoc(isMove) {
    if (!state.id || state.busy) return;

    var to = state.location === 'my' ? 'shared' : 'my';
    var toLabel = to === 'my' ? 'マイドライブ' : '共有ドライブ';

    if (!writable(to)) {
      setStatus(toLabel + 'に書き込めません。保存先の設定と権限をご確認ください。', 'err');
      return;
    }

    if (isMove && !window.confirm(
      '「' + state.baselineTitle + '」を' + toLabel + 'へ移動します。\n\n'
      + 'コピーを作ってから元をゴミ箱へ送ります。版の履歴は移動先へ引き継がれません。\n続けますか？'
    )) {
      return;
    }

    confirmDiscard(function () {
      setBusy(true, isMove ? '移動中…' : 'コピー中…');

      call(isMove ? 'moveDocTo' : 'copyDocTo', state.location, state.id, to)
        .then(function (result) {
          setBusy(false, toLabel + 'へ' + (isMove ? '移動' : 'コピー') + 'しました', 'ok');
          state.location = to;
          state.activeTag = '';
          renderLocationBar();
          refreshList();
          openDoc(result.id);
        }, function (err) {
          setBusy(false, message(err), 'err');
        });
    });
  }

  // -------------------------------------------------------------------------
  // 署名
  // -------------------------------------------------------------------------

  function openSignatures() {
    renderSignatures();
    editSignature(null);
    show(el['signature-modal']);
  }

  function renderSignatures() {
    var list = el['signature-list'];
    list.textContent = '';

    if (!state.signatures.length) {
      list.appendChild(emptyNode('まだ署名が登録されていません。右側で内容を書いて「この内容で登録」を押すと、ここに並びます。'));
      return;
    }

    state.signatures.forEach(function (signature) {
      var item = document.createElement('div');
      item.className = 'item' + (signature.id === state.editingSignatureId ? ' active' : '');

      var name = document.createElement('div');
      name.className = 'item-title';
      name.textContent = signature.name;
      item.appendChild(name);

      var actions = document.createElement('div');
      actions.className = 'item-actions';

      actions.appendChild(smallButton('挿入', function () {
        insertRow(signature.html, signature.name);
        hide(el['signature-modal']);
      }, 'primary'));

      actions.appendChild(smallButton('編集', function () { editSignature(signature); }));

      actions.appendChild(smallButton('削除', function () {
        if (!window.confirm('署名「' + signature.name + '」を削除します。よろしいですか？')) return;
        call('deleteSignature', signature.id).then(function (signatures) {
          state.signatures = signatures || [];
          if (state.editingSignatureId === signature.id) editSignature(null);
          renderSignatures();
          setStatus('署名を削除しました', 'ok');
        }, function (err) {
          setStatus(message(err), 'err');
        });
      }, 'danger'));

      item.appendChild(actions);
      list.appendChild(item);
    });
  }

  function smallButton(label, onClick, variant) {
    var button = document.createElement('button');
    button.textContent = label;
    if (variant) button.className = variant;
    button.addEventListener('click', onClick);
    return button;
  }

  /** 署名で使う書体。テンプレートの既定と揃える */
  var SIGNATURE_FONT = "'Hiragino Sans','Yu Gothic',Meiryo,sans-serif";

  /*
     署名の中身は「文章」と「見た目」に分けて持つ。

     以前はHTMLをそのまま書かせていた。だが署名で変えたいのは、文面と、
     文字の大きさ・行間・色くらいで、そのためにタグを書かせる理由がない。
     プレビューに入れるだけの機能なので、なおさら。

     とはいえ、これまでに登録したものはHTMLで入っている。読み戻せない形の
     ものを黙って作り変えると、書いたものが失われる。**読み戻せたものだけ
     組み立てで扱い、読み戻せなかったものはHTMLのまま編集させる。**
  */

  var SIGNATURE_LOOK = {
    size: '13px',
    height: '1.8',
    color: '#6b7280'
  };

  var SIGNATURE_TEXT = [
    '────────────────────',
    '株式会社サンプル　営業部',
    '山田 太郎',
    'TEL: 00-0000-0000 / MAIL: sample@example.com',
    '〒000-0000 東京都〇〇区〇〇 0-0-0'
  ].join('\n');

  /** 文章と見た目から、署名のHTMLを組み立てる */
  function signatureHtml(text, look) {
    var lines = String(text).split(/\r?\n/).map(escapeText);

    return '<div style="font-family:' + SIGNATURE_FONT
      + '; font-size:' + look.size
      + '; line-height:' + look.height
      + '; color:' + look.color + ';">\n'
      + lines.map(function (line, i) {
        return '  ' + line + (i < lines.length - 1 ? '<br />' : '');
      }).join('\n')
      + '\n</div>';
  }

  /**
   * 署名のHTMLを、文章と見た目に読み戻す。
   *
   * 組み立てたときと同じ形（div ひとつに、<br> で区切った文字だけ）の
   * ときだけ返す。表や画像やリンクが入っていたら null を返し、
   * HTMLのまま編集させる。**読めない形を無理に読むと、中身が消える。**
   */
  function signatureParts(html) {
    var box = document.createElement('div');
    box.innerHTML = String(html || '').trim();

    var root = box.firstElementChild;
    if (!root || box.children.length !== 1) return null;
    if (root.tagName !== 'DIV') return null;

    // 中身が <br> と文字だけであること
    var ok = Array.prototype.every.call(root.childNodes, function (node) {
      return node.nodeType === 3 || (node.nodeType === 1 && node.tagName === 'BR');
    });
    if (!ok) return null;

    var style = root.style;

    /*
       <br> で切って、切れ端ごとに文字を取り出す。

       組み立てたHTMLは読みやすさのために行ごとに改行を入れてある。
       <br> をそのまま改行に置き換えると、そのあとの文字ノードが持つ
       改行と字下げも数えて、区切りが2行になる。
    */
    var text = root.innerHTML
      .split(/<br\s*\/?>/i)
      .map(function (part) {
        var piece = document.createElement('div');
        piece.innerHTML = part;
        return (piece.textContent || '').trim();
      })
      .join('\n');

    return {
      text: text,
      look: {
        size: style.fontSize || SIGNATURE_LOOK.size,
        height: style.lineHeight || SIGNATURE_LOOK.height,
        color: toHex(style.color) || SIGNATURE_LOOK.color
      }
    };
  }


  /** いま画面に入っている見た目 */
  function signatureLook() {
    return {
      size: el['signature-size'].value || SIGNATURE_LOOK.size,
      height: el['signature-height'].value || SIGNATURE_LOOK.height,
      color: el['signature-color'].value || SIGNATURE_LOOK.color
    };
  }

  /** 選ばれている値に印を付け直す */
  function markSignatureChoices() {
    var look = signatureLook();

    Array.prototype.forEach.call(
      el['signature-form'].querySelectorAll('.choice[data-for]'),
      function (button) {
        var target = button.getAttribute('data-for');
        var mine = button.getAttribute('data-value');
        var now = target === 'size' ? look.size : look.height;
        button.classList.toggle('active', mine === now);
      }
    );
  }

  /** 見た目を変えたら、プレビューに反映する */
  function refreshSignaturePreview() {
    markSignatureChoices();

    var look = signatureLook();
    var view = el['signature-preview'];

    view.style.fontFamily = SIGNATURE_FONT;
    view.style.fontSize = look.size;
    view.style.lineHeight = look.height;
    view.style.color = look.color;
    view.textContent = '';

    String(el['signature-text'].value).split(/\r?\n/).forEach(function (line, i) {
      if (i) view.appendChild(document.createElement('br'));
      view.appendChild(document.createTextNode(line));
    });

    el['signature-color-value'].textContent = look.color;
  }

  /** HTMLのまま編集する側に切り替える */
  function setSignatureRaw(on, html) {
    state.signatureRaw = !!on;

    el['signature-form'].classList.toggle('is-raw', state.signatureRaw);
    el['signature-html'].hidden = !state.signatureRaw;
    el['signature-simple'].hidden = state.signatureRaw;
    el['signature-raw-note'].hidden = !state.signatureRaw;

    if (state.signatureRaw && typeof html === 'string') {
      el['signature-html'].value = html;
    }
  }

  /**
   * 編集する署名を画面に載せる。
   *
   * 読み戻せた署名は組み立てで、読み戻せなかったものはHTMLのまま扱う。
   */
  function editSignature(signature) {
    state.editingSignatureId = signature ? signature.id : null;
    el['signature-name'].value = signature ? signature.name : '';

    var parts = signature ? signatureParts(signature.html) : { text: SIGNATURE_TEXT, look: SIGNATURE_LOOK };

    if (parts) {
      setSignatureRaw(false);
      el['signature-text'].value = parts.text;
      el['signature-size'].value = parts.look.size;
      el['signature-height'].value = parts.look.height;
      el['signature-color'].value = parts.look.color;
      refreshSignaturePreview();
    } else {
      setSignatureRaw(true, signature.html);
    }

    el['signature-editing'].textContent = signature
      ? '「' + signature.name + '」を編集中'
      : '新しい署名として登録します';

    renderSignatures();
  }

  function storeSignature() {
    var payload = {
      id: state.editingSignatureId,
      name: el['signature-name'].value,
      html: state.signatureRaw
        ? el['signature-html'].value
        : signatureHtml(el['signature-text'].value, signatureLook())
    };

    el['signature-save'].disabled = true;
    call('saveSignature', payload).then(function (signatures) {
      el['signature-save'].disabled = false;
      state.signatures = signatures || [];
      editSignature(null);
      setStatus('署名を登録しました', 'ok');
    }, function (err) {
      el['signature-save'].disabled = false;
      setStatus(message(err), 'err');
    });
  }

  // -------------------------------------------------------------------------
  // メールにする
  // -------------------------------------------------------------------------

  function openGmail() {
    el['gmail-subject'].value = el.subject.value;
    hideNote();
    show(el['gmail-modal']);
    el['gmail-subject'].focus();
  }

  /*
     Web版のメールを開く。

     本文はURLでは渡せない。Gmail の compose URL も Outlook の deeplink も
     body は平文として扱われ、URLの長さにも限りがある。HTMLメール1通は
     まず入らない。

     渡し方は貼り付け。描画済みのHTMLをクリップボードへ載せてから作成画面を
     開き、そこで貼ってもらう。実際にメールを作る人がやっているのと同じ手順。
  */
  var WEBMAIL = {
    gmail: {
      name: 'Gmail',
      // 狭い画面で踏んでもらう先。新規作成のURLは受信トレイへ転送される
      home: 'https://mail.google.com/',
      openLabel: 'Gmailを開く',
      url: function (to, subject) {
        return 'https://mail.google.com/mail/?view=cm&fs=1'
          + '&to=' + encodeURIComponent(to)
          + '&su=' + encodeURIComponent(subject);
      }
    },
    outlook: {
      name: 'Outlook',
      home: 'https://outlook.live.com/mail/0/',
      openLabel: 'Outlookを開く',
      url: function (to, subject) {
        return 'https://outlook.live.com/mail/0/deeplink/compose'
          + '?to=' + encodeURIComponent(to)
          + '&subject=' + encodeURIComponent(subject);
      }
    }
  };

  /*
     本文をコピーする。開くのとは分ける。

     以前は「コピーして開く」を1回の操作にしていたが、開いた先へ焦点が
     移るので、**貼り付けてくださいという案内が、利用者が去ったあとの画面に
     出ていた**。誰も読めない。押すたびに結果が見える形にする。
  */
  function copyForMail() {
    flushWys();

    var html = currentSource();

    if (copyRich(html)) {
      showNote('本文をコピーしました。作成画面を開いて貼り付けてください（Ctrl + V）。');
      setStatus('本文をコピーしました', 'ok');
      return;
    }

    // 同期の道が通らなかったときだけ、非同期を試す
    copyRichAsync(html).then(function () {
      showNote('本文をコピーしました。作成画面を開いて貼り付けてください（Ctrl + V）。');
      setStatus('本文をコピーしました', 'ok');
    }, function () {
      showNote('本文をコピーできませんでした。'
        + 'ブラウザがコピーを許可していない可能性があります。', true);
    });
  }

  /**
   * 作成画面を開く。宛先と件名は入るが、本文は貼り付けてもらう。
   *
   * 開く前に、本文のコピーもここで済ませる。
   *
   * 以前は「コピー」と「開く」を完全に別の操作にしていた。順番を守れば
   * 動くが、**守らなかったときに何も起きない**。押した本人には、
   * 貼り付けても空のままに見える。押す順番を覚えていることを、
   * 動作の前提にすべきではなかった。
   *
   * コピーはこのクリックと同じ操作の中で行うので、ブラウザからは
   * 利用者の操作として扱われる。開くのはそのあと。
   */
  function openWebmail(which) {
    var service = WEBMAIL[which];

    flushWys();

    var html = currentSource();
    var copied = copyRich(html);
    var to = el['gmail-to'].value;
    var subject = el['gmail-subject'].value;

    /*
       狭い画面では、こちらから開かない。

       ?view=cm はPC版の新規作成URLで、**スマホでは受信トレイへ転送される**
       （実機で確認）。開いた先が新規作成でないなら、こちらで開く意味がない。
       おまけに、コピーのあとに window.open を呼ぶ形は、iOSでは
       「利用者が開いた」と見なされずに止められることがある。

       押したことで確実に起きるのはコピーだけ。**それを主役にして**、
       開くのは踏めるリンクとして渡す。自分で踏んだリンクなら止められない。
    */
    if (isNarrow()) {
      showMailLink(service, to, subject, copied, html);
      return;
    }

    window.open(service.url(to, subject), '_blank', 'noopener');

    /*
       案内は2文をつなげず、ひとつの文言として持つ。

       日本語は文と文のあいだに空白が要らないので、分けて連結すると
       その形のまま英語にも出て「(Ctrl + V).If you have not」と詰まる。
       区切りは言語ごとに違うので、言語ごとに全文を持たせる。
    */
    function done() {
      setStatus('本文をコピーしました', 'ok');
      showNote(service.name + 'を開きました。本文はコピー済みです。');
    }

    if (copied) {
      done();
      return;
    }

    /*
       同期の道が通らなかったときは、非同期でも試す。

       終わるのは利用者が開いた先へ移ったあとなので、案内そのものは
       読まれない。それでもクリップボードには入るので、貼り付けは通る。
    */
    copyRichAsync(html).then(done, function () {
      showNote(service.name + 'を開きました。作成画面で貼り付けてください（Ctrl + V）。まだコピーしていなければ、先に「本文をコピー」を押してください。');
    });
  }

  /** 非同期の道。text/html として載せる */
  function copyRichAsync(html) {
    if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) {
      return Promise.reject(new Error('この環境では使えません'));
    }

    var body = bodyOf(html);

    return navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([body], { type: 'text/html' }),
        'text/plain': new Blob([htmlToPlainText(html)], { type: 'text/plain' })
      })
    ]);
  }

  /*
     描画済みのHTMLとしてクリップボードへ載せる。

     text/plain で載せるとHTMLのコードがそのまま貼られてしまう。
     見た目のまま貼るには text/html として載せる必要がある。

     **載せるものは自分で決める。** はじめは選択範囲をブラウザに書き出させて
     いたが、それだと何が載ったのかこちらから確かめられず、空のまま気づけない。
     copy の合図を捕まえて、text/html と text/plain を自分で入れる。
     合図が来たかどうかで、載ったことも確かめられる。

     execCommand を使うのは**同期で終わる**から。新しい clipboard API は
     非同期で、待っているあいだに焦点が移ると断られることがある。
  */
  function copyRich(html) {
    var body = bodyOf(html);
    var text = htmlToPlainText(html);
    var loaded = false;

    function onCopy(event) {
      if (!event.clipboardData) return;
      event.clipboardData.setData('text/html', body);
      event.clipboardData.setData('text/plain', text);
      event.preventDefault();
      loaded = true;
    }

    document.addEventListener('copy', onCopy, true);

    /*
       選ぶものが無いと copy の合図は飛ばない。中身は何でもよいので、
       見えない場所に一文字だけ置いて選ぶ。

       画面の外（left:-9999px）へは出さない。描かれていない要素からの
       コピーを断るブラウザがあるため、1pxに切り詰めて置く。
    */
    var holder = document.createElement('div');
    holder.setAttribute('contenteditable', 'true');
    holder.style.cssText =
      'position:fixed; top:0; left:0; width:1px; height:1px;'
      + ' overflow:hidden; opacity:0; z-index:-1;';
    holder.textContent = ' ';

    document.body.appendChild(holder);

    var range = document.createRange();
    range.selectNodeContents(holder);

    var picked = window.getSelection();
    picked.removeAllRanges();
    picked.addRange(range);
    holder.focus({ preventScroll: true });

    var ran = false;
    try { ran = document.execCommand('copy'); } catch (err) { ran = false; }

    picked.removeAllRanges();
    document.body.removeChild(holder);
    document.removeEventListener('copy', onCopy, true);

    // 合図が来て、こちらが入れたときだけ成功とみなす
    return ran && loaded;
  }

  /** <body> の中身だけを取り出す。head や doctype は貼り付け先で捨てられる */
  function bodyOf(html) {
    try {
      var doc = new DOMParser().parseFromString(String(html), 'text/html');
      if (doc && doc.body) return doc.body.innerHTML;
    } catch (err) {
      // 読めなければ、そのまま渡す
    }
    return String(html);
  }

  function createDraft() {
    flushWys();

    var payload = {
      to: el['gmail-to'].value,
      subject: el['gmail-subject'].value,
      html: currentSource()
    };

    showNote('書き出しています…');

    call('createGmailDraft', payload).then(function () {
      showNote('ファイルに書き出しました。メールソフトで開くと下書きになります。');
      setStatus('メールソフト用に書き出しました', 'ok');
    }, function (err) {
      showNote(message(err), true);
    });
  }

  /*
     狭い画面での案内。コピーの結果を伝え、開く先はリンクで渡す。

     背景色について一言添える。**Gmailのアプリに貼ると背景色が落ちる**
     （アプリ側の貼り付けの掃除によるもので、こちらからは変えられない）。
     ブラウザのGmailなら残る。どちらで開くかで結果が変わるので、
     ここで言っておかないと、送ったあとに気づくことになる。
  */
  function showMailLink(service, to, subject, copied, html) {
    var note = el['gmail-note'];

    function draw(ok) {
      note.textContent = '';
      note.classList.toggle('err', !ok);

      var head = document.createElement('p');
      head.className = 'mail-step';
      head.textContent = ok
        ? '本文をコピーしました。下のリンクからGmailやOutlookを開き、新規作成に貼り付けてください。'
        : 'コピーできませんでした。「本文だけコピー」を押してから、下のリンクを開いてください。';
      note.appendChild(head);

      /*
         「Gmail」＋「を開く」と繋げない。日本語では繋がるが、英語では
         語順が違って「Gmailを開く」の形にならない。サービスごとに
         全文を持たせる（署名の案内でも同じ理由で分けている）。
      */
      var link = document.createElement('a');
      link.className = 'mail-link';
      link.href = service.home;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = service.openLabel;
      note.appendChild(link);

      var why = document.createElement('p');
      why.className = 'mail-why';
      why.textContent = 'ブラウザ版で開いてください。アプリに貼り付けると、背景色が落ちます。';
      note.appendChild(why);

      show(note);
    }

    if (copied) {
      setStatus('本文をコピーしました', 'ok');
      draw(true);
      return;
    }

    copyRichAsync(html).then(function () {
      setStatus('本文をコピーしました', 'ok');
      draw(true);
    }, function () { draw(false); });
  }

  function showNote(text, isError) {
    var note = el['gmail-note'];
    note.textContent = text;
    note.classList.toggle('err', !!isError);
    show(note);
  }

  function hideNote() {
    el['gmail-note'].textContent = '';
    el['gmail-note'].classList.remove('err');
    hide(el['gmail-note']);
  }

  // -------------------------------------------------------------------------
  // ドキュメント操作
  // -------------------------------------------------------------------------

  function defaultHtml() {
    return state.templates.length ? state.templates[0].html : FALLBACK_HTML;
  }

  function newDoc(html) {
    state.id = null;
    state.baseline = html;
    state.baselineTitle = '無題';
    state.baselineTags = '';
    el.title.value = '無題';
    el.tags.value = '';
    setSource(html);
    renderList();
    updateButtons();
  }

  function openDoc(id) {
    confirmDiscard(function () {
      setBusy(true, '読み込み中…');
      call('loadDoc', state.location, id).then(function (doc) {
        applyDoc(doc);
        setBusy(false, '');
      }, function (err) {
        setBusy(false, message(err), 'err');
      });
    });
  }

  function applyDoc(doc) {
    var tags = (doc.tags || []).join(', ');
    state.id = doc.id;
    state.baseline = doc.html;
    state.baselineTitle = doc.title;
    state.baselineTags = tags;
    el.title.value = doc.title;
    el.tags.value = tags;
    setSource(doc.html);
    renderList();
    updateButtons();
  }

  function save() {
    if (state.busy) return;

    // 件名欄の入力途中も取り込む
    commitSubject();
    if (wys.doc && (wys.editing || wys.pendingInput)) syncFromWys();

    if (!writable(state.location)) {
      setStatus('この保存場所には書き込めません。マイドライブへコピーしてから編集してください。', 'err');
      return;
    }

    var payload = {
      id: state.id,
      location: state.location,
      title: el.title.value,
      tags: parseTags(el.tags.value),
      html: currentSource()
    };

    setBusy(true, '保存中…');
    call('saveDoc', payload).then(function (result) {
      state.id = result.id;
      state.baseline = payload.html;
      state.baselineTitle = result.title;
      state.baselineTags = (result.tags || []).join(', ');
      el.title.value = result.title;
      el.tags.value = state.baselineTags;
      setBusy(false, '保存しました', 'ok');
      refreshList();
    }, function (err) {
      setBusy(false, message(err), 'err');
    });
  }

  function duplicate() {
    if (!state.id || state.busy) return;

    confirmDiscard(function () {
      setBusy(true, '複製中…');
      call('duplicateDoc', state.location, state.id).then(function (result) {
        setBusy(false, '複製しました', 'ok');
        refreshList();
        openDoc(result.id);
      }, function (err) {
        setBusy(false, message(err), 'err');
      });
    });
  }

  function askDelete() {
    if (!state.id) return;
    pendingDeleteId = state.id;
    el['confirm-body'].textContent =
      '「' + state.baselineTitle + '」と、その版の履歴をドライブのゴミ箱へ移動します。ドライブのゴミ箱から復元できます。';
    show(el.confirm);
    el['confirm-cancel'].focus();
  }

  function doDelete() {
    var id = pendingDeleteId;
    closeConfirm();
    if (!id) return;

    setBusy(true, '削除中…');
    call('trashDoc', state.location, id).then(function () {
      setBusy(false, 'ゴミ箱へ移動しました', 'ok');
      refreshList();
      newDoc(defaultHtml());
    }, function (err) {
      setBusy(false, message(err), 'err');
    });
  }

  function closeConfirm() {
    pendingDeleteId = null;
    hide(el.confirm);
  }

  function openInNewTab() {
    if (!state.id || !state.webAppUrl) return;
    window.open(state.webAppUrl + '?view=' + encodeURIComponent(state.id), '_blank');
  }

  /**
   * ソースをクリップボードへ。
   * GASのiframe内では Clipboard API が拒否されることがあるため execCommand を用意しておく。
   */
  function copyHtml() {
    flushWys();
    copyText(currentSource());
  }

  /** HTMLを表示しない受信者向けのテキスト版をコピーする */
  function copyPlainText() {
    flushWys();
    copyText(htmlToPlainText(currentSource()));
  }

  /** プレビュー上で編集中なら、先にソースへ書き戻す */
  function flushWys() {
    if (wys.doc && (wys.editing || wys.pendingInput)) syncFromWys();
  }

  /**
   * クリップボードへ書き込む。
   * GASのiframe内では Clipboard API が拒否されることがあるため execCommand を用意しておく。
   */
  function copyText(text) {
    var fallback = function () {
      var area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      document.body.removeChild(area);
      setStatus(ok ? 'コピーしました' : 'コピーできませんでした', ok ? 'ok' : 'err');
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus('コピーしました', 'ok');
      }, fallback);
    } else {
      fallback();
    }
  }

  // -------------------------------------------------------------------------
  // テンプレート
  // -------------------------------------------------------------------------

  function openTemplates() {
    renderTemplateList();
    closeTemplateSave();
    show(el['template-modal']);
    loadCustomTemplates();
  }

  /**
   * カスタムテンプレートを読む。
   *
   * 起動時ではなく、この画面を開いたときに読む。ドライブのファイルを
   * 1件ずつ開くので、置き場が増えるほど時間がかかる。使わない人にまで
   * その待ち時間を負わせないための切り分け。
   *
   * 開くたびに読み直すのは、共有ぶんが他の人に書き換わるため。
   */
  function loadCustomTemplates() {
    if (state.customLoading) return;
    state.customLoading = true;

    call('getCustomTemplates').then(function (custom) {
      state.custom = custom || state.custom;
      state.customLoaded = true;
      state.customLoading = false;
      if (!el['template-modal'].hidden) renderTemplateList();
    }, function () {
      // 読めなくても組み込みぶんは出す
      state.customLoaded = true;
      state.customLoading = false;
      if (!el['template-modal'].hidden) renderTemplateList();
    });
  }

  /**
   * 組み込みぶんとカスタムぶんを、分類ごとに並べる。
   *
   * カスタムぶんを先頭に置く。自分たちで作った型のほうが用が合うため。
   */
  function renderTemplateList() {
    var list = el['template-list'];
    var keep = list.scrollTop;
    list.textContent = '';

    // 前回のカードの監視を解く。画面に入らなかったものは解除されないまま
    // 残り、開くたびに古いDOMが積み上がるため。
    if (thumbWatcher) {
      thumbWatcher.disconnect();
      thumbWatcher = null;
    }

    // 同じ内容を、好きな見た目で選べるようにする
    if (typeof THEMES !== 'undefined') {
      list.appendChild(themePicker());
      list.appendChild(accentPicker());
    }

    var mine = customItems('mine');
    var all = mine.concat(state.templates);

    // 読み込みの途中に開かれることがある。取れ次第ここが呼び直される。
    if (!all.length && !customError('mine')) {
      list.appendChild(emptyNode(state.loadFailed
        ? 'テンプレートを取得できませんでした。'
        : 'テンプレートを読み込んでいます…'));
      return;
    }

    var categories = [MY_CATEGORY];
    state.categories.forEach(function (category) {
      if (categories.indexOf(category) === -1) categories.push(category);
    });
    all.forEach(function (template) {
      var category = template.category || 'その他';
      if (categories.indexOf(category) === -1) categories.push(category);
    });

    categories.forEach(function (category) {
      var items = all.filter(function (template) {
        return (template.category || 'その他') === category;
      });
      var note = categoryNote(category, items.length);

      if (!items.length && !note) return;

      var group = document.createElement('div');
      group.className = 'template-group';

      var heading = document.createElement('h3');
      heading.textContent = items.length ? category + '（' + items.length + '）' : category;
      group.appendChild(heading);

      if (note) {
        var box = document.createElement('div');
        box.className = 'tpl-note';
        box.textContent = note;
        group.appendChild(box);
      }

      if (items.length) {
        var grid = document.createElement('div');
        grid.className = 'template-grid';
        items.forEach(function (template) { grid.appendChild(templateCard(template)); });
        group.appendChild(grid);
      }

      list.appendChild(group);
    });

    list.scrollTop = keep;
  }

  /**
   * 配色の選び方。テンプレート一覧の先頭に置く。
   *
   * 一覧そのものを5倍に増やす作りにはしていない。170枚を眺めるのは
   * 探すのが大変になるだけで、選びやすくはならない。
   * **先に見た目を決めて、そのうえで34件から選ぶ**ほうが早い。
   */
  function themePicker() {
    var wrap = document.createElement('div');
    wrap.className = 'theme-row';

    var label = document.createElement('span');
    label.className = 'theme-label';
    label.textContent = '配色';
    wrap.appendChild(label);

    THEMES.forEach(function (theme) {
      var button = document.createElement('button');
      button.className = 'theme-chip' + (theme.key === state.theme ? ' active' : '');
      button.dataset.theme = theme.key;
      button.textContent = theme.name;
      button.title = theme.note;

      button.addEventListener('click', function () {
        if (state.theme === theme.key) return;

        state.theme = theme.key;
        state.accent = '';                     // ジャンルごとに差し色は違う
        call('setTemplateTheme', state.theme, state.accent);
        renderTemplateList();
      });

      wrap.appendChild(button);
    });

    return wrap;
  }

  /**
   * 差し色の選び方。
   *
   * ジャンルごとに、そのジャンルに合う色だけを並べる。全ジャンル共通の
   * 一覧にすると、フォーマルに蛍光色が並ぶことになる。
   *
   * 選ばなければ、そのジャンルの先頭の色を使う。
   */
  function accentPicker() {
    var theme = null;
    THEMES.forEach(function (t) { if (t.key === state.theme) theme = t; });

    var wrap = document.createElement('div');
    wrap.className = 'theme-row accent-row';
    if (!theme || theme.accents.length < 2) return wrap;

    var label = document.createElement('span');
    label.className = 'theme-label';
    label.textContent = '差し色';
    wrap.appendChild(label);

    var current = state.accent || theme.accents[0].key;

    theme.accents.forEach(function (accent) {
      var button = document.createElement('button');
      button.className = 'accent-chip' + (accent.key === current ? ' active' : '');
      button.style.setProperty('--swatch', accent.base);
      button.textContent = accent.name;
      button.title = accent.name;

      button.addEventListener('click', function () {
        if (state.accent === accent.key) return;
        state.accent = accent.key;
        call('setTemplateTheme', state.theme, state.accent);
        renderTemplateList();
      });

      wrap.appendChild(button);
    });

    return wrap;
  }

  function customItems(kind) {
    var box = state.custom[kind];
    return (box && box.items) || [];
  }

  function customError(kind) {
    var box = state.custom[kind];
    return (box && box.error) || '';
  }

  /**
   * 中身が無い分類に添える説明。
   *
   * 空欄のまま出すと「壊れている」と読まれるので、なぜ空なのかを書く。
   */
  function categoryNote(category, count) {
    // 読み終わる前に「まだありません」と出すと、無いのか読んでいるのか分からない
    if (category === MY_CATEGORY && !state.customLoaded) return '読み込んでいます…';

    if (category === MY_CATEGORY) {
      if (customError('mine')) return customError('mine');
      if (!count) return '自分のテンプレートはまだありません。'
        + '下の「いまの内容を登録」から、いま開いている原稿をそのまま登録できます。';
    }

    return '';
  }

  // -------------------------------------------------------------------------
  // テンプレートのカード
  //
  // 本文600px幅のHTMLを、そのまま縮めて見本にする。画像を別に用意しなくて済み、
  // 中身を直したら見本も自動で追従する。
  //
  // 数が多いので、画面に入ったものだけ読み込む。
  // -------------------------------------------------------------------------

  /*
     組み込みのテンプレートと部品に、選ばれた配色を当てる。

     自作のテンプレート（kind === 'mine'）には当てない。あれは利用者が
     書いたHTMLで、こちらが色を書き換えてよいものではない。
  */
  function themed(html, kind) {
    if (kind === 'mine') return html;
    if (typeof applyTheme !== 'function') return html;
    return applyTheme(html, state.theme, state.accent);
  }

  var THUMB_WIDTH = 600;   // 見本の中で使う横幅。本文幅と同じ
  var thumbWatcher = null;

  function templateCard(template) {
    var card = document.createElement('button');
    card.className = 'template-card';
    card.addEventListener('click', function () { useTemplate(template); });

    var thumb = document.createElement('div');
    thumb.className = 'tpl-thumb';

    var frame = document.createElement('iframe');
    frame.setAttribute('sandbox', '');       // スクリプトも同一オリジンも与えない
    frame.setAttribute('scrolling', 'no');
    frame.setAttribute('tabindex', '-1');
    frame.setAttribute('aria-hidden', 'true');
    frame.setAttribute('loading', 'lazy');
    thumb.appendChild(frame);

    // 自分のぶんだけ、消せるようにする
    if (template.kind === 'mine') {
      var del = document.createElement('span');
      del.className = 'tpl-del';
      del.setAttribute('role', 'button');
      del.setAttribute('tabindex', '0');
      del.textContent = '消す';
      del.title = 'このテンプレートを消す';
      del.addEventListener('click', function (event) {
        event.stopPropagation();
        removeMyTemplate(template);
      });
      thumb.appendChild(del);
    }

    card.appendChild(thumb);

    var body = document.createElement('div');
    body.className = 'tpl-body';

    var name = document.createElement('b');
    name.textContent = template.name;
    body.appendChild(name);

    if (template.description) {
      var description = document.createElement('span');
      description.textContent = template.description;
      body.appendChild(description);
    }

    card.appendChild(body);

    watchThumb(thumb, frame, themed(template.html, template.kind));
    return card;
  }

  /** 画面に入ったら中身を流し込む */
  function watchThumb(thumb, frame, html) {
    var fill = function () {
      if (frame.dataset.filled) return;
      frame.dataset.filled = '1';
      frame.srcdoc = html;
      frame.addEventListener('load', function () {
        sizeThumb(thumb, frame);
        thumb.classList.add('ready');
      });
    };

    if (typeof IntersectionObserver !== 'function') {
      fill();
      return;
    }

    if (!thumbWatcher) {
      thumbWatcher = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          thumbWatcher.unobserve(entry.target);
          if (entry.target.fillThumb) entry.target.fillThumb();
        });
      }, { rootMargin: '200px' });
    }

    thumb.fillThumb = fill;
    thumbWatcher.observe(thumb);
  }

  /** カードの幅に合わせて縮める。横幅いっぱいに収める */
  function sizeThumb(thumb, frame) {
    var scale = thumb.clientWidth / THUMB_WIDTH;
    frame.style.transform = 'scale(' + scale + ')';
  }

  function useTemplate(template) {
    hide(el['template-modal']);
    confirmDiscard(function () {
      newDoc(themed(template.html, template.kind));
      el.title.value = template.name;
      setStatus('テンプレート「' + template.name + '」を読み込みました', 'ok');
      updateButtons();
    });
  }

  // -------------------------------------------------------------------------
  // 自分のテンプレートの登録と削除
  // -------------------------------------------------------------------------

  /**
   * 結果はダイアログの中に出す。画面下のステータス欄は
   * ダイアログの裏に隠れて読めないため。
   */
  function templateSaveMessage(text, isError) {
    var box = el['tpl-save-msg'];
    box.textContent = text;
    box.classList.toggle('warn', !!isError);
    box.hidden = !text;
  }

  function openTemplateSave() {
    el['tpl-save'].hidden = false;
    el['tpl-save-name'].value = (el.title.value || '').trim();
    templateSaveMessage('');
    el['tpl-save-name'].focus();
    el['tpl-save-name'].select();
  }

  function closeTemplateSave() {
    el['tpl-save'].hidden = true;
    templateSaveMessage('');
  }

  function saveTemplate() {
    var name = el['tpl-save-name'].value.trim();

    if (!name) {
      templateSaveMessage('テンプレートの名前を入力してください。', true);
      el['tpl-save-name'].focus();
      return;
    }

    templateSaveMessage('登録しています…');
    call('saveMyTemplate', { name: name, html: currentSource() }).then(function (custom) {
      state.custom = custom || state.custom;
      renderTemplateList();
      closeTemplateSave();
      setStatus('テンプレート「' + name + '」を登録しました', 'ok');
    }).catch(function (err) {
      templateSaveMessage(message(err), true);
    });
  }

  function removeMyTemplate(template) {
    // 画面に出ている確認ダイアログは削除専用に配線されている。二重に開くと
    // 収拾がつかないので、ここは素の確認を使う（confirmDiscard と同じ流儀）。
    if (!window.confirm('テンプレート「' + template.name + '」を消します。よろしいですか？')) return;
    (function () {
      call('deleteMyTemplate', template.fileId).then(function (custom) {
        state.custom = custom || state.custom;
        renderTemplateList();
        setStatus('テンプレート「' + template.name + '」を消しました', 'ok');
      }).catch(function (err) {
        setStatus(message(err), 'error');
      });
    }());
  }

  // -------------------------------------------------------------------------
  // 版の履歴
  // -------------------------------------------------------------------------

  function openHistory() {
    if (!state.id) return;

    state.selectedVersionId = null;
    el['history-preview'].srcdoc = '';
    el['history-restore'].disabled = true;
    el['history-list'].textContent = '';
    el['history-list'].appendChild(emptyNode('読み込み中…'));
    show(el['history-modal']);

    call('listVersions', state.location, state.id).then(function (versions) {
      state.versions = versions || [];
      renderVersions();
    }, function (err) {
      el['history-list'].textContent = '';
      el['history-list'].appendChild(emptyNode(message(err)));
    });
  }

  function renderVersions() {
    el['history-list'].textContent = '';

    if (!state.versions.length) {
      el['history-list'].appendChild(
        emptyNode('まだ履歴はありません。内容を変更して保存すると、変更前の版がここに残ります。')
      );
      return;
    }

    state.versions.forEach(function (version, index) {
      var item = document.createElement('div');
      item.className = 'item' + (version.id === state.selectedVersionId ? ' active' : '');
      item.addEventListener('click', function () { selectVersion(version); });

      var label = document.createElement('div');
      label.className = 'item-title';
      label.textContent = (index === 0 ? '直前の版' : (index + 1) + 'つ前の版');

      var meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.textContent = formatDate(version.savedAt) + ' · ' + formatSize(version.size);

      item.appendChild(label);
      item.appendChild(meta);
      el['history-list'].appendChild(item);
    });
  }

  function selectVersion(version) {
    state.selectedVersionId = version.id;
    renderVersions();
    el['history-restore'].disabled = true;
    el['history-preview'].srcdoc = '';

    call('loadVersion', state.location, state.id, version.id).then(function (result) {
      if (state.selectedVersionId !== version.id) return;
      el['history-preview'].srcdoc = result.html;
      el['history-restore'].disabled = false;
    }, function (err) {
      setStatus(message(err), 'err');
    });
  }

  function restoreSelectedVersion() {
    if (!state.selectedVersionId) return;

    var versionId = state.selectedVersionId;
    hide(el['history-modal']);
    setBusy(true, '復元中…');

    call('restoreVersion', state.location, state.id, versionId).then(function (doc) {
      applyDoc(doc);
      setBusy(false, '復元しました', 'ok');
      refreshList();
    }, function (err) {
      setBusy(false, message(err), 'err');
    });
  }

  // -------------------------------------------------------------------------
  // 一覧とタグ
  // -------------------------------------------------------------------------

  function refreshList() {
    return call('listDocs', state.location).then(function (docs) {
      state.docs = docs || [];
      renderTagFilter();
      renderList();
    }, function (err) {
      setBusy(false, message(err), 'err');
    });
  }

  function renderTagFilter() {
    var seen = {};
    var tags = [];

    state.docs.forEach(function (doc) {
      (doc.tags || []).forEach(function (tag) {
        if (!seen[tag]) {
          seen[tag] = true;
          tags.push(tag);
        }
      });
    });
    tags.sort();

    if (state.activeTag && !seen[state.activeTag]) state.activeTag = '';

    el['tag-filter'].textContent = '';
    tags.forEach(function (tag) {
      var chip = document.createElement('button');
      chip.className = 'chip' + (tag === state.activeTag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', function () {
        state.activeTag = (state.activeTag === tag) ? '' : tag;
        renderTagFilter();
        renderList();
      });
      el['tag-filter'].appendChild(chip);
    });
  }

  function renderList() {
    var keyword = el.search.value.trim().toLowerCase();

    var docs = state.docs.filter(function (doc) {
      var matchesKeyword = !keyword || doc.title.toLowerCase().indexOf(keyword) !== -1;
      var matchesTag = !state.activeTag || (doc.tags || []).indexOf(state.activeTag) !== -1;
      return matchesKeyword && matchesTag;
    });

    el.list.textContent = '';

    if (!docs.length) {
      el.list.appendChild(emptyNode(
        state.docs.length
          ? '該当するファイルがありません。'
          : 'まだ保存されたファイルはありません。編集して「保存」を押すと、ここに並びます。'
      ));
      return;
    }

    docs.forEach(function (doc) {
      var item = document.createElement('div');
      item.className = 'item' + (doc.id === state.id ? ' active' : '');
      item.addEventListener('click', function () { openDoc(doc.id); });

      var title = document.createElement('div');
      title.className = 'item-title';
      title.textContent = doc.title;
      title.title = doc.title;
      item.appendChild(title);

      var meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.textContent = formatDate(doc.updatedAt) + ' · ' + formatSize(doc.size);
      item.appendChild(meta);

      if (doc.tags && doc.tags.length) {
        var tagRow = document.createElement('div');
        tagRow.className = 'item-tags';
        doc.tags.forEach(function (tag) {
          var badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = tag;
          tagRow.appendChild(badge);
        });
        item.appendChild(tagRow);
      }

      el.list.appendChild(item);
    });
  }

  /** 「タグA, タグB」形式を配列に。全角カンマと読点も区切りとして扱う */
  function parseTags(value) {
    return String(value || '')
      .split(/[,、，]/)
      .map(function (tag) { return tag.trim(); })
      .filter(function (tag) { return tag.length > 0; });
  }

  // -------------------------------------------------------------------------
  // キャンバスサイズ
  // -------------------------------------------------------------------------

  function setPreviewWidth(chip) {
    document.querySelectorAll('.canvas-size .chip[data-width]').forEach(function (other) {
      other.classList.toggle('active', other === chip);
    });

    var width = parseInt(chip.getAttribute('data-width'), 10);
    el.preview.style.width = width ? width + 'px' : '100%';
    el['width-input'].value = width || '';
    showCanvasWidth(width ? width + 'px' : '全幅');
    setTimeout(checkOverflow, 100);
  }

  function applyManualWidth() {
    var width = parseInt(el['width-input'].value, 10);
    if (!width || width < 200 || width > 2400) {
      setStatus('幅は200〜2400pxで指定してください', 'err');
      return;
    }

    document.querySelectorAll('.canvas-size .chip[data-width]').forEach(function (chip) {
      chip.classList.remove('active');
    });
    el.preview.style.width = width + 'px';
    showCanvasWidth(width + 'px');
    setTimeout(checkOverflow, 100);
    setStatus('キャンバス幅を ' + width + 'px にしました', 'ok');
  }

  // -------------------------------------------------------------------------
  // ユーティリティ
  // -------------------------------------------------------------------------

  /** google.script.run をPromiseで包む */
  function call(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[fnName].apply(null, args);
    });
  }

  function show(node) { node.hidden = false; }
  function hide(node) { node.hidden = true; }

  function emptyNode(text) {
    var node = document.createElement('div');
    node.className = 'empty';
    node.textContent = text;
    return node;
  }

  function isDirty() {
    if (!editor) return false;
    return currentSource() !== state.baseline
      || el.title.value !== state.baselineTitle
      || el.tags.value !== state.baselineTags;
  }

  function confirmDiscard(next) {
    if (!isDirty() || window.confirm('保存していない変更があります。破棄して続けますか？')) {
      next();
    }
  }

  function setBusy(busy, text, kind) {
    state.busy = busy;
    setStatus(text, kind);
    updateButtons();
  }

  function setStatus(text, kind) {
    clearTimeout(statusTimer);
    el.status.textContent = text || '';
    el.status.className = kind || '';
    if (kind === 'ok') {
      statusTimer = setTimeout(function () {
        el.status.textContent = '';
        el.status.className = '';
      }, 2500);
    }
  }

  function updateButtons() {
    var hasDoc = !!state.id;
    var canWrite = writable(state.location);
    var other = state.location === 'my' ? 'shared' : 'my';

    // 閲覧のみの保存場所では、書き込みを伴う操作を止める
    el.save.disabled = state.busy || !canWrite;
    el.duplicate.disabled = state.busy || !hasDoc || !canWrite;
    el['delete'].disabled = state.busy || !hasDoc || !canWrite;

    el.history.disabled = state.busy || !hasDoc;
    el.open.disabled = state.busy || !hasDoc || !state.webAppUrl;

    el['copy-to'].disabled = state.busy || !hasDoc || !writable(other);
    el['move-to'].disabled = state.busy || !hasDoc || !writable(other) || !canWrite;

    el.save.textContent = !canWrite ? '保存（不可）' : (isDirty() ? '保存 *' : '保存');
  }

  /**
   * サーバー側の例外を、画面に出す文にする。
   *
   * GAS は投げた文言の頭に Error: を付けて返してくる。利用者には意味の無い
   * 語なので落とす。
   */
  function message(err) {
    var text = (err && err.message) ? String(err.message) : '';
    text = text.replace(/^(Error|Exception):s*/, '').trim();
    return text || '処理に失敗しました。';
  }

  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatSize(bytes) {
    if (!bytes && bytes !== 0) return '';
    if (bytes < 1024) return bytes + ' B';
    return (bytes / 1024).toFixed(1) + ' KB';
  }
})();
</script>
