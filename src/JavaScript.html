      var shut = /^<tr[\s>]/i.test(fragment) ? '</tbody></table>' : '</tr></tbody></table>';

      var box = wys.doc.createElement('div');
      box.innerHTML = open + source + shut;

      var rows = box.querySelector('tbody');
      while (rows && rows.firstChild) holder.appendChild(rows.firstChild);
    } else {
      holder.innerHTML = source;
    }

    PASTE_DROP_TAGS.forEach(function (tag) {
      Array.prototype.slice.call(holder.getElementsByTagName(tag))
        .forEach(function (node) { node.parentNode.removeChild(node); });
    });

    Array.prototype.slice.call(holder.querySelectorAll('*')).forEach(function (node) {
      Array.prototype.slice.call(node.attributes).forEach(function (attr) {
        var name = attr.name.toLowerCase();
        var value = String(attr.value);

        // イベント属性と javascript: は落とす
        if (name.indexOf('on') === 0) node.removeAttribute(attr.name);
        else if (/^(href|src|action|background)$/.test(name)
          && /^\s*javascript:/i.test(value)) node.removeAttribute(attr.name);
        else if (name.indexOf('data-wys-') === 0) node.removeAttribute(attr.name);
        else if (name === 'contenteditable' || name === 'spellcheck') node.removeAttribute(attr.name);
      });
    });

    return holder;
  }

  /** いま持ち出せるものがあるか */
  function copyTarget() {
    var elem = wys.selected;
    if (!elem || !elem.tagName) return null;
    if (elem.tagName === 'BODY' || elem.tagName === 'HTML') return null;
    return elem;
  }

  /**
   * 貼り付け先。選択中のものの「下」に入れる。
   *
   * 下がどこかは、上下移動と同じ見方で決める（movableTarget）。選択中の
   * ものに並びがなければ、並びを持つ外側まで登る。
   *
   * こうしないと、1列しかない行の中のセルを選んで貼ったときに、下ではなく
   * 隣に列が増える。メールの原稿で横に並べたい場面はまず無いので、
   * 上下移動と同じ単位にそろえてある。
   *
   * 何も選んでいなければ、本文の末尾。
   */
  function pasteInto(holder) {
    var elem = wys.selected;
    var nodes = Array.prototype.slice.call(holder.childNodes)
      .filter(function (node) {
        return node.nodeType === 1 || (node.nodeType === 3 && node.nodeValue.trim());
      });

    if (!nodes.length) {
      setStatus('貼り付けられる中身がありませんでした', 'err');
      return;
    }

    var host;
    var anchor;

    var below = elem ? movableTarget(elem) : null;

    if (below && below.parentNode) {
      host = below.parentNode;
      anchor = below.nextSibling;
    } else if (elem && elem.parentNode && elem.tagName !== 'BODY') {
      host = elem.parentNode;
      anchor = elem.nextSibling;
    } else {
      var table = contentTable();
      host = table ? (table.tBodies[0] || table) : wys.doc.body;
      anchor = null;
    }

    /*
       <tr> は tbody の中にしか入らない。行を、行でない場所へ落とすと
       ブラウザがまるごと捨てる。入れ物に合わせて包み直す。
    */
    var wrapped = fitForHost(nodes, host);

    pushUndo();
    wrapped.forEach(function (node) { host.insertBefore(node, anchor); });

    syncFromWys();
    selectElement(wrapped[wrapped.length - 1]);
    setStatus(wrapped.length + '件を貼り付けました（Ctrl + Z で戻せます）', 'ok');
  }

  /**
   * 入れ物に収まる形に整える。
   *
   * 決まりはひとつ、「包む。捨てない」。
   * 以前は、行を行でない場所へ入れるときにセルを外して中身だけ取り出して
   * いた。<td> が持っていた面の色・角丸・余白がそこで全部消えるので、
   * 白い枠をコピーしたのに白が付いてこない、という形で表に出ていた。
   */
  function fitForHost(nodes, host) {
    var hostTag = host.tagName;
    var wantsRow = hostTag === 'TBODY' || hostTag === 'THEAD' || hostTag === 'TFOOT'
      || hostTag === 'TABLE';
    var wantsCell = hostTag === 'TR';

    function inRow(node) {
      var row = wys.doc.createElement('tr');
      row.appendChild(node);
      return row;
    }

    function inCell(node) {
      var cell = wys.doc.createElement('td');
      cell.appendChild(node);
      return cell;
    }

    return nodes.map(function (node) {
      var tag = node.nodeType === 1 ? node.tagName : '';
      var isRow = tag === 'TR';
      var isCell = tag === 'TD' || tag === 'TH';

      if (wantsRow) {
        if (isRow) return node;
        if (isCell) return inRow(node);
        return inRow(inCell(node));
      }

      if (wantsCell) {
        if (isCell) return node;
        if (isRow) return inCell(tableWrapped(node));
        return inCell(node);
      }

      // 表の外側。行やセルは、表ごと持ち込む
      if (isRow || isCell) return tableWrapped(node);
      return node;
    });
  }

  function copySelected(event, alsoCut) {
    var elem = copyTarget();
    if (!elem) return false;

    /*
       外側の面は、いつも連れて行く。

       以前は入り切りを選べるようにしていたが、選択がプレビュー上で
       見えるようになった今、毎回この判断を求める意味がない。
       文字だけが欲しいときは、編集に入って文字を選んでコピーする。
    */
    var withSurface = !!surfaceAncestor(elem);
    var html = portableHtml(elem, withSurface);

    event.clipboardData.setData('text/html', html);
    event.clipboardData.setData('text/plain', htmlToPlainText(html));
    event.preventDefault();

    var what = (levelOf(elem) || elementLabel(elem))
      + (withSurface ? '（外側の面ごと）' : '');

    if (alsoCut) {
      removeSelected();
      setStatus(what + 'を切り取りました', 'ok');
    } else {
      setStatus(what + 'をコピーしました。貼り付けると、選んだ要素のすぐ下に入ります', 'ok');
    }

    return true;
  }

  /** 選択中の要素を、そのすぐ下にもう1つ作る */
  function duplicateSelected() {
    var elem = copyTarget();

    if (!elem) {
      setStatus('複製する要素を選んでください', 'err');
      return;
    }

    pushUndo();

    var copy = cleanClone(elem);
    elem.parentNode.insertBefore(copy, elem.nextSibling);

    syncFromWys();
    selectElement(copy);
    setStatus(elementLabel(elem) + 'を複製しました（Ctrl + Z で戻せます）', 'ok');
  }

  // --- つまみを掴んでの移動 -----------------------------------------------

  /**
   * 兄弟の「間」の位置を、文書の上端からの座標で並べる。
   *
   * ドラッグ中は何も動かさないので、掴んだ時点のこの表をそのまま使える。
   */
  function dropMarks(list, win) {
    var marks = list.map(function (node, i) {
      return { at: node.getBoundingClientRect().top + win.scrollY, index: i };
    });

    var last = list[list.length - 1].getBoundingClientRect();
    marks.push({ at: last.bottom + win.scrollY, index: list.length });

    return marks;
  }

  function startElementDrag(event) {
    var elem = movableTarget(wys.selected);
    if (!elem) return;

    event.preventDefault();
    event.stopPropagation();

    // 選んだものより外側を掴んだときは、何が動くのかを選択で示す
    if (elem !== wys.selected) selectElement(elem);

    var list = siblingsOf(elem);

    var idoc = wys.doc;
    var win = idoc.defaultView;
    var marks = dropMarks(list, win);
    var from = list.indexOf(elem);
    var target = from;

    markMoving(false);
    elem.classList.add('wys-lift');

    var box = elem.parentElement.getBoundingClientRect();
    wys.drop.style.left = (box.left + win.scrollX) + 'px';
    wys.drop.style.width = box.width + 'px';

    var onMove = function (moveEvent) {
      var y = moveEvent.clientY + win.scrollY;
      var best = marks[0];

      marks.forEach(function (mark) {
        if (Math.abs(mark.at - y) < Math.abs(best.at - y)) best = mark;
      });

      target = best.index;
      wys.drop.classList.add('on');
      wys.drop.style.top = (best.at - 1) + 'px';
    };

    var onUp = function () {
      idoc.removeEventListener('mousemove', onMove);
      idoc.removeEventListener('mouseup', onUp);

      elem.classList.remove('wys-lift');
      wys.drop.classList.remove('on');

      // 自分の位置か、そのすぐ後ろに落としても並びは変わらない
      if (target === from || target === from + 1) {
        positionHandles();
        return;
      }

      pushUndo();
      elem.parentNode.insertBefore(elem, target >= list.length ? null : list[target]);

      syncFromWys();
      positionHandles();
      setStatus(elementLabel(elem) + 'を動かしました（Ctrl + Z で戻せます）', 'ok');
    };

    onMove(event);
    idoc.addEventListener('mousemove', onMove);
    idoc.addEventListener('mouseup', onUp);
  }

  /**
   * Delete キーで消してよい状況か。
   *
   * 文字を打てる状態のときは必ず false。編集中の Delete は文字を消すためのもので、
   * ここで要素を消すと「本文を消そうとしたら枠ごと消えた」という事故になる。
   */
  /**
   * いま押されたキーを、画面側で受け取ってよいか。
   *
   * 入力欄の中や、ダイアログが開いているあいだは受け取らない。
   * 横取りすると、その欄で使えるはずの操作が効かなくなる。実際、
   * 署名の編集で Ctrl+Z / Ctrl+Shift+Z が効かなかった。
   */
  function keysAreOurs() {
    var active = document.activeElement;
    var tag = active ? active.tagName : '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return false;
    if (active && active.isContentEditable) return false;

    // ダイアログや小窓が開いているときは、そちらの操作を邪魔しない
    if (popOpen()) return false;
    if (document.querySelector('.backdrop:not([hidden])')) return false;

    return true;
  }

  function canDeleteByKey() {
    if (!wys.selected || wys.editing) return false;
    return keysAreOurs();
  }

  /**
   * 選択中の要素を消す。
   *
   * 以前はブロック（本文テーブル直下の tr）しか消せなかった。手書きのHTMLでは
   * それが本文まるごとの1行だけ、ということが起きるため、入れた部品を狙って
   * 消せなかった。いまはパンくずで選んだものが、そのまま削除の単位になる。
   */
  function removeSelected() {
    var elem = wys.selected;

    if (!elem) {
      setStatus('削除する要素を選んでください', 'err');
      return;
    }

    // 器そのものは消させない。消すと編集画面が成立しなくなる
    var tag = elem.tagName;
    if (tag === 'BODY' || tag === 'HTML' || !elem.parentNode) {
      setStatus('この要素は消せません', 'err');
      return;
    }

    pushUndo();

    var label = elementLabel(elem);
    var host = elem.parentElement;

    elem.parentNode.removeChild(elem);

    var tidied = pruneEmptyRow(host);

    wys.selected = null;
    wys.editing = null;
    clearAttr('data-wys-doom');
    clearAttr('data-wys-move');

    syncFromWys();
    renderInspector();
    updateWysButtons();
    positionHandles();

    // 片付けきれなかった枠は見えないので、残っていることを伝える
    var left = !tidied && host && host.parentNode
      && !host.children.length && !(host.textContent || '').trim()
      ? '（外側の枠は空のまま残っています）'
      : '';

    setStatus(label + 'を削除しました' + left + '。Ctrl + Z で取り消せます', 'ok');
  }


  /**
   * 枠がひとつも残らなかった行を片付ける。
   *
   * -------------------------------------------------------------------------
   * どこまで消すか
   *
   * 直したいのは「枠ごと無くなって <tr></tr> だけが残る」場合だけ。
   * 面を持つ枠（色の帯など）は td の単位で選ばれるので、消すと枠が
   * ひとつも無い行が残る。これは画面に何も出さず、選ぶこともできない。
   * コードにだけ残るので、見えているものと書き出されるものが食い違う。
   *
   * **枠が残っているなら消さない。** 中身が空でも、余白として場所を占め、
   * 選ぶこともできる。食い違いは起きていない。消すよう頼まれたのは中身で
   * あって、枠ではない。空いた枠に別のものを入れたい、という使い方もある。
   *
   * 一度これを「背景も罫線も無ければ消す」という条件にして、署名として
   * 挿し込んだ枠（padding しか持たない）を、中身を消しただけで失わせた。
   *
   * @param {Element} host 消した要素が入っていた親
   * @return {boolean} 行を片付けたか
   */
  function pruneEmptyRow(host) {
    var node = host;

    while (node && node.parentElement) {
      if (node.tagName === 'TR') {
        if (node.cells.length) return false;

        // 行がひとつだけの表は、消すと器が無くなる
        var table = node.closest ? node.closest('table') : null;
        if (table && table.rows.length <= 1) return false;

        node.parentElement.removeChild(node);
        return true;
      }

      node = node.parentElement;
    }

    return false;
  }

  /** 画面に出す、その要素の呼び名 */
  function elementLabel(elem) {
    var tag = elem.tagName.toLowerCase();
    var names = {
      img: '画像', a: 'リンク', p: '段落', tr: '行', td: 'セル', th: 'セル',
      table: '表', ul: '箇条書き', ol: '箇条書き', li: '項目', hr: '区切り線',
      div: '枠', section: '枠', span: '文字の一部',
      h1: '見出し', h2: '見出し', h3: '見出し', h4: '見出し', h5: '見出し', h6: '見出し'
    };
    return names[tag] || ('<' + tag + '>');
  }

  /**
   * 消える範囲を、押す前に見せる。
   *
   * ブロックか要素かで消える量が大きく変わるので、押してから気づくのでは遅い。
   */
  function markDoomed(on) {
    clearAttr('data-wys-doom');
    if (!on || !wys.selected || !wys.doc) return;

    wys.selected.setAttribute('data-wys-doom', '');
  }

  // --- 本文の幅（固定 / 追従） ----------------------------------------------

  /**
   * 本文テーブルの幅指定を読み取る。
   *
   *   追従: width:100%; max-width:600px（必要なら min-width も）→ 狭い環境では縮む
   *   固定: width:600px                                        → 常にその幅
   */
  function readBodyWidth() {
    var table = contentTable();
    if (!table) return null;

    var max = parseInt(table.style.maxWidth, 10) || 0;
    var min = parseInt(table.style.minWidth, 10) || 0;
    var width = parseInt(table.style.width, 10) || 0;
    var isPercent = /%/.test(table.style.width);

    return {
      table: table,
      fluid: isPercent && max > 0,
      max: (isPercent ? max : width) || parseInt(table.getAttribute('width'), 10) || 600,
      min: min
    };
  }

  function renderBodyWidth() {
    var info = readBodyWidth();
    var controls = [el['width-fluid'], el['width-fixed'], el['body-width'], el['body-min-width']];

    controls.forEach(function (node) { node.disabled = !info; });

    if (!info) {
      el['width-fluid'].classList.remove('active');
      el['width-fixed'].classList.remove('active');
      el['body-width'].value = '';
      el['body-min-width'].value = '';
      return;
    }

    el['width-fluid'].classList.toggle('active', info.fluid);
    el['width-fixed'].classList.toggle('active', !info.fluid);
    el['body-width'].value = info.max;
    el['body-min-width'].value = info.min || '';

    // 固定のときは「最大幅」ではなく単なる幅。最小幅も意味を持たない
    el['max-label'].textContent = info.fluid ? '最大' : '幅';
    el['body-min-width'].disabled = !info.fluid;
    el['min-field'].classList.toggle('off', !info.fluid);
  }

  function applyBodyWidth(fluid, maxValue, minValue) {
    var info = readBodyWidth();
    if (!info) {
      setStatus('本文テーブルが見つかりません', 'err');
      return;
    }

    var max = clampWidth(maxValue, info.max, 200);
    var min = clampWidth(minValue, 0, 0);
    if (min > max) min = 0; // 最小が最大を超える指定は無視する

    pushUndo();

    var style = info.table.style;
    if (fluid) {
      style.width = '100%';
      style.maxWidth = max + 'px';
      if (min) style.minWidth = min + 'px';
      else style.removeProperty('min-width');
    } else {
      style.width = max + 'px';
      style.removeProperty('max-width');
      style.removeProperty('min-width');
    }

    // Outlook は CSS の幅を無視するので、属性側も揃えておく
    info.table.setAttribute('width', String(max));

    syncFromWys();
    renderBodyWidth();

    setStatus(fluid
      ? '幅に追従します（' + (min ? min + '〜' : '最大 ') + max + 'px）'
      : '本文の幅を ' + max + 'px に固定しました', 'ok');
  }

  function clampWidth(value, fallback, minimum) {
    var number = parseInt(value, 10);
    if (isNaN(number)) return fallback;
    return Math.min(1200, Math.max(minimum, number));
  }

  // --- はみ出しの検知 -------------------------------------------------------

  /**
   * 本文がキャンバスに収まっているかを見る。
   * 収まらない場合、黙って切れると気づけないので警告とワンクリック調整を出す。
   */
  function checkOverflow() {
    var warn = el['overflow-warn'];
    if (!wys.doc || !wys.doc.documentElement) {
      hide(warn);
      return;
    }

    var root = wys.doc.documentElement;
    var over = root.scrollWidth - root.clientWidth;

    if (over > 1) {
      el['overflow-size'].textContent = over + 'px';
      show(warn);
    } else {
      hide(warn);
    }
  }

  /** キャンバスを本文がちょうど収まる幅にする */
  function fitCanvas() {
    if (!wys.doc || !wys.doc.documentElement) return;

    var root = wys.doc.documentElement;
    // iframe の内寸と文書の内寸の差＝縦スクロールバーの分
    var scrollbar = Math.max(0, el.preview.clientWidth - root.clientWidth);
    var needed = root.scrollWidth + scrollbar;

    document.querySelectorAll('.canvas-size .chip[data-width]').forEach(function (chip) {
      chip.classList.remove('active');
    });

    el.preview.style.width = needed + 'px';
    el['width-input'].value = needed;
    showCanvasWidth(needed + 'px');

    setTimeout(checkOverflow, 100);
    setStatus('キャンバスを ' + needed + 'px にしました', 'ok');
  }

  function updateWysButtons() {
    var hasParagraph = !!paragraphTarget();

    // 移動も削除も、選んだ要素そのものに効く
    var canMove = !!(wys.selected && movableTarget(wys.selected));
    [el['wys-up'], el['wys-down']].forEach(function (button) {
      button.disabled = !canMove;
    });
    el['inspector-kill'].disabled = !wys.selected;
    [el['wys-ul'], el['wys-ol'], el['wys-quote'], el['wys-indent'], el['wys-outdent']]
      .forEach(function (button) { button.disabled = !hasParagraph; });
  }

  // -------------------------------------------------------------------------
  // 要素パネル
  // -------------------------------------------------------------------------

  function renderInspector() {
    // 組み直すと先頭へ戻ってしまうので、位置を控えて戻す
    var panel = el['inspector-body'];
    var keepScroll = panel ? panel.scrollTop : 0;

    renderInspectorBody();

    if (panel) panel.scrollTop = keepScroll;

    markInspectorBar();
  }

  /*
     狭い画面では、要素パネルは下から出るシートになる。出しっぱなしにすると
     原稿の下半分が埋まるので、**選んだときだけ細い帯を出し、押すと開く**。

     帯の札は、いま何を選んでいるかを言葉で示す。札が無い＝何も選んでいない
     ので、そのときは帯ごと引っ込める（スタイル側で :not([data-label]) を見る）。
  */
  /** そのまとまりを開いた状態で、要素パネルを出す */
  function openInspectorAt(key) {
    PANEL_GROUPS.forEach(function (def) {
      wys.openGroups[def.key] = (def.key === key);
    });
    togglePane('inspector', true);
    renderInspector();
  }

  function markInspectorBar() {
    var bar = el['inspector-show'];
    var list = el['sidebar-show'];

    /*
       狭い画面では、この2つは部品の帯の上に並ぶボタンになる。
       札は data-label で渡す。**スタイル側に文字を書くと訳に載らない**
       （抜き出しの対象がタグの中身とJSの文字列なので）。

       選んでいるかどうかに関わらず、常に出しておく。以前は選んだときだけ
       出していたが、「› が何なのか想像がつかない」との指摘を受けた。
       名前が付いていれば、押す前に何が起きるか分かる。
    */
    if (bar) {
      if (isNarrow()) bar.setAttribute('data-label', '要素パネル');
      else bar.removeAttribute('data-label');
    }

    if (list) {
      if (isNarrow()) list.setAttribute('data-label', 'ファイル一覧');
      else list.removeAttribute('data-label');
    }
  }

  /**
   * パネルは3つのまとまりに分けて畳めるようにする。
   * 項目が17個あり、一列に並べると目当てのものを探し続けることになるため。
   *
   * 開閉の状態は覚えておく。要素を選び直すたびに畳み直させない。
   */
  var PANEL_GROUPS = [
    { key: 'text', label: '文字' },
    { key: 'surface', label: '面' },
    { key: 'layout', label: '配置と大きさ' }
  ];

  function renderInspectorBody() {
    var body = el['inspector-body'];
    body.textContent = '';

    var elem = wys.selected;
    if (!elem) {
      body.appendChild(emptyNode('プレビュー上の要素をクリックすると、ここで詳細を編集できます。文字を含む要素はその場で書き換えられます。'));
      return;
    }

    // 名前の付いた道すじ。ここが主。タグのパンくずは細かい用のとき
    var path = unitPathField(elem);
    if (path) body.appendChild(path);

    body.appendChild(crumbFold(elem));

    // その要素だけの項目は、畳まず最上段に置く。選んだ理由がこれだから
    specificFields(body, elem);

    group(body, elem, PANEL_GROUPS[0], textFields);
    group(body, elem, PANEL_GROUPS[1], surfaceFields);
    group(body, elem, PANEL_GROUPS[2], layoutFields);
  }

  /**
   * 名前の付いた道すじ。背景 › 段 › 枠 › 部品。
   *
   * タグのパンくずと違い、押せば「意味のある単位」に飛べる。
   * 何を選んでいるのかを、構造ではなく言葉で示すためのもの。
   */
  function unitPathField(elem) {
    var path = unitPath(elem);
    if (!path.length) return null;

    var wrap = document.createElement('div');
    wrap.className = 'unit-path';

    path.forEach(function (unit, index) {
      if (index) {
        var sep = document.createElement('span');
        sep.className = 'unit-sep';
        sep.textContent = String.fromCharCode(8250);
        wrap.appendChild(sep);
      }

      var button = document.createElement('button');
      button.className = 'unit' + (unit.el === elem ? ' active' : '');
      button.dataset.lv = unit.lv;
      button.textContent = levelName(unit.lv);
      button.title = unitName(unit.el, unit.lv);
      button.addEventListener('click', function () { selectElement(unit.el); });

      wrap.appendChild(button);
    });

    return wrap;
  }

  /**
   * 文字を編集しているときの案内。
   *
   * 文字だけの箱はクリックすると必ず編集モードに入る。抜け方を知らないと、
   * 段落を丸ごと消したいのに Delete が文字にしか効かない、という詰まり方をする。
   * 出るのは編集中だけなので、ふだんは場所を取らない。
   */
  /** ひとまとまりを、見出し＋中身で組む */
  function group(body, elem, def, build) {
    var open = wys.openGroups[def.key];

    var inner = document.createElement('div');
    inner.className = 'acc-body';   // 狭い画面でタブの中身として並べ替えるため
    build(inner, elem);

    var head = document.createElement('button');
    head.className = 'acc' + (open ? ' open' : '');

    var name = document.createElement('span');
    name.textContent = def.label;

    // 畳んだままでも中身の有無が分かるように、設定済みの数を出す
    var count = document.createElement('span');
    count.className = 'acc-count';
    var filled = inner.querySelectorAll('.field.is-set').length;
    count.textContent = filled ? String(filled) : '';

    var caret = document.createElement('span');
    caret.className = 'acc-caret';
    caret.textContent = open ? '▾' : '▸';

    head.appendChild(name);
    head.appendChild(count);
    head.appendChild(caret);

    head.addEventListener('click', function () {
      /*
         狭い画面では、3つをタブとして扱う。**必ず1つだけ開いている**
         状態を保つ。畳めるままだと、開くたびに縦へ伸びて送る量が増え、
         全部畳むと何も出ない帯だけが残る。
      */
      if (isNarrow()) {
        PANEL_GROUPS.forEach(function (other) {
          wys.openGroups[other.key] = (other.key === def.key);
        });
      } else {
        wys.openGroups[def.key] = !wys.openGroups[def.key];
      }
      renderInspector();
    });

    body.appendChild(head);
    if (open) body.appendChild(inner);
  }

  // --- その要素だけの項目 ---------------------------------------------

  function specificFields(body, elem) {
    if (elem.tagName === 'IMG') {
      body.appendChild(imageUrlField(elem));
      body.appendChild(plainField('代替テキスト', elem.getAttribute('alt') || '', function (value) {
        elem.setAttribute('alt', value);
      }, elem.hasAttribute('alt'), function () { elem.removeAttribute('alt'); }));
      body.appendChild(imageSizeField(elem));
    }

    if (elem.tagName === 'A') {
      body.appendChild(linkUrlField(elem));
      body.appendChild(linkTargetField(elem));
    }

    var table = editableTable(elem);
    if (table) body.appendChild(tableEditField(elem, table));
  }

  // --- 文字 -------------------------------------------------------------

  function textFields(body, elem) {
    body.appendChild(colorField('文字色', elem.style.color, function (value) {
      elem.style.color = value;
    }, elem, 'color'));

    body.appendChild(fontSizeField(elem));
    body.appendChild(lineHeightField(elem));
    body.appendChild(alignField(elem));
  }

  // --- 面 ---------------------------------------------------------------

  function surfaceFields(body, elem) {
    backgroundFields(body, elem);
    borderFields(body, elem);
    shadowField(body, elem);
    body.appendChild(radiusField(elem));
  }

  // --- 配置と大きさ -----------------------------------------------------

  function layoutFields(body, elem) {
    // ボタンは <a> の内側余白で大きさが決まるので、余白を触れるようにしておく
    if (['TD', 'TABLE', 'DIV', 'P', 'A'].indexOf(elem.tagName) !== -1) {
      body.appendChild(paddingField(elem));
    }

    // セルには外側の余白が効かないので出さない
    if (['TABLE', 'DIV', 'P', 'H1', 'H2', 'H3', 'H4', 'UL', 'OL'].indexOf(elem.tagName) !== -1) {
      body.appendChild(marginField(elem));
    }

    if (['TD', 'TH', 'TABLE', 'DIV'].indexOf(elem.tagName) !== -1) {
      body.appendChild(boxWidthField(elem));
    }
  }

  /**
   * いま選んでいる要素の居場所。押すと祖先へさかのぼれる。
   *
   * 背景画像のように、見えている場所（td）ではなく外側の要素（table）が
   * 持っている指定があるため、親へ行く手段が要る。
   * tbody / thead は数だけ増えて意味が無いので飛ばす。
   */
  /**
   * タグのパンくずは畳んでおく。
   *
   * 細かいところに手を入れたい人のための逃げ道で、ふだん開いている必要がない。
   * 常に出していると、道すじと合わせて上部で2行を使い続けることになる。
   * ノートPCの150%表示では、この2行がそのまま作業できる高さを削る。
   *
   * 開いた状態は覚える。いつも使う人が毎回開き直さずに済むように。
   */
  function crumbFold(elem) {
    var wrap = document.createElement('div');

    var toggle = document.createElement('button');
    toggle.className = 'crumb-fold' + (wys.showCrumbs ? ' open' : '');
    toggle.textContent = (wys.showCrumbs ? String.fromCharCode(8964) : String.fromCharCode(8250))
      + ' タグで選ぶ';
    toggle.title = 'HTMLのタグをたどって、細かい要素を選びます';

    toggle.addEventListener('click', function () {
      wys.showCrumbs = !wys.showCrumbs;
      renderInspector();
    });

    wrap.appendChild(toggle);
    if (wys.showCrumbs) wrap.appendChild(breadcrumbField(elem));

    return wrap;
  }

  function breadcrumbField(elem) {
    var wrap = document.createElement('div');
    wrap.className = 'breadcrumb-field';

    var chain = [];
    var node = elem;

    while (node && node.tagName && node !== wys.doc.documentElement) {
      var tag = node.tagName.toLowerCase();
      if (tag !== 'tbody' && tag !== 'thead' && tag !== 'tfoot') chain.unshift(node);
      if (tag === 'body') break;
      node = node.parentElement;
    }

    // 深いときは手前だけ出す。全部並べると読めない
    var shown = chain.slice(-6);
    if (shown.length < chain.length) wrap.appendChild(crumbLabel(String.fromCharCode(8230)));

    shown.forEach(function (item, index) {
      if (index) wrap.appendChild(crumbLabel(String.fromCharCode(8250)));

      var button = document.createElement('button');
      button.className = 'crumb';
      button.textContent = item.tagName.toLowerCase();
      button.classList.toggle('active', item === elem);

      // その要素に背景画像があることを、印で分かるようにする
      if (bgUrlOf(item)) {
        button.classList.add('has-bg');
        button.title = 'この要素に背景画像があります';
      }

      button.addEventListener('click', function () { selectElement(item); });
      wrap.appendChild(button);
    });

    return wrap;
  }

  function crumbLabel(text) {
    var span = document.createElement('span');
    span.className = 'crumb-sep';
    span.textContent = text;
    return span;
  }

  /** style の background-image から URL だけを取り出す */
  function bgUrlOf(elem) {
    var value = (elem.style && elem.style.backgroundImage) || '';
    var match = value.match(/url\((.*)\)/i);
    if (!match) return '';

    return match[1].trim().replace(/^['"]|['"]$/g, '');
  }

  // -------------------------------------------------------------------------
  // 背景・枠線・影
  //
  // メールの装飾はこの3つの組み合わせでほぼ作れる。逆に、どれか欠けると
  // カード状の見た目が作れない。
  //
  // Outlook のデスクトップ版は、グラデーションも背景画像も表示しない。
  // そのため下地の単色を必ず併記する。短縮の background: ではなく
  // background-color と background-image に分けて書くのがその方法。
  // -------------------------------------------------------------------------

  var BG_KINDS = [
    { value: 'none', label: 'なし' },
    { value: 'color', label: '単色' },
    { value: 'gradient', label: 'グラデーション' },
    { value: 'image', label: '画像' }
  ];

  /** いまの背景がどの種類か */
  function backgroundKind(elem) {
    var image = (elem.style && elem.style.backgroundImage) || '';

    if (/gradient\(/i.test(image)) return 'gradient';
    if (/url\(/i.test(image)) return 'image';
    if (elem.style.backgroundColor || elem.getAttribute('bgcolor')) return 'color';
    return 'none';
  }

  function backgroundFields(body, elem) {
    var kind = backgroundKind(elem);

    body.appendChild(choiceField('背景', BG_KINDS, kind, function (value) {
      setBackgroundKind(elem, value);
    }));

    if (kind === 'color') backgroundColorFields(body, elem);
    if (kind === 'gradient') gradientFields(body, elem);
    if (kind === 'image') backgroundImageFields(body, elem);
  }

  /** 種類を切り替える。前の種類の指定は残さない */
  function setBackgroundKind(elem, kind) {
    // 短縮形が残っていると、あとから足す指定がまとめ直されてしまう
    elem.style.removeProperty('background');

    elem.style.backgroundImage = '';
    elem.style.backgroundSize = '';
    elem.style.backgroundPosition = '';
    elem.style.backgroundRepeat = '';

    if (kind === 'none') {
      elem.style.backgroundColor = '';
      elem.removeAttribute('bgcolor');
      return;
    }

    if (!elem.style.backgroundColor) elem.style.backgroundColor = '#f4f5f7';

    if (kind === 'gradient') {
      // 下地は暗いほうの色にしておく。Outlook ではこれだけが見える
      elem.style.backgroundImage = 'linear-gradient(90deg, #0a6cbd, #024a86)';
      elem.style.backgroundColor = '#024a86';
    }
  }

  // --- 単色 ---------------------------------------------------------------

  function backgroundColorFields(body, elem) {
    var current = elem.style.backgroundColor || elem.getAttribute('bgcolor');

    body.appendChild(colorField('背景の色', current, function (value) {
      // 透明度を先に変えていることがあるので、いまの値を読み直す
      applyBackgroundColor(elem, value, alphaOf(elem.style.backgroundColor));
    }));

    body.appendChild(alphaField('背景の透明度', alphaOf(current), function (alpha) {
      applyBackgroundColor(elem, toHex(elem.style.backgroundColor) || '#ffffff', alpha);
    }));
  }

  /** 透明度が 1 未満なら rgba で書く。1 ならそのまま色コードで書く */
  function applyBackgroundColor(elem, color, alpha) {
    if (!color) {
      elem.style.backgroundColor = '';
      elem.removeAttribute('bgcolor');
      return;
    }

    elem.style.backgroundColor = alpha >= 1 ? color : rgbaOf(color, alpha);

    // Outlook 用の bgcolor は透明度を扱えないので、常に不透明の色を入れる
    if (elem.hasAttribute('bgcolor')) elem.setAttribute('bgcolor', color);
  }

  /** 色の文字列から不透明度を取り出す。指定が無ければ 1 */
  function alphaOf(value) {
    var match = String(value || '').match(/rgba\([^)]*,\s*([\d.]+)\s*\)/i);
    return match ? parseFloat(match[1]) : 1;
  }

  function rgbaOf(hex, alpha) {
    var code = normalizeHex(hex) || '#ffffff';
    var num = parseInt(code.slice(1), 16);

    return 'rgba(' + [(num >> 16) & 255, (num >> 8) & 255, num & 255].join(', ')
      + ', ' + Math.round(alpha * 100) / 100 + ')';
  }

  // --- グラデーション -----------------------------------------------------

  var GRADIENT_DIRS = [
    { value: '90deg', label: '横' },
    { value: '180deg', label: '縦' },
    { value: '135deg', label: '斜め' }
  ];

  /**
   * linear-gradient から 向き・2色 を取り出す。
   *
   * ブラウザは色を rgb(255, 0, 0) の形で書き戻す。カンマで区切って読むと
   * この括弧の中で切れてしまうため、色は「#... か rgb(...) の塊」として拾う。
   */
  function parseGradient(elem) {
    var fallback = { dir: '90deg', from: '#0a6cbd', to: '#024a86', simple: false };
    var value = elem.style.backgroundImage || '';

    var inside = value.match(/linear-gradient\((.*)\)\s*$/i);
    if (!inside) return fallback;

    var body = inside[1];
    var dir = body.match(/^\s*(-?[\d.]+deg|to\s+[a-z\s]+?)\s*,/i);

    var colors = body.match(/#[0-9a-f]{3,8}|rgba?\([^)]*\)/gi) || [];
    if (colors.length < 2) return fallback;

    return {
      dir: dir ? dir[1].trim() : '180deg',
      from: toHex(colors[0]) || fallback.from,
      to: toHex(colors[colors.length - 1]) || fallback.to,
      simple: colors.length === 2
    };
  }

  function gradientFields(body, elem) {
    var g = parseGradient(elem);

    // 色を1つ変えたあと、もう一方を変えたときに巻き戻らないよう、
    // 書き込む直前に読み直す
    var write = function (next) {
      // 短縮形のままだとブラウザが background: にまとめ直し、
      // linear-gradient を読めない Outlook では色ごと落ちてしまう
      elem.style.removeProperty('background');

      elem.style.backgroundImage = 'linear-gradient(' + next.dir + ', ' + next.from + ', ' + next.to + ')';
      // Outlook では画像側が無視されるので、下地の色を必ず揃える
      elem.style.backgroundColor = next.to;
      if (elem.hasAttribute('bgcolor')) elem.setAttribute('bgcolor', next.to);
    };

    if (!g.simple) {
      body.appendChild(fieldNote('この背景は色を3つ以上使っています。ここで変えると2色に置き換わります。', true));
    }

    body.appendChild(choiceField('向き', GRADIENT_DIRS, g.dir, function (value) {
      var now = parseGradient(elem);
      write({ dir: value, from: now.from, to: now.to });
    }));

    body.appendChild(colorField('始まりの色', g.from, function (value) {
      var now = parseGradient(elem);
      write({ dir: now.dir, from: value || now.from, to: now.to });
    }));

    body.appendChild(colorField('終わりの色', g.to, function (value) {
      var now = parseGradient(elem);
      write({ dir: now.dir, from: now.from, to: value || now.to });
    }));

    body.appendChild(fieldNote('Outlook ではグラデーションが出ず、「終わりの色」の単色になります。'));
  }

  // --- 画像 ---------------------------------------------------------------

  function backgroundImageFields(body, elem) {
    var url = bgUrlOf(elem);

    body.appendChild(textField('画像のURL', url, function (value) {
      var next = String(value || '').trim();

      if (!next) {
        elem.style.backgroundImage = '';
        return;
      }

      elem.style.backgroundImage = 'url("' + next + '")';
      if (!elem.style.backgroundSize) elem.style.backgroundSize = 'cover';
      if (!elem.style.backgroundPosition) elem.style.backgroundPosition = 'center';
      if (!elem.style.backgroundRepeat) elem.style.backgroundRepeat = 'no-repeat';
    }));

    var urlField = body.lastElementChild.querySelector('input');
    urlField.addEventListener('change', function () { setTimeout(renderInspector, 0); });

    if (!url) return;

    body.appendChild(choiceField('見せ方', [
      { value: 'cover', label: '全体を覆う' },
      { value: 'contain', label: '全体を収める' },
      { value: 'repeat', label: '繰り返す' }
    ], elem.style.backgroundRepeat === 'repeat' ? 'repeat' : (elem.style.backgroundSize || 'cover'),
      function (value) {
        if (value === 'repeat') {
          elem.style.backgroundRepeat = 'repeat';
          elem.style.backgroundSize = 'auto';
          return;
        }
        elem.style.backgroundRepeat = 'no-repeat';
        elem.style.backgroundSize = value;
      }));

    body.appendChild(choiceField('位置', [
      { value: 'top', label: '上' },
      { value: 'center', label: '中央' },
      { value: 'bottom', label: '下' }
    ], (elem.style.backgroundPosition || 'center').split(' ').pop(), function (value) {
        elem.style.backgroundPosition = value;
      }));

    body.appendChild(fieldNote('Outlook では背景画像が表示されません。'
      + '画像が出ない環境でも読めるよう、近い色を「背景の色」にも入れておいてください。', true));

    body.appendChild(colorField('下地の色（Outlook用）', elem.style.backgroundColor, function (value) {
      elem.style.backgroundColor = value;
    }));
  }

  // --- 枠線 ---------------------------------------------------------------

  var BORDER_SIDES = [
    { value: 'all', label: 'すべて' },
    { value: 'top', label: '上' },
    { value: 'right', label: '右' },
    { value: 'bottom', label: '下' },
    { value: 'left', label: '左' }
  ];

  var BORDER_STYLES = [
    { value: 'solid', label: '実線' },
    { value: 'dashed', label: '破線' },
    { value: 'dotted', label: '点線' }
  ];

  /**
   * 枠線。
   *
   * 以前は「辺を選ぶ」だけで1行を使い、しかもどの辺を編集中かが文字でしか
   * 分からなかった。四角の図の縁を押して選ぶ形にすると、対象が一目で分かり、
   * 4行が1行半に収まる。
   */
  function borderFields(body, elem) {
    var side = wys.borderSide || 'all';
    var suffix = side === 'all' ? 'Top' : side.charAt(0).toUpperCase() + side.slice(1);
    var prop = side === 'all' ? 'border' : 'border' + suffix;

    // 書き込む直前に読み直す。組んだ時点の値を使うと、
    // 隣の欄で変えた内容を古い値で上書きしてしまう
    var live = function () { return readBorder(elem, suffix); };
    var current = live();
    var isSet = hasAnyBorder(elem);

    var wrap = fieldWrap('枠線', isSet, function () {
      ['border', 'borderTop', 'borderRight', 'borderBottom', 'borderLeft'].forEach(function (key) {
        elem.style[key] = '';
      });
      elem.style.removeProperty('border-image');
    });

    var row = document.createElement('div');
    row.className = 'border-row';
    row.appendChild(borderSidePicker(elem, side));

    var stack = document.createElement('div');
    stack.className = 'border-stack';

    // 太さ・単位・色を1行に
    var top = document.createElement('div');
    top.className = 'border-line';

    var width = document.createElement('input');
    width.type = 'number';
    width.min = '0';
    width.max = '40';
    width.className = 'num';
    width.value = current.width;
    width.addEventListener('change', function () {
      var now = live();
      commitField(function () {
        writeBorder(elem, prop, Math.max(0, parseInt(width.value, 10) || 0), now.style, now.color);
      }, width.value);
    });

    var unit = document.createElement('span');
    unit.className = 'unit-static';
    unit.textContent = 'px';

    var color = document.createElement('input');
    color.type = 'color';
    color.value = current.color || '#e5e7eb';
    color.addEventListener('change', function () {
      var now = live();
      commitField(function () {
        writeBorder(elem, prop, now.width || 1, now.style, color.value);
      }, color.value);
      renderInspector();
    });

    top.appendChild(width);
    top.appendChild(unit);
    top.appendChild(color);
    stack.appendChild(top);

    stack.appendChild(choiceRow(BORDER_STYLES, current.style, function (value) {
      var now = live();
      writeBorder(elem, prop, now.width || 1, value, now.color);
    }));

    row.appendChild(stack);
    wrap.appendChild(row);
    body.appendChild(wrap);
  }

  /** 四角の図。縁を押すとその辺、真ん中を押すと4辺すべて */
  function borderSidePicker(elem, side) {
    var box = document.createElement('div');
    box.className = 'side-box';

    ['top', 'right', 'bottom', 'left'].forEach(function (key) {
      var edge = document.createElement('button');
      edge.className = 'side-edge side-' + key + (side === key ? ' active' : '');
      edge.title = { top: '上', right: '右', bottom: '下', left: '左' }[key] + 'の辺';
      edge.setAttribute('aria-label', edge.title);

      // その辺に線が入っていれば、押していなくても色を残す
      var suffix = key.charAt(0).toUpperCase() + key.slice(1);
      if (readBorder(elem, suffix).width) edge.classList.add('has');

      edge.addEventListener('click', function () {
        wys.borderSide = key;
        renderInspector();
      });

      box.appendChild(edge);
    });

    var all = document.createElement('button');
    all.className = 'side-all' + (side === 'all' ? ' active' : '');
    all.textContent = '全';
    all.title = '4辺すべて';
    all.addEventListener('click', function () {
      wys.borderSide = 'all';
      renderInspector();
    });

    box.appendChild(all);
    return box;
  }

  function hasAnyBorder(elem) {
    return ['Top', 'Right', 'Bottom', 'Left'].some(function (suffix) {
      return readBorder(elem, suffix).width > 0;
    });
  }

  /** 見出しを持たない、選択肢の並びだけ */
  function choiceRow(options, current, apply) {
    var row = document.createElement('div');
    row.className = 'choice-row';

    options.forEach(function (option) {
      var button = document.createElement('button');
      button.textContent = option.label;
      button.classList.toggle('active', option.value === current);
      button.addEventListener('click', function () {
        commitField(apply, option.value);
        renderInspector();
      });
      row.appendChild(button);
    });

    return row;
  }

  function readBorder(elem, suffix) {
    return {
      width: parseInt(elem.style['border' + suffix + 'Width'], 10) || 0,
      style: elem.style['border' + suffix + 'Style'] || 'solid',
      color: toHex(elem.style['border' + suffix + 'Color']) || ''
    };
  }

  function writeBorder(elem, prop, width, style, color) {
    if (!width) {
      elem.style[prop] = '';
      // 消したあとに残る意味のない指定を落とす
      elem.style.removeProperty('border-image');
      return;
    }
    elem.style[prop] = width + 'px ' + (style || 'solid') + ' ' + (color || '#e5e7eb');
  }

  // --- 影 -----------------------------------------------------------------

  var SHADOWS = [
    { value: '', label: 'なし' },
    { value: '0 2px 6px rgba(0,0,0,0.08)', label: '弱' },
    { value: '0 4px 16px rgba(0,0,0,0.12)', label: '中' },
    { value: '0 8px 24px rgba(0,0,0,0.15)', label: '強' }
  ];

  /**
   * 影は数値4つを別々に触らせても分かりにくいので、段階から選ばせる。
   * どれにも当てはまらない指定は「そのまま」として残す。
   */
  /** ブラウザに一度書かせて、比べられる形に揃える */
  function normalizeShadow(value) {
    if (!value) return '';

    var probe = wys.doc.createElement('div');
    probe.style.boxShadow = value;
    return probe.style.boxShadow;
  }

  function shadowField(body, elem) {
    var current = elem.style.boxShadow || '';

    var options = SHADOWS.map(function (item) {
      return { value: normalizeShadow(item.value), label: item.label };
    });

    var known = options.some(function (item) { return item.value === current; });
    if (current && !known) options.push({ value: current, label: 'そのまま' });

    // 言葉では強さの差が伝わらないので、見本そのものを押させる
    var wrap = fieldWrap('影', !!current, function () { elem.style.boxShadow = ''; });

    var row = document.createElement('div');
    row.className = 'shadow-row';

    options.forEach(function (option) {
      var button = document.createElement('button');
      button.className = 'shadow-sample' + (option.value === current ? ' active' : '');
      button.textContent = option.label;
      button.style.boxShadow = option.value;
      button.title = option.label + 'の影';

      button.addEventListener('click', function () {
        commitField(function () { elem.style.boxShadow = option.value; }, option.value);
        renderInspector();
      });

      row.appendChild(button);
    });

    wrap.appendChild(row);
    body.appendChild(wrap);

    if (current) {
      body.appendChild(fieldNote('Outlook では影が表示されません。無くても読める見た目にしてください。'));
    }
  }

  /** 透明度を 0〜100% で選ぶ */
  function alphaField(label, alpha, apply) {
    var wrap = fieldWrap(label);

    var row = document.createElement('div');
    row.className = 'field-row';

    var range = document.createElement('input');
    range.type = 'range';
    range.min = '0';
    range.max = '100';
    range.step = '5';
    range.value = String(Math.round(alpha * 100));

    var out = document.createElement('span');
    out.className = 'alpha-value';
    out.textContent = range.value + '%';

    range.addEventListener('input', function () { out.textContent = range.value + '%'; });
    range.addEventListener('change', function () {
      commitField(apply, parseInt(range.value, 10) / 100);
    });

    row.appendChild(range);
    row.appendChild(out);
    wrap.appendChild(row);
    return wrap;
  }


  /** 択一の選択肢をボタンで並べる */
  function choiceField(label, options, current, apply) {
    var wrap = fieldWrap(label);

    var row = document.createElement('div');
    row.className = 'choice-row';

    options.forEach(function (option) {
      var button = document.createElement('button');
      button.textContent = option.label;
      button.classList.toggle('active', option.value === current);

      button.addEventListener('click', function () {
        commitField(apply, option.value);
        renderInspector();
      });

      row.appendChild(button);
    });

    wrap.appendChild(row);
    return wrap;
  }

  /** 補足の一文。注意を促したいときは強めの見た目にする */
  function fieldNote(text, warn) {
    var note = document.createElement('p');
    note.className = warn ? 'field-note warn' : 'field-note';
    note.textContent = text;
    return note;
  }

  function imageSizeField(elem) {
    var wrap = fieldWrap('画像のサイズ（px）');

    var row = document.createElement('div');
    row.className = 'inline-fields';

    var widthInput = sizeInput('幅', currentImageWidth(elem));
    var heightInput = sizeInput('高さ', parseInt(elem.getAttribute('height'), 10) || '');

    var keep = document.createElement('label');
    keep.className = 'check-inline';
    var keepBox = document.createElement('input');
    keepBox.type = 'checkbox';
    keepBox.checked = true;
    keep.appendChild(keepBox);
    keep.appendChild(document.createTextNode('縦横比を保つ'));

    var ratio = function () {
      var natural = elem.naturalWidth && elem.naturalHeight
        ? elem.naturalHeight / elem.naturalWidth
        : 0;
      return natural;
    };

    widthInput.input.addEventListener('change', function () {
      var width = parseInt(widthInput.input.value, 10) || 0;
      if (keepBox.checked && ratio() && width) {
        heightInput.input.value = Math.round(width * ratio());
      }
      commitField(function () {
        applyImageSize(elem, width, keepBox.checked ? 0 : parseInt(heightInput.input.value, 10) || 0);
      });
    });

    heightInput.input.addEventListener('change', function () {
      var height = parseInt(heightInput.input.value, 10) || 0;
      if (keepBox.checked && ratio() && height) {
        widthInput.input.value = Math.round(height / ratio());
      }
      commitField(function () {
        applyImageSize(elem, parseInt(widthInput.input.value, 10) || 0, height);
      });
    });

    row.appendChild(widthInput.wrap);
    row.appendChild(heightInput.wrap);
    wrap.appendChild(row);
    wrap.appendChild(keep);

    var note = document.createElement('span');
    note.className = 'field-note';
    note.textContent = 'プレビュー上で画像の角をドラッグしても変えられます。';
    wrap.appendChild(note);

    return wrap;
  }

  function sizeInput(label, value) {
    var wrap = document.createElement('div');
    wrap.className = 'pad-cell';

    var caption = document.createElement('span');
    caption.textContent = label;

    var input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.step = '10';
    input.value = value || '';

    wrap.appendChild(caption);
    wrap.appendChild(input);
    return { wrap: wrap, input: input };
  }

  function currentImageWidth(elem) {
    return parseInt(elem.getAttribute('width'), 10)
      || parseInt(elem.style.maxWidth, 10)
      || parseInt(elem.style.width, 10)
      || Math.round(elem.getBoundingClientRect().width)
      || '';
  }

  /**
   * 画像のサイズを反映する。
   * テンプレートは width:100%; max-width:Npx の形で流動的にしているので、
   * その形を保ったまま上限だけを差し替える。
   */
  function applyImageSize(elem, width, height) {
    if (width) {
      elem.setAttribute('width', String(width));
      if (/%/.test(elem.style.width)) {
        elem.style.maxWidth = width + 'px';
      } else {
        elem.style.width = width + 'px';
      }
    }

    if (height) {
      elem.setAttribute('height', String(height));
      elem.style.height = height + 'px';
    } else {
      elem.removeAttribute('height');
      elem.style.height = 'auto';
    }
  }

  /** セルや枠の幅。px と % のどちらでも受け付ける */
  /**
   * 幅。単位はボタンで選ぶ。
   * 「240」とだけ打って効かない、という詰まり方を避けるため。
   */
  function boxWidthField(elem) {
    var attr = elem.getAttribute('width');
    var current = elem.style.width || (attr ? (/%$/.test(attr) ? attr : attr + 'px') : '');
    var unit = /%$/.test(current) ? '%' : (current ? 'px' : 'auto');

    var wrap = fieldWrap('幅', !!current, function () {
      elem.style.removeProperty('width');
      elem.removeAttribute('width');
    });

    var write = function (amount, nextUnit) {
      if (nextUnit === 'auto' || !amount) {
        elem.style.removeProperty('width');
        elem.removeAttribute('width');
        return;
      }

      var value = amount + nextUnit;
      elem.style.width = value;

      // 古いメールソフト向けに width 属性も揃える
      if (['TABLE', 'TD', 'TH'].indexOf(elem.tagName) !== -1) {
        elem.setAttribute('width', nextUnit === '%' ? value : String(amount));
      }
    };

    var row = document.createElement('div');
    row.className = 'width-row';

    var input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.className = 'num grow';
    input.value = parseInt(current, 10) || '';
    input.placeholder = '600';
    input.disabled = unit === 'auto';
    input.addEventListener('change', function () {
      commitField(function () {
        write(Math.max(0, parseInt(input.value, 10) || 0), unit === 'auto' ? 'px' : unit);
      }, input.value);
      renderInspector();
    });

    row.appendChild(input);

    var units = document.createElement('div');
    units.className = 'unit-row';

    [{ value: 'px', label: 'px' }, { value: '%', label: '%' }, { value: 'auto', label: '自動' }]
      .forEach(function (option) {
        var button = document.createElement('button');
        button.textContent = option.label;
        button.classList.toggle('active', option.value === unit);
        button.addEventListener('click', function () {
          commitField(function () {
            write(Math.max(0, parseInt(input.value, 10) || 0), option.value);
          }, option.value);
          renderInspector();
        });
        units.appendChild(button);
      });

    row.appendChild(units);
    wrap.appendChild(row);
    return wrap;
  }

  /**
   * 角丸。4隅を別々に指定できる。
   * 「左だけ角ばらせて、右だけ丸める」という作りがカードでよく使われるため。
   */
  function radiusField(elem) {
    var corner = function (key) { return parseInt(elem.style[key], 10) || 0; };
    var isSet = ['borderTopLeftRadius', 'borderTopRightRadius',
      'borderBottomRightRadius', 'borderBottomLeftRadius'].some(corner);

    var wrap = fieldWrap('角丸（px）', isSet, function () {
      elem.style.removeProperty('border-radius');
      ['borderTopLeftRadius', 'borderTopRightRadius',
        'borderBottomRightRadius', 'borderBottomLeftRadius'].forEach(function (key) {
        elem.style[key] = '';
      });
    });

    var corners = [
      { key: 'borderTopLeftRadius', label: '左上' },
      { key: 'borderTopRightRadius', label: '右上' },
      { key: 'borderBottomRightRadius', label: '右下' },
      { key: 'borderBottomLeftRadius', label: '左下' }
    ];

    wrap.appendChild(numberGrid(corners, function (key) {
      return parseInt(elem.style[key], 10) || 0;
    }, function (key, amount) {
      elem.style[key] = amount ? amount + 'px' : '';
    }, 'radius'));

    wrap.appendChild(fieldNote('Outlook では角丸にならず四角で表示されます。'));
    return wrap;
  }

  /** 行間。よく使う3段階を押すか、倍率を直接入れる */
  function lineHeightField(elem) {
    return presetField(elem, {
      label: '行間',
      prop: 'lineHeight',
      presets: [{ value: '1.4', label: '狭い' }, { value: '1.7', label: '標準' }, { value: '2', label: '広い' }],
      placeholder: '1.7',
      parse: function (text) { return text.trim(); },
      note: '文字サイズに対する倍率です。'
    });
  }

  /** 文字サイズ。単位を打たせない */
  function fontSizeField(elem) {
    return presetField(elem, {
      label: '文字サイズ（px）',
      prop: 'fontSize',
      presets: [{ value: '13px', label: '小' }, { value: '15px', label: '標準' },
        { value: '18px', label: '大' }, { value: '22px', label: '特大' }],
      placeholder: '15',
      strip: 'px',
      parse: function (text) {
        var num = parseFloat(text);
        return num ? num + 'px' : '';
      }
    });
  }

  /**
   * よく使う値をボタンに、細かい指定は数値欄に。
   *
   * 「px を打ち忘れて効かない」がこの種の入力で最も多い詰まり方なので、
   * 単位は入力させず、こちらで付ける。
   */
  function presetField(elem, spec) {
    var current = elem.style[spec.prop] || '';

    var wrap = fieldWrap(spec.label, !!current, function () {
      elem.style[spec.prop] = '';
    });

    var row = document.createElement('div');
    row.className = 'preset-row';

    spec.presets.forEach(function (preset) {
      var button = document.createElement('button');
      button.textContent = preset.label;
      button.classList.toggle('active', preset.value === current);
      button.addEventListener('click', function () {
        commitField(function () { elem.style[spec.prop] = preset.value; }, preset.value);
        renderInspector();
      });
      row.appendChild(button);
    });

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'num';
    input.placeholder = spec.placeholder;
    input.value = spec.strip ? current.replace(spec.strip, '') : current;
    input.addEventListener('change', function () {
      commitField(function () { elem.style[spec.prop] = spec.parse(input.value); }, input.value);
      renderInspector();
    });

    row.appendChild(input);
    wrap.appendChild(row);

    if (spec.note) wrap.appendChild(fieldNote(spec.note));
    return wrap;
  }

  /** 外側の余白。まわりの要素との間隔 */
  function marginField(elem) {
    var isSet = ['marginTop', 'marginRight', 'marginBottom', 'marginLeft']
      .some(function (key) { return elem.style[key]; });

    var wrap = fieldWrap('外側の余白（px）', isSet, function () {
      elem.style.removeProperty('margin');
      ['marginTop', 'marginRight', 'marginBottom', 'marginLeft'].forEach(function (key) {
        elem.style[key] = '';
      });
    });

    var sides = [
      { key: 'marginTop', label: '上' },
      { key: 'marginRight', label: '右' },
      { key: 'marginBottom', label: '下' },
      { key: 'marginLeft', label: '左' }
    ];

    wrap.appendChild(numberGrid(sides, function (key) {
      return parseInt(elem.style[key], 10) || 0;
    }, function (key, amount) {
      elem.style[key] = amount + 'px';
    }, 'margin'));

    wrap.appendChild(fieldNote('この要素と、まわりの要素との間隔です。'));
    return wrap;
  }

  /**
   * 上右下左（または4隅）の数値。
   *
   * 4辺そろえたい場面が多いのに、以前は必ず4回打つ必要があった。
   * 鎖を入れると1回で4つとも変わる。
   */
  function numberGrid(items, read, write, linkKey) {
    var row = document.createElement('div');
    row.className = 'quad-row';

    var linked = !!wys.linkPad[linkKey];

    var link = document.createElement('button');
    link.className = 'quad-link' + (linked ? ' active' : '');
    link.textContent = linked ? '⛓' : '⛓';
    link.title = linked ? 'まとめて変える（解除するには押す）' : '4つをまとめて変える';
    link.setAttribute('aria-pressed', String(linked));
    link.addEventListener('click', function () {
      wys.linkPad[linkKey] = !linked;
      renderInspector();
    });
    row.appendChild(link);

    var grid = document.createElement('div');
    grid.className = 'pad-grid';

    items.forEach(function (item) {
      var cell = document.createElement('div');
      cell.className = 'pad-cell';

      var caption = document.createElement('span');
      caption.textContent = item.label;

      var input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.step = '4';
      input.value = read(item.key);

      input.addEventListener('change', function () {
        var amount = Math.max(0, parseInt(input.value, 10) || 0);
        input.value = amount;

        commitField(function () {
          if (!linked) {
            write(item.key, amount);
            return;
          }
          items.forEach(function (other) { write(other.key, amount); });
        }, amount);

        if (linked) renderInspector();
      });

      cell.appendChild(caption);
      cell.appendChild(input);
      grid.appendChild(cell);
    });

    row.appendChild(grid);
    return row;
  }

  /**
   * リンクの開き方。メールでは新しいタブで開くのが基本。
   * rel="noopener" は、開いた先から元のページを操作されないための指定。
   */
  function linkTargetField(elem) {
    var blank = elem.getAttribute('target') === '_blank';

    return choiceField('リンクの開き方', [
      { value: 'blank', label: '新しいタブ' },
      { value: 'self', label: '同じタブ' }
    ], blank ? 'blank' : 'self', function (value) {
      if (value === 'blank') {
        elem.setAttribute('target', '_blank');
        elem.setAttribute('rel', 'noopener');
        return;
      }
      elem.removeAttribute('target');
      elem.removeAttribute('rel');
    });
  }

  function commitField(apply, value) {
    pushUndo();
    apply(value);
    syncFromWys();
  }

  /**
   * 項目の枠。
   *
   * HTMLメールは親から受け継ぐ指定が多く、「この要素に自分で入れた値」と
   * 「受け継いだ値」が見分けられなかった。入っているものには印を付け、
   * その場で取り消せるようにする。
   *
   * @param {boolean} isSet この要素に値が入っているか
   * @param {Function} onReset 取り消したときの処理
   */
  function fieldWrap(label, isSet, onReset) {
    var wrap = document.createElement('div');
    wrap.className = 'field' + (isSet ? ' is-set' : '');

    var caption = document.createElement('label');

    if (isSet) {
      var dot = document.createElement('i');
      dot.className = 'set-dot';
      caption.appendChild(dot);
    }

    caption.appendChild(document.createTextNode(label));

    if (isSet && onReset) {
      var reset = document.createElement('button');
      reset.className = 'field-reset';
      reset.textContent = '×';
      reset.title = 'この指定を取り消す';
      reset.setAttribute('aria-label', label + 'の指定を取り消す');

      reset.addEventListener('click', function () {
        commitField(onReset, null);
        renderInspector();
      });

      caption.appendChild(reset);
    }

    wrap.appendChild(caption);
    return wrap;
  }

  /** 属性ひとつを扱う素朴な欄 */
  function plainField(label, value, apply, isSet, onReset) {
    var wrap = fieldWrap(label, isSet, onReset);

    var input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    input.addEventListener('change', function () { commitField(apply, input.value); });

    wrap.appendChild(input);
    return wrap;
  }

  function textField(label, value, apply) {
    var wrap = fieldWrap(label);

    var input = document.createElement('input');
    input.type = 'text';
    input.value = value || '';
    input.addEventListener('change', function () { commitField(apply, input.value); });
    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') input.blur();
    });

    wrap.appendChild(input);
    return wrap;
  }

  /**
   * 色。
   *
   * 原稿の中で実際に使われている色を並べる。ブランド色を毎回コードで打つ
   * 必要がなくなり、色のばらつきも防げる。
   */
  function colorField(label, value, apply, elem, prop) {
    var isSet = !!(elem && prop && elem.style[prop]);
    var wrap = fieldWrap(label, isSet, isSet ? function () { elem.style[prop] = ''; } : null);

    var row = document.createElement('div');
    row.className = 'field-row';

    var picker = document.createElement('input');
    picker.type = 'color';
    picker.value = toHex(value) || '#ffffff';

    var hex = document.createElement('input');
    hex.type = 'text';
    hex.className = 'hex';
    hex.maxLength = 7;
    hex.value = toHex(value) || '';
    hex.placeholder = '#000000';

    picker.addEventListener('input', function () { hex.value = picker.value; });
    picker.addEventListener('change', function () { commitField(apply, picker.value); });

    hex.addEventListener('change', function () {
      var normalized = normalizeHex(hex.value);
      if (!normalized) {
        hex.value = toHex(value) || '';
        setStatus('色コードは #1a73e8 の形式で入力してください', 'err');
        return;
      }
      picker.value = normalized;
      hex.value = normalized;
      commitField(apply, normalized);
    });

    row.appendChild(picker);
    row.appendChild(hex);
    wrap.appendChild(row);

    var used = documentColors();
    if (used.length) {
      var palette = document.createElement('div');
      palette.className = 'used-colors';

      var caption = document.createElement('span');
      caption.textContent = 'この原稿で使われている色';
      palette.appendChild(caption);

      used.forEach(function (code) {
        var swatch = document.createElement('button');
        swatch.className = 'used-swatch';
        swatch.style.background = code;
        swatch.title = code;
        swatch.setAttribute('aria-label', code);

        swatch.addEventListener('click', function () {
          picker.value = code;
          hex.value = code;
          commitField(apply, code);
          renderInspector();
        });

        palette.appendChild(swatch);
      });

      wrap.appendChild(palette);
    }

    return wrap;
  }

  /**
   * 原稿の中で使われている色を、よく使われている順に集める。
   * 見た目を揃えるための道具なので、数は10色までに絞る。
   */
  function documentColors() {
    if (!wys.doc) return [];

    var counts = {};
    var add = function (value) {
      var code = toHex(value);
      if (!code) return;
      counts[code] = (counts[code] || 0) + 1;
    };

    var nodes = wys.doc.querySelectorAll('[style], [bgcolor]');
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      add(node.style.color);
      add(node.style.backgroundColor);
      add(node.style.borderTopColor);
      add(node.style.borderLeftColor);
      add(node.getAttribute('bgcolor'));
    }

    return Object.keys(counts)
      .sort(function (a, b) { return counts[b] - counts[a]; })
      .slice(0, 10);
  }

  /**
   * 画像のURL。小さく実物を出す。
   * 打ち間違いは、プレビューで壊れた画像を見るまで気づけないため。
   */
  function imageUrlField(elem) {
    var url = elem.getAttribute('src') || '';

    var wrap = fieldWrap('画像URL', !!url, function () { elem.removeAttribute('src'); });

    var row = document.createElement('div');
    row.className = 'url-row';

    var thumb = document.createElement('img');
    thumb.className = 'url-thumb';
    thumb.alt = '';
    thumb.src = url;
    thumb.addEventListener('error', function () { thumb.classList.add('broken'); });

    var input = document.createElement('input');
    input.type = 'text';
    input.value = url;
    input.addEventListener('change', function () {
      commitField(function () { elem.setAttribute('src', input.value); }, input.value);
      renderInspector();
    });

    row.appendChild(thumb);
    row.appendChild(input);
    wrap.appendChild(row);
    return wrap;
  }

  /** リンクのURL。別タブで開いて確かめられるようにする */
  function linkUrlField(elem) {
    var href = elem.getAttribute('href') || '';

    var wrap = fieldWrap('リンクURL', !!href, function () { elem.removeAttribute('href'); });

    var row = document.createElement('div');
    row.className = 'url-row';

    var input = document.createElement('input');
    input.type = 'text';
    input.value = href;
    input.addEventListener('change', function () {
      commitField(function () { elem.setAttribute('href', input.value); }, input.value);
    });

    var open = document.createElement('button');
    open.className = 'url-open';
    open.textContent = '開く';
    open.title = '別のタブで開いて確かめる';
    open.disabled = !/^https?:/i.test(href);
    open.addEventListener('click', function () {
      window.open(input.value, '_blank');
    });

    row.appendChild(input);
    row.appendChild(open);
    wrap.appendChild(row);

    if (href && !/^https?:/i.test(href)) {
      wrap.appendChild(fieldNote('差し込み用の記号などは、そのまま配信システムに渡ります。'));
    }

    return wrap;
  }

  /** ブロック内の余白を上下左右で指定する */
  function paddingField(elem) {
    var keys = ['paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft'];
    var isSet = keys.some(function (key) { return elem.style[key]; });

    var wrap = fieldWrap('ブロック内の余白（px）', isSet, function () {
      elem.style.removeProperty('padding');
      keys.forEach(function (key) { elem.style[key] = ''; });
    });

    wrap.appendChild(numberGrid([
      { key: 'paddingTop', label: '上' },
      { key: 'paddingRight', label: '右' },
      { key: 'paddingBottom', label: '下' },
      { key: 'paddingLeft', label: '左' }
    ], function (key) {
      return parseInt(elem.style[key], 10) || 0;
    }, function (key, amount) {
      elem.style[key] = amount + 'px';
    }, 'padding'));

    wrap.appendChild(fieldNote('文字とブロックの枠との間隔です。'));
    return wrap;
  }

  /**
   * 中身の寄せ。
   *
   * これまで align 属性しか読み書きしていなかったため、CSS の text-align で
   * 寄せてあるものが「左寄せ」と表示されていた。両方を見て、両方に書く。
   * align 属性は古いメールソフト向けで、セルや表にだけ意味がある。
   */
  function alignField(elem) {
    var wrap = fieldWrap('中身の寄せ');

    var row = document.createElement('div');
    row.className = 'align-buttons';

    var current = (elem.style.textAlign || elem.getAttribute('align') || '').toLowerCase() || 'left';
    var keepAttr = ['TD', 'TH', 'TABLE', 'TR'].indexOf(elem.tagName) !== -1 || elem.hasAttribute('align');

    [
      { value: 'left', label: '左寄せ' },
      { value: 'center', label: '中央' },
      { value: 'right', label: '右寄せ' }
    ].forEach(function (option) {
      var button = document.createElement('button');
      button.title = option.label;
      button.innerHTML = alignIcon(option.value);
      button.classList.toggle('active', current === option.value);

      button.addEventListener('click', function () {
        commitField(function () {
          elem.style.textAlign = option.value === 'left' ? '' : option.value;

          if (!keepAttr) return;
          if (option.value === 'left') elem.removeAttribute('align');
          else elem.setAttribute('align', option.value);
        }, option.value);
        renderInspector();
      });

      row.appendChild(button);
    });

    wrap.appendChild(row);
    return wrap;
  }

  /**
   * 行・列を編集してよいテーブルを返す。
   *
   * 本文の外枠やレイアウト用の1マスのテーブルを触ると構造が壊れるので、
   * 「本文テーブルではない」「セルが2つ以上ある」ものだけを対象にする。
   */
  function editableTable(elem) {
    var node = elem;
    while (node && wys.doc && node !== wys.doc.body) {
      if (node.tagName === 'TABLE') {
        if (node === contentTable()) return null;
        return countCells(node) >= 2 ? node : null;
      }
      node = node.parentElement;
    }
    return null;
  }

  function countCells(table) {
    return table.querySelectorAll(':scope > tbody > tr > td, :scope > tbody > tr > th, :scope > tr > td, :scope > tr > th').length;
  }

  function rowsOf(table) {
    return Array.prototype.filter.call(table.rows, function (row) {
      return row.closest('table') === table;
    });
  }

  /** 選択中のセルと、その行・列の位置 */
  function cellPosition(elem, table) {
    var cell = elem;
    while (cell && cell.tagName !== 'TD' && cell.tagName !== 'TH') {
      cell = cell.parentElement;
    }
    if (!cell || cell.closest('table') !== table) return null;

    var row = cell.parentElement;
    return { cell: cell, row: row, index: Array.prototype.indexOf.call(row.cells, cell) };
  }

  function tableEditField(elem, table) {
    var wrap = fieldWrap('表の行と列');
    var position = cellPosition(elem, table);

    if (!position) {
      var hint = document.createElement('span');
      hint.className = 'field-note';
      hint.textContent = '表のセルをクリックすると、行や列を追加・削除できます。';
      wrap.appendChild(hint);
      return wrap;
    }

    var rows = rowsOf(table);
    var grid = document.createElement('div');
    grid.className = 'op-grid';

    grid.appendChild(opButton('行を上に追加', function () { addRow(table, position, -1); }));
    grid.appendChild(opButton('行を下に追加', function () { addRow(table, position, 1); }));
    grid.appendChild(opButton('列を左に追加', function () { addColumn(table, position.index); }));
    grid.appendChild(opButton('列を右に追加', function () { addColumn(table, position.index + 1); }));

    var removeRow = opButton('この行を削除', function () { deleteRow(table, position); });
    removeRow.disabled = rows.length <= 1;

    var removeCol = opButton('この列を削除', function () { deleteColumn(table, position.index); });
    removeCol.disabled = position.row.cells.length <= 1;

    grid.appendChild(removeRow);
    grid.appendChild(removeCol);
    wrap.appendChild(grid);

    // 列幅
    var widthWrap = document.createElement('div');
    widthWrap.className = 'field';

    var caption = document.createElement('label');
    caption.textContent = 'この列の幅（px または %）';

    var input = document.createElement('input');
    input.type = 'text';
    input.value = position.cell.style.width || position.cell.getAttribute('width') || '';
    input.placeholder = '例: 120px / 30%';
    input.addEventListener('change', function () {
      commitField(function () { setColumnWidth(table, position.index, input.value); });
    });

    widthWrap.appendChild(caption);
    widthWrap.appendChild(input);
    wrap.appendChild(widthWrap);

    return wrap;
  }

  function opButton(label, onClick) {
    var button = document.createElement('button');
    button.textContent = label;
    button.addEventListener('click', function () {
      onClick();
      resyncSelectionMark();
      syncFromWys();
      renderInspector();
    });
    return button;
  }

  /**
   * 選択中の印が付いた要素をひとつだけにする。
   * 行や列の複製・削除のあとに取り残しが出ないようにするための後始末。
   */
  function resyncSelectionMark() {
    clearAttr('data-wys-sel');

    if (wys.selected && wys.doc && wys.doc.contains(wys.selected)) {
      wys.selected.setAttribute('data-wys-sel', '');
    } else {
      wys.selected = null;
    }
  }

  /**
   * 編集用の目印を持ち込まない複製をつくる。
   *
   * そのまま cloneNode すると、選択中の印（data-wys-sel）や編集中の指定まで
   * 複製され、選択の枠が二重に残ったままになる。
   */
  function cleanClone(node) {
    var copy = node.cloneNode(true);

    EDIT_ATTRS.forEach(function (attr) {
      if (copy.hasAttribute(attr)) copy.removeAttribute(attr);
      copy.querySelectorAll('[' + attr + ']').forEach(function (child) {
        child.removeAttribute(attr);
      });
    });

    return copy;
  }

  /** セルの中身だけを空にした複製をつくる（書式は引き継ぐ） */
  function blankCell(cell) {
    var copy = cleanClone(cell);
    copy.innerHTML = '&nbsp;';
    return copy;
  }

  function addRow(table, position, direction) {
    pushUndo();
    var row = cleanClone(position.row);

    Array.prototype.forEach.call(row.cells, function (cell) {
      cell.innerHTML = '&nbsp;';
    });

    position.row.parentNode.insertBefore(row, direction < 0 ? position.row : position.row.nextSibling);
  }

  function deleteRow(table, position) {
    if (rowsOf(table).length <= 1) return;
    pushUndo();
    position.row.parentNode.removeChild(position.row);
    wys.selected = null;
  }

  function addColumn(table, index) {
    pushUndo();
    rowsOf(table).forEach(function (row) {
      var source = row.cells[Math.min(index, row.cells.length - 1)];
      if (!source) return;
      row.insertBefore(blankCell(source), row.cells[index] || null);
    });
  }

  function deleteColumn(table, index) {
    pushUndo();
    rowsOf(table).forEach(function (row) {
      if (row.cells.length > 1 && row.cells[index]) {
        row.removeChild(row.cells[index]);
      }
    });
    wys.selected = null;
  }

  function setColumnWidth(table, index, value) {
    var text = String(value).trim();
    var normalized = /^\d+$/.test(text) ? text + 'px' : text;

    rowsOf(table).forEach(function (row) {
      var cell = row.cells[index];
      if (!cell) return;

      if (!normalized) {
        cell.style.removeProperty('width');
        cell.removeAttribute('width');
      } else {
        cell.style.width = normalized;
        cell.setAttribute('width', normalized.replace('px', ''));
      }
    });
  }

  function alignIcon(kind) {
    return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"'
      + ' stroke-width="1.5" stroke-linecap="round"><path d="' + ALIGN_ICONS[kind] + '"/></svg>';
  }

  /** #rgb / rgb() を #rrggbb に正規化する。無効なら空文字 */
  function toHex(value) {
    if (!value) return '';

    if (value.charAt(0) === '#') return normalizeHex(value);

    var match = value.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/);
    if (!match) return '';

    return '#' + [match[1], match[2], match[3]].map(function (part) {
      return ('0' + parseInt(part, 10).toString(16)).slice(-2);
    }).join('');
  }

  function normalizeHex(value) {
    var text = String(value || '').trim();
    if (text.charAt(0) !== '#') text = '#' + text;

    if (/^#[0-9a-f]{3}$/i.test(text)) {
      return ('#' + text[1] + text[1] + text[2] + text[2] + text[3] + text[3]).toLowerCase();
    }
    if (/^#[0-9a-f]{6}$/i.test(text)) return text.toLowerCase();
    return '';
  }

  // -------------------------------------------------------------------------
  // AIに聞く
  //
  // このアプリはAIを実行しない。AIに貼り付けるための文面を組み立て、
  // 返ってきたHTMLを取り込むところまでを受け持つ。
  //
  // 相手は選ばない。ChatGPT でも Claude でも Gemini でも、使い慣れたもので
  // かまわない。だからクリップボード経由で渡す。特定のサービスのURLに
  // 寄せると、そこが変わったときに使えなくなる。
  // -------------------------------------------------------------------------

  /** カスタムテンプレートの分類名。store.js と同じ文字列にする */
  var MY_CATEGORY = '自分のテンプレート';

  /** 依頼の種類（あらかじめ用意したもの） */
  var AI_PRESETS = [
    { key: 'draft', name: '文面を考える',
      body: 'このメールの本文を書いてください。伝えたいことは次のとおりです。' },
    { key: 'polish', name: '表現を整える',
      body: '本文の日本語を、ビジネスメールとして自然で読みやすい表現に整えてください。意味は変えないでください。' },
    { key: 'polite', name: 'もっと丁寧に',
      body: '本文をより丁寧な言い回しに書き直してください。堅苦しくなりすぎないようにしてください。' },
    { key: 'shorten', name: '短くする',
      body: '本文の意味を保ったまま、分量を半分程度まで短くしてください。' },

    { key: 'design', name: '見た目を整える',
      body: '本文の文章は変えずに、見た目だけを整えてください。'
        + '見出しと本文の強弱、余白、行間、そろえ方を見直して、読みやすくしてください。',
      extra: [
        '- 文章・画像・リンク先はそのままにする。変えてよいのは見た目だけ',
        '- いま使われている色をそのまま使う。新しい色は増やさない',
        '- 見出し・本文・注釈で文字の大きさの差をはっきりさせる',

        '- 左右の余白を全体で統一する'
      ] },

    { key: 'decorate', name: '装飾を足す',
      body: '本文の見栄えが良くなるよう、装飾を足してください。'
        + '見出しの帯、区切り線、囲み枠、ボタンなどを、内容に合う形で加えてください。',
      extra: [
