  /*
     プレビューの枠でスクリプトを動かすかどうか。

     iOS/iPadOS の WebKit は、sandbox に allow-scripts が無い枠へ
     **イベントを1つも配らない**。touchstart すら来ない。実機で確かめた
     （枠の中は生きているのに、指の信号だけが入らない）。
     この枠が編集面そのものなので、指では何も触れないことになる。

     allow-scripts を足すと直る。ただし allow-same-origin と併せると
     sandbox は防御にならない（枠の中から自分で外せる）。だから
     **これが起きる場所に限って**足す。

     見分けるのは「指かどうか」ではなく「iOS/iPadOS かどうか」。
     これは WebKit だけの挙動で、Chrome や Edge では同じ指定でも
     イベントが届く。**タッチ画面のWindows機は、指で触れても直す必要が
     無いので、緩めない。** iPhoneのChromeは中身がWebKitなので入る
     （実機で、Safariと同じ結果になることを確認済み）。

     画面の幅では見ない。窓を細くしたPCまで緩んでしまうため。
     pointer: coarse も使わない。読み込みの初期に答えが定まらず、
     外した回はずっと強いままになった（手元の計測で8回中4回）。
     UA と指の点の数は、最初から確定している。
  */
  /*
     狭い画面かどうか。スタイル側の @media (max-width: 600px) と同じ値。
     片方だけ変えると、見た目と動きが食い違う。
  */
  function isNarrow() {
    try {
      return window.matchMedia
        ? window.matchMedia('(max-width: 600px)').matches
        : document.documentElement.clientWidth <= 600;
    } catch (e) {
      return false;
    }
  }

  function wantsTouchPreview() {
    try {
      var ua = navigator.userAgent || '';

      // iPhone と iPad は UA だけで決まる。指の点の数は見ない
      if (/iPad|iPhone|iPod/.test(ua)) return true;

      /*
         iPadOS 13以降は Macintosh を名乗るので、ここだけ指の点で
         見分ける（本物のMacに指の点は無い）。
      */
      return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 0;
    } catch (e) {
      return false;
    }
  }

  /*
     プレビューに流す前に、スクリプトと on* を眠らせる。

     メールにスクリプトは入らない。GmailもOutlookも必ず落とすので、
     **落としたほうがプレビューは実物に近い。** 端末を問わず行う。

     ただし消しはしない。プレビューでの編集は serializeWys() を通って
     本文へ書き戻るので、**消すと利用者の書いたものが黙って失われる。**
     type を変え、属性の名前を変えて眠らせ、書き戻しのときに起こす。

     スクリプトも on* も無い原稿には、**何もしないで元の文字列を返す**。
     整形すら通さない。大多数の原稿にとって、この処理は存在しないのと同じ。
  */
  var INERT_TYPE = 'text/x-wys-inert';
  var WAS_TYPE = 'data-wys-type';
  var WAS_ON = 'data-wys-on-';

  function calmForPreview(html) {
    if (!/<script|\son[a-z]+\s*=/i.test(html)) return html;

    var doc;
    try { doc = new DOMParser().parseFromString(html, 'text/html'); }
    catch (e) { return html; }
    if (!doc || !doc.documentElement) return html;

    var touched = false;

    Array.prototype.slice.call(doc.getElementsByTagName('script')).forEach(function (node) {
      touched = true;
      node.setAttribute(WAS_TYPE, node.getAttribute('type') || '');
      node.setAttribute('type', INERT_TYPE);
    });

    Array.prototype.slice.call(doc.querySelectorAll('*')).forEach(function (node) {
      Array.prototype.slice.call(node.attributes).forEach(function (attr) {
        var name = attr.name.toLowerCase();
        if (name.indexOf('on') !== 0 || name.length < 3) return;

        /*
           名前が on で始まるだけでは足りない。one や onward のような
           ただの属性まで巻き込む。**その要素が本当にその受け口を
           持っているか**で見分ける（node.onclick は null で存在するが、
           node.one は undefined）。
        */
        if (typeof node[name] === 'undefined') return;

        touched = true;
        node.setAttribute(WAS_ON + name, attr.value);
        node.removeAttribute(attr.name);
      });
    });

    if (!touched) return html;

    /*
       末尾に改行を足さない。元の改行は解析の時点で body の中に入るので、
       ここで足すと**編集のたびに1つずつ増える**。
    */
    var doctype = doc.doctype ? '<!DOCTYPE ' + doc.doctype.name + '>\n' : '';
    return doctype + doc.documentElement.outerHTML;
  }

  /** 眠らせたものを起こす。書き戻しの経路で必ず通す */
  function wakeAfterPreview(root) {
    Array.prototype.slice.call(root.querySelectorAll('[' + WAS_TYPE + ']')).forEach(function (node) {
      var was = node.getAttribute(WAS_TYPE);
      if (was) node.setAttribute('type', was);
      else node.removeAttribute('type');
      node.removeAttribute(WAS_TYPE);
    });

    Array.prototype.slice.call(root.querySelectorAll('*')).forEach(function (node) {
      Array.prototype.slice.call(node.attributes).forEach(function (attr) {
        if (attr.name.indexOf(WAS_ON) !== 0) return;
        node.setAttribute(attr.name.slice(WAS_ON.length), attr.value);
        node.removeAttribute(attr.name);
      });
    });
  }

  /** 編集用に注入し、保存前に取り除く属性 */
  var EDIT_ATTRS = ['data-wys-sel', 'data-wys-hot', 'data-wys-doom', 'data-wys-move',

    '        <td align="center" style="padding:24px 12px;">',

    '        </td>',

  /** 配置ボタンのアイコン */

  var state = {

    locations: {},        // サーバーから受け取った両保存場所の状態

    source: '',           // 常にこれが正。プレビューもコードもここを介してやり取りする
    baseline: '',
    baselineTitle: '',
    baselineTags: '',
    docs: [],
    templates: [],
    categories: [],
    loadFailed: false,      // テンプレートの取得に失敗したか

      updateButtons();
    }, function () {
      // ビューアURLが取れなくてもエディタ自体は使えるので握りつぶす
    });

    call('getTemplates').then(function (library) {
      library = library || {};
      state.templates = library.templates || [];
      state.categories = library.categories || [];
      // 読み込みが終わる前に開かれていたら、そのまま描き直す
      if (!el['template-modal'].hidden) renderTemplateList();
      if (state.templates.length && !isDirty() && !state.id) {
        newDoc(state.templates[0].html);

      // 取得できなければ FALLBACK_HTML のまま使う
      state.loadFailed = true;
      if (!el['template-modal'].hidden) renderTemplateList();
    });

    call('getParts').then(function (parts) {
      state.parts = parts || [];
      renderPartButtons();
    }, function () {
      renderPartButtons();
    });

    call('listSignatures').then(function (signatures) {
      state.signatures = signatures || [];
    }, function () {
      state.signatures = [];
    });

    call('listPrompts').then(function (prompts) {
      state.prompts = prompts || [];
    }, function () {
      state.prompts = [];
    });
  });

      'wys-font', 'wys-size', 'wys-bold', 'wys-italic', 'wys-underline', 'wys-strike',

      'wys-ul', 'wys-ol', 'wys-quote', 'wys-indent', 'wys-outdent',

      'history-modal', 'history-list', 'history-preview', 'history-close', 'history-restore'

      el[id] = document.getElementById(id);
    });

    /*
       最初の読み込みより前に、いちど置いておく。

       描画のたびにも置き直すが、**起動時に一度も描かない道がある**
       （保存された原稿が無いときなど）。その場合は最初に読み込まれた
       ときの指定のまま残るので、ここで先に決めておく。
    */
    applyPreviewSandbox();

    el.sidebar = document.querySelector('.sidebar');

    ['save', 'new', 'template', 'history', 'duplicate', 'gmail', 'copy', 'copy-text', 'open', 'delete',
     'copy-to', 'move-to', 'web', 'ai', 'fit-view']
      .forEach(function (name) {
        el[name] = document.getElementById('btn-' + name);
      });
  }

  function initEditor() {
    editor = CodeMirror.fromTextArea(document.getElementById('code'), {
      mode: 'htmlmixed',
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 2,
      tabSize: 2,
      autoCloseTags: true,
      matchBrackets: true,
      extraKeys: {
        'Ctrl-S': function () { save(); },
        'Cmd-S': function () { save(); },
        Tab: function (cm) { cm.replaceSelection('  '); }
      }
    });

    editor.on('change', function () {
      if (suppressEditorChange) return;
      if (state.view === 'wys') return;

      state.source = editor.getValue();
      updateButtons();

      if (state.view === 'split') {
        clearTimeout(renderTimer);
        renderTimer = setTimeout(function () { renderWys(state.source); }, 700);
      }
    });
  }

  function renderFontOptions() {
    FONT_OPTIONS.forEach(function (font) {
      var option = document.createElement('option');
      option.value = font.value;
      option.textContent = font.label;
      el['wys-font'].appendChild(option);
    });
  }

  function bindEvents() {
    el.save.addEventListener('click', save);
    el['new'].addEventListener('click', function () {
      confirmDiscard(function () { newDoc(defaultHtml()); });
    });
    el.template.addEventListener('click', openTemplates);

    el['tpl-save-open'].addEventListener('click', function () {
      if (el['tpl-save'].hidden) openTemplateSave();
      else closeTemplateSave();
    });
    el['tpl-save-apply'].addEventListener('click', saveTemplate);
    el['tpl-save-cancel'].addEventListener('click', closeTemplateSave);
    el['tpl-save-name'].addEventListener('keydown', function (event) {
      if (event.key === 'Enter') { event.preventDefault(); saveTemplate(); }
    });
    el.history.addEventListener('click', openHistory);
    el.duplicate.addEventListener('click', duplicate);
    el['copy-to'].addEventListener('click', function () { transferDoc(false); });
    el['move-to'].addEventListener('click', function () { transferDoc(true); });
    el.gmail.addEventListener('click', openGmail);

    // 保存場所
    el['loc-my'].addEventListener('click', function () { switchLocation('my'); });
    el['loc-shared'].addEventListener('click', function () { switchLocation('shared'); });

    el.web.addEventListener('click', openWebExport);
    el.ai.addEventListener('click', openAi);

    el['ai-close'].addEventListener('click', function () { hide(el['ai-modal']); });
    el['ai-copy'].addEventListener('click', copyPrompt);
    el['ai-manage'].addEventListener('click', openPrompts);
    el['ai-check'].addEventListener('click', checkAnswer);
    el['ai-replace'].addEventListener('click', function () { applyAnswer('replace'); });
    el['ai-insert'].addEventListener('click', function () { applyAnswer('insert'); });
    el['ai-question'].addEventListener('input', buildPrompt);
    el['ai-include'].addEventListener('change', buildPrompt);

    el['prompt-close'].addEventListener('click', function () { hide(el['prompt-modal']); });
    el['prompt-save'].addEventListener('click', storePrompt);
    el['prompt-reset'].addEventListener('click', function () { editPrompt(null); });
    el.copy.addEventListener('click', copyHtml);
    el['copy-text'].addEventListener('click', copyPlainText);
    el['fit-view'].addEventListener('click', function () { setFitView(!state.fitView); });
    initUiScale();

    POPS.forEach(function (entry) {
      el[entry.button].addEventListener('click', function (event) {
        event.stopPropagation();
        openPop(el[entry.pop].hidden ? entry.pop : null);
      });

      // 中の項目を押したら閉じる。押した先の処理は動かしたままにする
      el[entry.pop].addEventListener('click', function (event) {
        var hit = event.target.closest('button');
        if (!hit || hit === el[entry.button]) return;
        if (hit.closest('.parts-mode') || hit.closest('.canvas-custom')) return;   // 選び直しの途中は閉じない
        setTimeout(function () { openPop(null); }, 0);
      });
    });

    document.querySelectorAll('.scale-opt').forEach(function (button) {
      button.addEventListener('click', function () {
        setUiScale(parseFloat(button.dataset.scale));
        toggleScalePop(false);
      });
    });

    el['scale-hint-apply'].addEventListener('click', function () {
      setUiScale(0.85);

      togglePane('inspector', false);

    el['inspector-show'].addEventListener('click', function () {

    el['toolbar-hide'].addEventListener('click', function () { togglePane('toolbar', false); });

      });

    document.addEventListener('keydown', function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key === 's') {
        event.preventDefault();

      }

      /*
         Delete で選択中の要素を消す。

         プレビュー側にも同じ処理があるが、パンくずで祖先を選んだ直後は
         フォーカスがパネルのボタンにあり、あちらには届かない。

      */
      if ((event.key === 'Delete' || event.key === 'Backspace') && canDeleteByKey()) {
        event.preventDefault();
        removeSelected();
      }
      if ((event.ctrlKey || event.metaKey) && event.key === 'z' && state.view !== 'code') {
        if (!keysAreOurs()) return;
        event.preventDefault();
        undoWys();
      }
      if (event.key === 'Escape') {
        if (popOpen()) {
          openPop(null);
          return;
        }
        var modalOpen = ['confirm', 'template-modal', 'history-modal', 'gmail-modal',
          'signature-modal', 'web-modal', 'ai-modal', 'prompt-modal']
          .some(function (id) {

  /** 色見本と色コード欄を相互に追従させる */
  function linkColorInputs(picker, hex) {
    picker.addEventListener('input', function () { hex.value = picker.value; });
    hex.addEventListener('change', function () {
      var value = normalizeHex(hex.value);
      if (value) {
        picker.value = value;
        hex.value = value;
      } else {
        hex.value = picker.value;
      }
    });
  }

  // -------------------------------------------------------------------------
  // 表示の切り替え
  // -------------------------------------------------------------------------

  /**
   * ソースを丸ごと差し替える。
   *
   * ファイルを開くときは取り消し履歴を捨てるが、AIの回答での置き換えなど
   * 「元に戻せる」と案内している操作では keepUndo を立てて履歴を残す。
   */
  function setSource(html, keepUndo) {
    state.source = html;
    pushSourceToEditor(true);

    if (!keepUndo) wys.undo = [];
    if (state.view !== 'code') {
      renderWys(html);
    }
    syncSubjectField();
    updateButtons();
  }

  function pushSourceToEditor(resetHistory) {
    if (!resetHistory && editor.getValue() === state.source) return;

    var cursor = editor.getCursor();
    var scroll = editor.getScrollInfo();

    suppressEditorChange = true;
    editor.setValue(state.source);
    if (resetHistory) {
      editor.clearHistory();
    } else {
      editor.setCursor(cursor);
      editor.scrollTo(scroll.left, scroll.top);
    }
    suppressEditorChange = false;
  }

  /**
   * プレビュー / コード / 左右並びを切り替える。
   * 表示を切り替える前に、いま見えている側の内容をソースへ確定させる。
   */
  function setView(view) {
    if (state.view === view) return;

    if (state.view === 'code' || state.view === 'split') {
      state.source = editor.getValue();
    }
    if (state.view !== 'code') {
      stopEditing();
    }

    var previous = state.view;
    state.view = view;

    var showPreview = view !== 'code';
    var showCode = view !== 'wys';

    el['pane-wys'].hidden = !showPreview;
    el['pane-code'].hidden = !showCode;
    el.panes.classList.toggle('split', view === 'split');

    ['wys', 'code', 'split'].forEach(function (name) {
      el['tab-' + name].classList.toggle('active', name === view);
    });

    if (view === 'wys') {
      el['pane-wys'].style.flexBasis = '';
    }

    // コードだけを見ていた間の編集は、プレビューへ描き直して反映する
    if (showPreview && previous === 'code') {
      renderWys(state.source);
    } else if (showPreview && !wys.doc) {
      renderWys(state.source);
    }

    if (showCode) {
      pushSourceToEditor();
      refreshEditorSoon();
    }

    updateButtons();
  }

  // -------------------------------------------------------------------------
  // 表示領域の調整
  //
  // 一覧・ツールバー・要素パネルは個別に畳める。全画面はそれらをまとめて隠し、
  // プレビューだけを残す。畳んだ後も戻せるよう、必ず戻す手段を残しておく。
  // -------------------------------------------------------------------------

  /** 一覧・ツールバー・要素パネルの開閉 */
  function togglePane(name, visible) {
    state.panes[name] = visible;

    if (name === 'sidebar') {
      el.sidebar.hidden = !visible;
      el['sidebar-show'].hidden = visible;
    } else if (name === 'toolbar') {
      el['wys-toolbar'].hidden = !visible;
      el['toolbar-show'].hidden = visible;
    } else if (name === 'inspector') {
      el.inspector.hidden = !visible;

      /*
         狭い画面では、この1つのボタンで開けて閉じる。

         開くボタンと閉じる ✕ が別々の場所にあると、閉じるほうを探すことに
         なる。**出したのと同じ場所で戻せる**ほうが迷わない。
         向きの記号は data-open を見てスタイル側で返す。
      */
      if (isNarrow()) {
        el['inspector-show'].hidden = false;
        if (visible) el['inspector-show'].setAttribute('data-open', '');
        else el['inspector-show'].removeAttribute('data-open');
      } else {
        el['inspector-show'].hidden = visible;
        el['inspector-show'].removeAttribute('data-open');
      }
    }

    // 幅が変わるので、再計測とはみ出し判定をやり直す
    refreshEditorSoon();
    setTimeout(function () {
      checkOverflow();
      positionHandles();
    }, 120);
  }

  /**
   * 全画面（集中モード）。
   * ブラウザの全画面APIも試すが、埋め込まれた枠の中では拒否されることが
   * あるため、失敗しても画面内で最大化した状態にはなるようにしてある。
   */
  // -------------------------------------------------------------------------
  // 全体を見る
  //
  // プレビューは中身が縦にあふれると内側でスクロールする。全体を俯瞰したいとき
  // （画面キャプチャで1枚に収めたいときを含む）に、収まる倍率まで縮小する。
  //
  // 縮めるのは見た目だけで、HTMLには一切触れない。編集もそのままできる。
  // -------------------------------------------------------------------------

  // -------------------------------------------------------------------------
  // アプリ全体の表示サイズ
  //
  // ブラウザの縮小表示と同じことをアプリの中で行う。zoom は場所の取り方まで
  // 変わるので、単に縮むだけでなくツールバーの折り返しも解消する。
  //
  // メールの中身には触れない。変わるのはこのアプリの表示だけ。
  // 初期値は組み立て前にサーバーから流し込んであるので、ここでは覚え直すだけ。
  // -------------------------------------------------------------------------

  function initUiScale() {
    var current = parseFloat(document.documentElement.style.zoom) || 1;
    state.uiScale = current;
    document.documentElement.style.setProperty('--ui-scale', current);
    markScaleOption();

    // 縦が足りない環境にだけ、一度きりの案内を出す
    if (!window.SCALE_HINT_DONE && current === 1 && window.innerHeight < 700) {
      show(el['scale-hint']);
    }
  }

  function setUiScale(scale) {
    state.uiScale = scale;

    /*
       狭い画面では当てない。html の zoom は Safari だと**幅をそのままに
       中身だけを縮める**ので、右に余りが残って原稿が左へ寄る。

       入口（表示サイズ）は狭い画面で畳んであるが、ここでも止めておく。
       覚える処理はそのまま通す。PCに戻れば、また効く。
    */
    document.documentElement.style.zoom = (scale === 1 || isNarrow()) ? '' : scale;
    // コード欄が zoom を打ち消せるように、値をCSSへ渡す
    document.documentElement.style.setProperty('--ui-scale', scale);
    markScaleOption();

    // 幅が変わるので、折り返しと倍率を取り直す
    refreshEditorSoon();
    setTimeout(applyFitView, 60);

    call('setUiScale', scale).then(null, function () {
      setStatus('表示サイズを覚えられませんでした', 'err');
    });
  }

  function markScaleOption() {
    document.querySelectorAll('.scale-opt').forEach(function (button) {
      button.classList.toggle('active', parseFloat(button.dataset.scale) === state.uiScale);
    });
  }

  /**
   * ボタンを押すと開く小窓は3つある（表示サイズ・書き出す・この原稿の扱い）。
   * 同時に2つ開かないよう、まとめて面倒を見る。
   */
  var POPS = [
    { button: 'btn-scale', pop: 'scale-pop' },
    { button: 'btn-export', pop: 'export-pop' },
    { button: 'btn-more', pop: 'more-pop' },
    { button: 'btn-canvas', pop: 'canvas-pop' }
  ];

  /** name の小窓だけを開く。name を渡さなければ全部閉じる */
  function openPop(name) {
    POPS.forEach(function (entry) {
      var on = entry.pop === name;
      el[entry.pop].hidden = !on;
      el[entry.button].setAttribute('aria-expanded', String(on));
      el[entry.button].classList.toggle('active', on);
    });
  }

  /** いま選ばれている幅を、ボタンの上に出す */
  function showCanvasWidth(text) {
    el['canvas-now'].textContent = text;
  }

  function popOpen() {
    return POPS.some(function (entry) { return !el[entry.pop].hidden; });
  }

  function toggleScalePop(open) {
    openPop(open ? 'scale-pop' : null);
  }

  function dismissHint() {
    hide(el['scale-hint']);
    call('dismissScaleHint').then(null, function () {});
  }

  /**
   * プレビューの枠の高さを、中身の高さに合わせる。
   *
   * 枠を画面いっぱい（height:100%）にしていたため、原稿が短いと下に
   * 背景色だけの帯が延々と続き、原稿がどこで終わるのか分からなかった。
   * 中身に合わせると、下は台紙の色になり、紙の終わりが見えるようになる。
   */
  function sizePreview() {
    if (state.fitView) return;   // 縮小表示中は applyFitView が受け持つ

    var doc = el.preview.contentDocument;
    if (!doc || !doc.body) return;

    // documentElement は枠いっぱいに広がるので、body 側で測る
    var height = Math.max(doc.body.scrollHeight, 120);
    el.preview.style.height = height + 'px';
  }

  /** 中身の高さが変わったら追いかける（入力・部品の追加・削除など） */
  function watchPreviewHeight(idoc) {
    if (typeof ResizeObserver !== 'function' || !idoc.body) return;

    if (wys.sizeWatcher) wys.sizeWatcher.disconnect();
    wys.sizeWatcher = new ResizeObserver(function () {
      sizePreview();
      if (state.fitView) applyFitView();
    });
    wys.sizeWatcher.observe(idoc.body);
  }

  function setFitView(on) {
    state.fitView = on;
    el['fit-view'].classList.toggle('active', on);
    applyFitView();
  }

  /** いまの中身の高さに合わせて倍率を取り直す */
  function applyFitView() {
    var frame = el.preview;
    var style = frame.style;

    if (!state.fitView) {
      style.transform = '';
      style.transformOrigin = '';
      style.marginBottom = '';
      sizePreview();
      return;
    }

    var doc = frame.contentDocument;
    if (!doc || !doc.documentElement) return;

    // iframe は既定で高さいっぱい。中身の実寸まで伸ばしてから縮める
    style.height = 'auto';
    var full = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
    var room = frame.parentNode.clientHeight - 24;

    if (!full || room <= 0) { style.height = full ? full + 'px' : ''; return; }

    var scale = Math.min(1, room / full);

    style.height = full + 'px';
    style.transformOrigin = 'top center';
    style.transform = 'scale(' + scale + ')';

    // transform は場所を取ったままなので、縮んだぶんを打ち消して余白を残さない
    style.marginBottom = -(full * (1 - scale)) + 'px';
  }

  function setZen(on) {
    state.zen = on;
    document.body.classList.toggle('zen', on);
    el['zen-bar'].hidden = !on;
    el['btn-zen'].classList.toggle('active', on);

    // 表示できる高さが変わるので、縮小中なら倍率を取り直す
    setTimeout(applyFitView, 60);

    if (on) {
      el['zen-title'].textContent = el.title.value || '無題';
      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(function () {});
        }
      } catch (err) {
        // 全画面APIが使えなくても、画面内での最大化は効いている
      }
    } else {
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
      } catch (err) {
        // 同上
      }
    }

    refreshEditorSoon();
    setTimeout(function () {
      checkOverflow();
      positionHandles();
    }, 150);
  }

  /** ペインの表示が反映されてから CodeMirror に再計測させる */
  function refreshEditorSoon() {
    requestAnimationFrame(function () { editor.refresh(); });
  }

  /** 保存や比較に使う「今の内容」 */
  function currentSource() {
    return state.view === 'code' ? editor.getValue() : state.source;
  }

  function startResize(event) {
    event.preventDefault();
    var bounds = el.panes.getBoundingClientRect();

    var onMove = function (moveEvent) {
      var ratio = ((moveEvent.clientX - bounds.left) / bounds.width) * 100;
      el['pane-wys'].style.flexBasis = Math.min(80, Math.max(20, ratio)) + '%';
    };

    var onUp = function () {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.classList.remove('resizing');
      el.splitter.classList.remove('dragging');
      refreshEditorSoon();
    };

    document.body.classList.add('resizing');
    el.splitter.classList.add('dragging');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  // -------------------------------------------------------------------------
  // 件名（本文の <title> と同じもの）
  // -------------------------------------------------------------------------

  function syncSubjectField() {
    el.subject.value = subjectFromSource();
  }

  function subjectFromSource() {
    if (wys.doc && wys.doc.title != null) {
      return wys.doc.title;
    }
    var match = state.source.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    return match ? decodeEntities(match[1]).trim() : '';
  }

  /** 件名欄の内容を本文の <title> に書き戻す */
  function commitSubject() {
    clearTimeout(subjectTimer);
    var value = el.subject.value;

    if (wys.doc) {
      if (wys.doc.title === value) return;
      pushUndo();
      wys.doc.title = value;   // <title> が無ければ生成される
      syncFromWys();
      return;
    }

    // コードだけを見ている場合は文字列として置き換える
    var replaced = replaceTitle(state.source, value);
    if (replaced === state.source) return;

    state.source = replaced;
    pushSourceToEditor();
    updateButtons();
  }

  function replaceTitle(html, value) {
    var escaped = escapeText(value);
    if (/<title[^>]*>[\s\S]*?<\/title>/i.test(html)) {
      return html.replace(/(<title[^>]*>)[\s\S]*?(<\/title>)/i, '$1' + escaped + '$2');
    }
    if (/<\/head>/i.test(html)) {
      return html.replace(/(<\/head>)/i, '    <title>' + escaped + '</title>\n  $1');
    }
    return html;
  }

  function escapeText(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function decodeEntities(text) {
    var holder = document.createElement('textarea');
    holder.innerHTML = text;
    return holder.value;
  }

  // -------------------------------------------------------------------------
  // プレビュー: 描画と直列化
  // -------------------------------------------------------------------------

  function renderWys(html) {
    clearTimeout(renderTimer);
    wys.selected = null;
    wys.editing = null;
    wys.pendingInput = false;
    applyPreviewSandbox();
    el.preview.srcdoc = calmForPreview(html);
  }

  /*
     プレビューの枠でスクリプトを許すかどうかを、**描画のたびに決める**。

     起動時に1度だけ決めていたら、判定が間に合わなかった回は、その後
     ずっと誤ったままになった（手元の計測で4回中2回外した）。
     sandbox は枠が読み込む時点で効くので、srcdoc を入れる直前に
     置き直せば、そのつど正しい側に寄る。

     指が主な入力手段の端末だけ緩める。マウスのある機械は強いまま。
  */
  function applyPreviewSandbox() {
    if (!el.preview) return;
    var want = wantsTouchPreview()
      ? 'allow-same-origin allow-scripts'
      : 'allow-same-origin';
    if (el.preview.getAttribute('sandbox') !== want) {
      el.preview.setAttribute('sandbox', want);
    }
  }

  function onWysLoad() {
    var idoc = el.preview.contentDocument;
    if (!idoc) {
      renderInspector();
      return;
    }

    wys.doc = idoc;
    wys.selected = null;
    wys.editing = null;

    injectEditingStyle(idoc);
    watchPreviewHeight(idoc);
    ensureHandles(idoc);
    bindWysEvents(idoc);
    syncSubjectField();
    renderBodyWidth();
    checkOverflow();
    renderInspector();
    sizePreview();
    applyFitView();
    updateWysButtons();
  }

  function injectEditingStyle(idoc) {
    if (!idoc.head) return;
    var style = idoc.createElement('style');
    style.setAttribute('data-wys-injected', '');
    style.textContent = [
      '[data-wys-hot]{outline:1px dashed rgba(26,115,232,.6) !important; outline-offset:-1px; cursor:pointer;}',
      '[data-wys-hot="backdrop"]{outline-color:rgba(124,92,191,.75) !important;}',
      '[data-wys-hot="section"]{outline-color:rgba(26,115,232,.75) !important;}',
      '[data-wys-hot="panel"]{outline-color:rgba(15,138,106,.75) !important;}',
      '[data-wys-hot="part"]{outline-color:rgba(194,97,12,.75) !important;}',

      '[data-wys-sel]{outline:2px solid #1a73e8 !important; outline-offset:-2px;}',

      /* 名前の付いた単位。色と名前を一対一にする */
      '[data-wys-lv="backdrop"]{outline:2px solid #7c5cbf !important; outline-offset:-2px;}',
      '[data-wys-lv="section"]{outline:2px solid #1a73e8 !important; outline-offset:-2px;}',
      '[data-wys-lv="panel"]{outline:2px solid #0f8a6a !important; outline-offset:-2px;}',
      '[data-wys-lv="part"]{outline:2px solid #c2610c !important; outline-offset:-2px;}',

      /*
         選んだものの名札。ボタンと同じ帯に並べたいので、擬似要素ではなく
         位置を計算して置く箱にしている。要素の左上に固定していたときは、
         上へ逃がしたゴミ箱・複製・つまみと重なっていた。
      */
      '.wys-name{position:absolute; display:none; align-items:center; gap:5px;',
      '  height:20px; padding:0 7px; border-radius:3px; color:#fff;',
      '  font:700 9px/1 sans-serif; letter-spacing:.04em; white-space:nowrap;',
      '  z-index:2147483644; pointer-events:none;}',
      '.wys-name.on{display:inline-flex;}',
      '.wys-name .tip{font-weight:500; opacity:.85;}',
      '[contenteditable="true"]{outline:2px solid #1e8e3e !important; outline-offset:-2px; cursor:text;}',
      '[data-wys-move]{outline:2px dashed #1a73e8 !important; outline-offset:-2px;}',
      '[data-wys-doom]{outline:2px solid #b3261e !important; outline-offset:-2px;',
      '  background-color:rgba(179,38,30,.10) !important;}',
      '.wys-trap{position:fixed; top:0; left:0; width:1px; height:1px;',
      '  opacity:0; overflow:hidden; z-index:-1; white-space:pre;}',
      '.wys-twin{position:absolute; width:20px; height:20px; border-radius:5px;',
      '  background:#fff; color:#3c4149; display:none; align-items:center;',
      '  justify-content:center; cursor:pointer; z-index:2147483646;',
      '  box-shadow:0 1px 3px rgba(0,0,0,.28); user-select:none;}',
      '.wys-twin.on{display:flex;}',
      '.wys-twin:hover{background:#1a73e8; color:#fff;}',
      '.wys-kill{position:absolute; width:20px; height:20px; border-radius:5px;',
      '  background:#fff; color:#b3261e; display:none; align-items:center;',
      '  justify-content:center; cursor:pointer; z-index:2147483646;',
      '  box-shadow:0 1px 3px rgba(0,0,0,.28); user-select:none;}',
      '.wys-kill.on{display:flex;}',
      '.wys-kill:hover{background:#b3261e; color:#fff;}',
      '.wys-grip{position:absolute; width:16px; height:26px; border-radius:5px;',
      '  background:#1a73e8; color:#fff; display:none; align-items:center;',
      '  justify-content:center; cursor:grab; font:11px sans-serif; letter-spacing:-1px;',
      '  z-index:2147483646; box-shadow:0 1px 3px rgba(0,0,0,.35); user-select:none;}',
      '.wys-grip.on{display:flex;}',
      '.wys-drop{position:absolute; height:3px; border-radius:2px; background:#1a73e8;',
      '  display:none; z-index:2147483645; pointer-events:none;}',
      '.wys-drop.on{display:block;}',
      '.wys-lift{opacity:.45 !important;}',
      '.wys-handle{position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px;',
      '  background:#1a73e8; border:2px solid #fff; border-radius:50%;',
      '  box-shadow:0 1px 3px rgba(0,0,0,.4); cursor:nwse-resize; z-index:2147483647;}',
      '.wys-size{position:absolute; padding:2px 6px; margin-top:6px; border-radius:4px;',
      '  background:#1f2328; color:#fff; font:12px sans-serif; white-space:nowrap;',

    ].join('\n');
    idoc.head.appendChild(style);
  }

  // --- 画像のドラッグリサイズ -----------------------------------------------

  /** ハンドルと寸法表示を用意する（保存時は data-wys-injected ごと取り除かれる） */
  function ensureHandles(idoc) {
    if (wys.handle && wys.handle.ownerDocument === idoc) return;

    var handle = idoc.createElement('div');
    handle.className = 'wys-handle';
    handle.setAttribute('data-wys-injected', '');
    handle.style.display = 'none';

    var badge = idoc.createElement('div');
    badge.className = 'wys-size';
    badge.setAttribute('data-wys-injected', '');
    badge.style.display = 'none';

    // 何がどう消えるかを伝える帯。見出し行には文章を置く幅がないので、
    // 説明はキャンバス側のここに持たせる。
    /*
       上下に動かすためのつまみ。要素そのものを掴ませると、文字の選択と
       ぶつかる（段落やボタンは選ぶと文字が打てる状態になるため）。
       要素の外に出しておけば、その衝突が起きない。
    */
    var grip = idoc.createElement('div');
    grip.className = 'wys-grip';
    grip.setAttribute('data-wys-injected', '');
    grip.setAttribute('title', '掴んで上下に動かす');
    grip.textContent = '\u22ee\u22ee';

    var drop = idoc.createElement('div');
    drop.className = 'wys-drop';
    drop.setAttribute('data-wys-injected', '');

    /*
       キャンバス上の削除ボタン。つまみの左に、少し離して置く。

       文字だけの箱はクリックすると編集モードに入るため、Esc を知らないと
       要素として掴めなかった。ここに出しておけば、編集中でも1押しで消せる。
       つまみと近すぎると押し間違えるので、間に隙間を取っている。
    */
    /*
       複製。削除とつまみの間に置く。押し間違えたときに、いちばん影響が
       小さいものを真ん中にしている。
    */
    /*
       コピーと貼り付けの受け皿。

       文字を編集していないとき、ブラウザは copy / paste を発火しない。
       フォーカスが編集できる場所に無いため。要素を選んだ状態でも
       Ctrl+C / Ctrl+V を効かせたいので、見えない編集可能な箱に
       フォーカスを預けておく。

       中にゼロ幅文字を1つ入れて選択しておく。空のままだと、
       選択が無いとみなされて copy が飛ばないことがある。
    */
    var trap = idoc.createElement('div');
    trap.className = 'wys-trap';
    trap.setAttribute('data-wys-injected', '');
    trap.setAttribute('contenteditable', 'true');
    trap.setAttribute('aria-hidden', 'true');

    var twin = idoc.createElement('div');
    twin.className = 'wys-twin';
    twin.setAttribute('data-wys-injected', '');
    twin.setAttribute('title', 'この要素を複製（Ctrl + D）');
    twin.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"'
      + ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round"'
      + ' stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/>'
      + '<path d="M10.5 3.5h-7a1 1 0 0 0-1 1v7"/></svg>';

    var name = idoc.createElement('div');
    name.className = 'wys-name';
    name.setAttribute('data-wys-injected', '');
    name.setAttribute('aria-hidden', 'true');

    var kill = idoc.createElement('div');
    kill.className = 'wys-kill';
    kill.setAttribute('data-wys-injected', '');
    kill.setAttribute('title', 'この要素を削除');
    kill.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"'
      + ' stroke="currentColor" stroke-width="1.6" stroke-linecap="round"'
      + ' stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.8 4.5l.5 8.6h5.4l.5-8.6"/></svg>';

    /*
       選んだ要素のそばに、要素パネルへの入口を3つ置く。

       狭い画面では、パネルは呼ばないと出てこない。**選んだその場から、
       直したいまとまりへ直に入れる**ほうが手数が少ない。
       ごみ箱・複製・つまみと同じ並びに続ける。

       押すと、そのまとまりを開いた状態でパネルが出る。
    */
    var TAB_ICONS = {
      text: '<path d="M3.5 4V3h9v1M8 3v10M6 13h4"/>',
      surface: '<rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M2.5 7.5h11"/>',
      layout: '<path d="M2.5 5.5v-3h3M13.5 5.5v-3h-3M2.5 10.5v3h3M13.5 10.5v3h-3"/>'
    };

    wys.tabs = PANEL_GROUPS.map(function (def) {
      var tab = idoc.createElement('div');
      tab.className = 'wys-twin wys-tab';
      tab.setAttribute('data-wys-injected', '');
      tab.setAttribute('title', '要素：' + def.label);
      tab.innerHTML = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none"'
        + ' stroke="currentColor" stroke-width="1.5" stroke-linecap="round"'
        + ' stroke-linejoin="round">' + TAB_ICONS[def.key] + '</svg>';

      tab.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        openInspectorAt(def.key);
      });

      idoc.body.appendChild(tab);
      return tab;
    });

    idoc.body.appendChild(handle);
    idoc.body.appendChild(badge);
    idoc.body.appendChild(grip);
    idoc.body.appendChild(drop);
    idoc.body.appendChild(kill);
    idoc.body.appendChild(name);
    idoc.body.appendChild(twin);
    idoc.body.appendChild(trap);

    handle.addEventListener('mousedown', startImageResize);
    grip.addEventListener('mousedown', startElementDrag);

    // 押す前に、消える範囲を見せる
    kill.addEventListener('mouseenter', function () { markDoomed(true); });
    kill.addEventListener('mouseleave', function () { markDoomed(false); });
    grip.addEventListener('mouseenter', function () { markMoving(true); });
    grip.addEventListener('mouseleave', function () { markMoving(false); });
    kill.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      removeSelected();
    });

    twin.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      duplicateSelected();
    });

    wys.handle = handle;
    wys.badge = badge;
    wys.grip = grip;
    wys.drop = drop;
    wys.kill = kill;
    wys.name = name;
    wys.twin = twin;
    wys.trap = trap;
  }

  /**
   * 受け皿にフォーカスを預ける。
   *
   * 文字を編集しているときは、その要素にフォーカスがあるべきなので何もしない。
   */
  function focusTrap() {
    if (!wys.trap || wys.editing || !wys.selected) return;

    wys.trap.textContent = '\u200b';

    var range = wys.doc.createRange();
    range.selectNodeContents(wys.trap);

    var picked = wys.doc.defaultView.getSelection();
    picked.removeAllRanges();
    picked.addRange(range);

    wys.trap.focus({ preventScroll: true });
  }

  function positionHandles() {
    positionImageHandle();
    positionActions();
  }

  /** 選択中が画像ならハンドルを右下に置く。そうでなければ隠す */
  function positionImageHandle() {
    if (!wys.handle) return;

    var target = wys.selected;
    if (!target || target.tagName !== 'IMG') {
      wys.handle.style.display = 'none';
      wys.badge.style.display = 'none';
      return;
    }

    var rect = target.getBoundingClientRect();
    var win = wys.doc.defaultView;
    var left = rect.right + win.scrollX;
    var top = rect.bottom + win.scrollY;

    wys.handle.style.display = 'block';
    wys.handle.style.left = left + 'px';
    wys.handle.style.top = top + 'px';

    wys.badge.style.display = 'block';
    wys.badge.style.left = (rect.left + win.scrollX) + 'px';
    wys.badge.style.top = top + 'px';
    wys.badge.textContent = Math.round(rect.width) + ' × ' + Math.round(rect.height) + ' px';
  }

  /**
   * 削除ボタンとつまみを、選択中の要素の左外に置く。
   *
   *   [ゴミ箱]  すき間  [つまみ]  要素
   *
   * 押し間違えると片方は取り返しがつかないので、間を空けている。
   * 削除は選んでいれば常に出す。移動は動かせる相手がいるときだけ。
   */
  function positionActions() {
    if (!wys.grip || !wys.kill) return;

    var elem = wys.selected;

    if (!elem) {
      wys.grip.classList.remove('on');
      wys.kill.classList.remove('on');
      wys.twin.classList.remove('on');
      if (wys.name) wys.name.classList.remove('on');
      if (wys.tabs) wys.tabs.forEach(function (t) { t.classList.remove('on'); });
      return;
    }

    var win = wys.doc.defaultView;

    /*
       削除は選んだ要素そのものに効く。移動は「動かせる祖先」に効くので、
       つまみはそちらの位置に出す。見出しの白いカードのように、内側には
       兄弟がいないのに外側には並びがある、という作りが多いため。
    */
    var target = movableTarget(elem);
    var rect = elem.getBoundingClientRect();

    /*
       ふだんは要素の左外に縦に並べる。

       左に48pxの余地が無いときは、要素の上へ逃がす。そのまま左に置くと
       本文の文字に重なってしまう（本文カードの内側は余白が小さい）。
       上にも余地が無ければ、下に出す。
    */
    var left = rect.left + win.scrollX - 74;
    var top = rect.top + win.scrollY;
    var beside = left >= 2;

    if (beside) top += Math.min(4, Math.max(0, (rect.height - 26) / 2));

    if (!beside) {
      left = Math.max(2, rect.left + win.scrollX);
      top = rect.top + win.scrollY - 24;

      // 画面の上端に張り付いているときは下へ
      if (rect.top < 26) top = rect.bottom + win.scrollY + 4;
    }

    wys.kill.classList.add('on');
    wys.kill.style.left = left + 'px';
    wys.kill.style.top = (beside ? top + 2 : top) + 'px';

    wys.twin.classList.add('on');
    wys.twin.style.left = (left + 26) + 'px';
    wys.twin.style.top = (beside ? top + 2 : top) + 'px';

    /*
       要素パネルへの入口。ごみ箱・複製の右に続ける。

       狭い画面のときだけ出す。PCではパネルが常に右側に出ているので、
       同じ入口を二重に置く意味がない。
    */
    if (wys.tabs) {
      wys.tabs.forEach(function (tab, i) {
        if (!isNarrow()) { tab.classList.remove('on'); return; }
        tab.classList.add('on');
        tab.style.left = (left + 78 + i * 26) + 'px';   // つまみ(+52)の右へ続ける
        tab.style.top = (beside ? top + 2 : top) + 'px';
      });
    }

    placeName(elem, rect, win, left, top, beside);

    if (!target) {
      wys.grip.classList.remove('on');
      return;
    }

    // 外側を動かすときは、その外側の位置に出す。何が動くのかを場所で示す
    var box = target === elem ? rect : target.getBoundingClientRect();
    var gripLeft = target === elem
      ? left + 52
      : Math.max(2, box.left + win.scrollX - 20);
    var gripTop = target === elem
      ? (beside ? top : top - 3)
      : box.top + win.scrollY + Math.min(4, Math.max(0, (box.height - 26) / 2));

    wys.grip.classList.add('on');
    wys.grip.style.left = gripLeft + 'px';
    wys.grip.style.top = gripTop + 'px';
    wys.grip.title = target === elem
      ? '掴んで上下に動かす'
      : elementLabel(target) + 'ごと上下に動かす';
  }

  /*
     名札に添える一言。

     「もう一度クリックすると…」はもともと要素パネルに置いていたが、
     説明のためだけに1行を使うことになり、狭い画面では効いた。
     それに、プレビューを見ている人の視界にパネルの下部は入っていない。
     いま見ている場所に、そこでできることを書く。
  */
  /*
     階層の鍵。内部ではこの4語だけを使う。

     画面に出す文字は LEVEL_NAMES にまとめてある。ここを日本語のままに
     しておくと、訳した瞬間に CSS の選択子と合わなくなり、枠線が黙って
     出なくなる。表示と識別子は分けておく。
  */
  var LEVEL_COLORS = {
    backdrop: '#7c5cbf', section: '#1a73e8', panel: '#0f8a6a', part: '#c2610c'
  };

  /** 画面に出す階層の名前。訳すのはここだけ */
  var LEVEL_NAMES = {
    backdrop: '背景', section: '段', panel: '枠', part: '部品'
  };

  function levelName(lv) { return LEVEL_NAMES[lv] || ''; }

  function nameTip(elem) {
    if (wys.editing === elem) return 'Esc で選び直す';
    if (isTextLeaf(elem)) return 'もう1度クリックで編集';
    return '';
  }

  /** 名札の中身を組んで、幅を返す */
  function fillName(elem) {
    var editing = wys.editing === elem;
    var lv = levelOf(elem);

    wys.name.textContent = '';
    wys.name.style.background = editing ? '#1e8e3e' : (LEVEL_COLORS[lv] || '#5f6672');

    var head = wys.doc.createElement('span');
    head.textContent = editing ? '編集中' : (levelName(lv) || elementLabel(elem));
    wys.name.appendChild(head);

    var tip = nameTip(elem);

    if (tip) {
      var note = wys.doc.createElement('span');
      note.className = 'tip';
      note.textContent = String.fromCharCode(8212) + ' ' + tip;
      wys.name.appendChild(note);
    }

    wys.name.classList.add('on');
    return wys.name.offsetWidth;
  }

  /**
   * 名札を置く。ボタンと重ならない側に出す。
   *
   * ボタンが左の余白に並んでいるときは、要素の左上に。
   * ボタンが上へ逃げているときは、その帯の右隣に並べる。
   */
  function placeName(elem, rect, win, left, top, beside) {
    if (!wys.name) return;

    var width = fillName(elem);

    /*
       ボタンの並びの右隣から始める。

       狭い画面では、要素パネルへの入口を3つ足してある（+78 から 26px刻み）。
       そのぶん送らないと、**名札がアイコンの上に乗る。**
    */
    var after = (isNarrow() && wys.tabs) ? 80 + 3 * 26 : 80;

    var at = beside
      ? { left: rect.left + win.scrollX, top: rect.top + win.scrollY - 22 }
      : { left: left + after, top: top };

    // 画面からはみ出すときは、内側へ寄せる
    var limit = win.innerWidth + win.scrollX - width - 4;
    if (at.left > limit) at.left = Math.max(2, limit);
    if (at.top < win.scrollY) at.top = rect.bottom + win.scrollY + 4;

    wys.name.style.left = at.left + 'px';
    wys.name.style.top = at.top + 'px';
  }

  /** つまみに触れている間、動く相手を点線で示す */
  function markMoving(on) {
    clearAttr('data-wys-move');
    if (!on || !wys.selected) return;

    var target = movableTarget(wys.selected);
    if (target) target.setAttribute('data-wys-move', '');
  }

  function startImageResize(event) {
    var image = wys.selected;
    if (!image || image.tagName !== 'IMG') return;

    event.preventDefault();
    event.stopPropagation();

    var idoc = wys.doc;
    var startX = event.clientX;
    var startWidth = image.getBoundingClientRect().width;
    var ratio = image.naturalWidth ? image.naturalHeight / image.naturalWidth : 0;

    pushUndo();

    var onMove = function (moveEvent) {
      var width = Math.max(20, Math.round(startWidth + (moveEvent.clientX - startX)));
      applyImageSize(image, width, 0);
      wys.badge.textContent = width + ' × ' + (ratio ? Math.round(width * ratio) : '—') + ' px';
      positionHandles();
    };

    var onUp = function () {
      idoc.removeEventListener('mousemove', onMove);
      idoc.removeEventListener('mouseup', onUp);
      syncFromWys();
      renderInspector();
      positionHandles();
    };

    idoc.addEventListener('mousemove', onMove);
    idoc.addEventListener('mouseup', onUp);
  }

  function bindWysEvents(idoc) {
    idoc.addEventListener('mouseover', function (event) {
      clearAttr('data-wys-hot');

      var target = event.target;
      if (!target || target.nodeType !== 1 || target === idoc.body) return;
      if (target.closest && target.closest('[data-wys-injected]')) return;

      /*
         カーソルを乗せた場所が「何なのか」を、名前で示す。
         選べる単位に合わせて印を出すので、押す前に対象が分かる。
      */
      var unit = unitOf(target);
      if (unit && unit.el !== wys.selected) {
        unit.el.setAttribute('data-wys-hot', unit.lv);
      } else if (!unit) {
        target.setAttribute('data-wys-hot', '');
      }
    });

    idoc.addEventListener('mouseout', function () { clearAttr('data-wys-hot'); });

    if (idoc.defaultView) {
      idoc.defaultView.addEventListener('scroll', positionHandles);
      idoc.defaultView.addEventListener('resize', positionHandles);
    }

    idoc.addEventListener('dblclick', function (event) {
      if (event.target.closest && event.target.closest('[data-wys-injected]')) return;

      var unit = unitOf(event.target);
      var pick = unit ? unit.el : event.target;

      if (!isTextLeaf(pick)) return;

      event.preventDefault();
      if (wys.selected !== pick) selectElement(pick);
      startEditing(pick);
      renderInspector();
    }, true);

    // ドラッグかどうかを見分けるために、押した位置を控える
    idoc.addEventListener('mousedown', function (event) {
      wys.pressedAt = { x: event.clientX, y: event.clientY };
    }, true);

    idoc.addEventListener('click', function (event) {
      // 編集用に注入した要素（リサイズのつまみなど）は選択対象にしない
      if (event.target.closest && event.target.closest('[data-wys-injected]')) return;
      if (wys.editing && wys.editing.contains(event.target)) return;

      /*
         文字をドラッグで選んだときの終点でも click は飛ぶ。
         そこで選択を移すと編集が終わり、次の Delete が「選ばれた要素を
         丸ごと消す」動きになる。本文のセルごと消える事故がこれだった。
      */
      if (isDragEnd(event)) return;

      event.preventDefault();
      event.stopPropagation();

      /*
         1回目のクリックで選び、2回目で文字を編集する。

         以前は1回目でいきなり編集モードに入っていた。文字を打つには速いが、
         要素として掴む道が塞がり、Esc を知らないと削除も移動もできなかった。
         PowerPoint や他のメール作成ツールと同じ形にそろえる。
      */
      var unit = unitOf(event.target);
      var pick = unit ? unit.el : event.target;

      if (wys.selected === pick && isTextLeaf(pick)) {
        startEditing(pick);
        renderInspector();
        return;
      }

      selectElement(pick);
    }, true);

    /*
       コピーと貼り付け。

       文字を打てる状態のときは、ブラウザの動きに任せる（文字のコピー）。
       要素として持ち出したいときは Esc で編集を抜けてもらう。削除と同じ考え方。
    */
    idoc.addEventListener('copy', function (event) {
      if (wys.editing) return;
      copySelected(event, false);
    });

    idoc.addEventListener('cut', function (event) {
      if (wys.editing) return;
      copySelected(event, true);
    });

    idoc.addEventListener('paste', function (event) {
      var data = event.clipboardData;
      if (!data) return;

      var html = data.getData('text/html') || '';
      var text = data.getData('text/plain') || '';
      if (!html && !text) return;

      event.preventDefault();

      // 外部のページからも来る。中身は必ず消毒してから入れる
      var holder = cleanPasted(html || escapeText(text));

      if (wys.editing) {
        // 文字を打っている最中は、カーソルの位置に流し込む
        idoc.execCommand('insertHTML', false, holder.innerHTML);
        return;
      }

      pasteInto(holder);
    });

    idoc.addEventListener('input', function () {
      // 受け皿へ紛れ込んだ入力は、本文ではないので捨てる
      if (wys.trap && wys.trap.contains(idoc.activeElement)) {
        wys.trap.textContent = '\u200b';
        return;
      }

      // ひと続きの入力につき1つだけ積む。1文字ごとに積むと戻すのが大変になる
      if (!wys.pendingInput) pushUndo();
      wys.pendingInput = true;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncFromWys, SYNC_DELAY_MS);
    });

    idoc.addEventListener('keydown', function (event) {
      // メールでは <div> より <br> のほうが安全なので、改行を差し替える
      if (event.key === 'Enter' && !event.shiftKey && wys.editing) {
        event.preventDefault();
        idoc.execCommand('insertLineBreak');
        return;
      }
      if ((event.ctrlKey || event.metaKey) && event.key === 's') {
        event.preventDefault();
        save();
      }
      // 編集中でも効かせる。ブラウザ任せにすると、構造を変えたぶんが戻せない
      if ((event.ctrlKey || event.metaKey) && event.key === 'z') {
        event.preventDefault();
        undoWys();
        return;
      }

      /*
         Esc で編集をやめ、その要素を「選んでいる」状態に戻す。

         文字だけの箱はクリックすると必ず編集モードに入る（isTextLeaf）。
         抜ける手段が無いと、キーボードからは要素として掴めない。
         段落を丸ごと消したいのに Delete が文字にしか効かない、という詰まり方をする。
      */
      if (event.key === 'Escape' && wys.editing) {
        event.preventDefault();
        stopEditing();
        renderInspector();   // 編集中だけ出る案内を消すため、組み直す
        updateWysButtons();
        positionHandles();
        focusTrap();
        setStatus('要素を選んだ状態にしました。Delete で削除、↑↓ で移動できます', 'ok');
        return;
      }

      /*
         文字を打てる状態のときは何もしない。編集中の Delete は文字を消すためのもので、
         ここで要素を消すと「本文を消そうとしたら枠ごと消えた」という事故になる。
      */
      if ((event.ctrlKey || event.metaKey) && event.key === 'd') {
        if (wys.editing || !wys.selected) return;
        event.preventDefault();
        duplicateSelected();
        return;
      }

      if (event.key === 'Delete' || event.key === 'Backspace') {
        if (!canDeleteByKey()) return;
        event.preventDefault();
        removeSelected();
      }
    });
  }

  /**
   * その click が、文字を選ぶドラッグの終わりかどうか。
   *
   * 押した位置から動いていれば、選択の操作とみなす。
   *
   * 「文字が選ばれているか」では見分けられない。すでに選ばれている文字の上を
   * クリックしたとき、ブラウザは mouseup まで選択を解かないことがあり、
   * ふつうのクリックまで無視してしまう。
   */
  function isDragEnd(event) {
    var from = wys.pressedAt;
    wys.pressedAt = null;

    if (!from) return false;

    var moved = Math.abs(event.clientX - from.x) + Math.abs(event.clientY - from.y);
    return moved > 4;
  }

  function serializeWys() {
    var idoc = wys.doc;
    if (!idoc || !idoc.documentElement) return state.source;

    var clone = idoc.documentElement.cloneNode(true);

    clone.querySelectorAll('[data-wys-injected]').forEach(function (node) {
      node.parentNode.removeChild(node);
    });

    // 眠らせたスクリプトと on* を、元の姿へ戻してから本文にする
    wakeAfterPreview(clone);
    EDIT_ATTRS.forEach(function (attr) {
      clone.querySelectorAll('[' + attr + ']').forEach(function (node) {
        node.removeAttribute(attr);
      });
    });

    var doctype = idoc.doctype ? '<!DOCTYPE ' + idoc.doctype.name + '>\n' : '';
    return doctype + clone.outerHTML + '\n';
  }

  function syncFromWys() {
    clearTimeout(syncTimer);
    if (!wys.doc) return;

    state.source = serializeWys();
    wys.pendingInput = false;

    if (state.view === 'split') {
      pushSourceToEditor();
    }
    updateButtons();
    checkOverflow();
  }

  function pushUndo() {
    wys.undo.push(state.source);
    if (wys.undo.length > MAX_UNDO) wys.undo.shift();
  }

  function undoWys() {
    if (!wys.undo.length) {
      setStatus('元に戻せる操作はありません');
      return;
    }
    var previous = wys.undo.pop();
    state.source = previous;
    renderWys(previous);
    if (state.view === 'split') pushSourceToEditor();
    updateButtons();
    setStatus('元に戻しました', 'ok');
  }

  function clearAttr(attr) {
    if (!wys.doc) return;
    wys.doc.querySelectorAll('[' + attr + ']').forEach(function (node) {
      node.removeAttribute(attr);
    });
  }

  // -------------------------------------------------------------------------
  // プレビュー: 選択とその場編集
  // -------------------------------------------------------------------------

  function selectElement(elem) {
    if (!elem || elem.nodeType !== 1) return;
    if (elem === wys.doc.documentElement || elem === wys.doc.body) return;

    stopEditing();
    clearAttr('data-wys-sel');

    // 別の要素へ移ったら、前の削除予告は消す。
    // カーソルがボタンから離れないまま選択が変わることがある。
    clearAttr('data-wys-doom');
    clearAttr('data-wys-move');

    // 別の要素に移ったら、枠線の辺の選択は「すべて」に戻す
    if (wys.selected !== elem) wys.borderSide = 'all';

    elem.setAttribute('data-wys-sel', '');
    wys.selected = elem;

    // 選んだだけでは文字編集に入らない。2回目のクリックで入る
    clearAttr('data-wys-lv');
    var lv = levelOf(elem);
    if (lv) elem.setAttribute('data-wys-lv', lv);

    renderInspector();
    updateWysButtons();
    positionHandles();
    focusTrap();
  }

  function isTextLeaf(elem) {
    if (elem.tagName === 'IMG') return false;

    var hasText = false;

    for (var i = 0; i < elem.childNodes.length; i++) {
      var node = elem.childNodes[i];

      if (node.nodeType === 3) {
        if (node.nodeValue.trim()) hasText = true;
      } else if (node.nodeType === 1) {
        if (!INLINE_TAGS[node.tagName]) return false;

        /*
           飾りの中にしか文字が無い書き方も数える。

           <p><strong>宛名 様</strong></p> のように、段落の直下には改行と
           空白しか無い、という原稿は多い。直下の文字だけを見ていたので、
           こういう段落が「文字を打てないもの」に分類されていた。
        */
        if ((node.textContent || '').trim()) hasText = true;
      }
    }

    return hasText;
  }

  function startEditing(elem) {
    wys.editing = elem;
    elem.setAttribute('contenteditable', 'true');
    elem.focus();
    positionActions();   // 名札を「編集中」に組み直す
  }

  function stopEditing() {
    if (!wys.editing) return;
    wys.editing.removeAttribute('contenteditable');
    wys.editing = null;
    syncFromWys();
  }

  // -------------------------------------------------------------------------
  // 文字の装飾
  // -------------------------------------------------------------------------

  function selectionRange() {
    if (!wys.doc) return null;
    var selection = el.preview.contentWindow.getSelection();
    if (!selection || !selection.rangeCount || selection.isCollapsed) return null;
    return { selection: selection, range: selection.getRangeAt(0) };
  }

  /** 選択した文字列を span で包んでインラインstyleを付ける */
// -------------------------------------------------------------------------
  // 文字にリンクを付ける
  // -------------------------------------------------------------------------

  /*
     選んだ文字を <a> で包む。

     surroundContents は、選択が要素の境界をまたぐと落ちる。装飾を当てる
     ときと同じ理屈なので、同じ逃がし方をする（中身を取り出して包み直す）。

     target と rel は付けない。メールのHTMLでは意味を持たず、受け取った側の
     ソフトが自分で決める。付けると、その属性を落とすソフトと落とさない
     ソフトで見た目が割れる。
  */
  function applyLinkToSelection(url) {
    var picked = selectionRange();
    if (!picked) {
      setStatus('リンクにしたい文字を選択してください', 'err');
      return false;
    }

    pushUndo();

    var link = wys.doc.createElement('a');
    link.setAttribute('href', url);

    try {
      picked.range.surroundContents(link);
    } catch (err) {
      link.appendChild(picked.range.extractContents());
      picked.range.insertNode(link);
    }

    picked.selection.removeAllRanges();
    syncFromWys();
    setStatus('リンクにしました', 'ok');
    return true;
  }

  /*
     リンクを外す。文字は残す。

     選んだ範囲の中にある <a> を、中身で置き換える。範囲の外まで届いている
     リンクも対象にする（一部だけ選んで外そうとしたとき、半端に切れた
     リンクが残るほうが分かりにくい）。
  */
  function removeLinkFromSelection() {
    var picked = selectionRange();
    if (!picked) {
      setStatus('リンクを外したい文字を選択してください', 'err');
      return;
    }

    var links = [];
    var node = picked.range.commonAncestorContainer;
    var host = node.nodeType === 1 ? node : node.parentElement;
    if (!host) return;

    var top = host.closest ? host.closest('a') : null;
    if (top) {
      links.push(top);
    } else {
      Array.prototype.slice.call(host.getElementsByTagName('a')).forEach(function (a) {
        if (picked.range.intersectsNode && picked.range.intersectsNode(a)) links.push(a);
      });
    }

    if (!links.length) {
      setStatus('選んだ範囲にリンクはありません', 'err');
      return;
    }

    pushUndo();

    links.forEach(function (a) {
      var parent = a.parentNode;
      while (a.firstChild) parent.insertBefore(a.firstChild, a);
      parent.removeChild(a);
    });

    picked.selection.removeAllRanges();
    syncFromWys();
    setStatus('リンクを外しました', 'ok');
  }

  /*
     リンクの入力欄を出し入れする。

     ふだんは絵のボタンだけを出しておく。押したときに欄を開く。
     道具の帯は横に長いので、使わないものを常に置いておくと、
     ほかの操作が押し出される。
  */
  function toggleLinkBar(open) {
    var url = el['wys-link-url'];
    var apply = el['wys-link-apply'];
    var off = el['wys-link-off'];
    if (!url || !apply || !off) return;

    url.hidden = !open;
    apply.hidden = !open;
    off.hidden = !open;

    if (open) {
      // いま選んでいるところが既にリンクなら、その行き先を初期値にする
      var picked = selectionRange();
      var found = '';
      if (picked) {
        var node = picked.range.commonAncestorContainer;
        var host = node.nodeType === 1 ? node : node.parentElement;
        var a = host && host.closest ? host.closest('a') : null;
        if (a) found = a.getAttribute('href') || '';
      }
      url.value = found;
      url.focus();
    }
  }

  /*
     打たれたURLを整える。

     「example.com」のように書かれることが多い。そのまま href に入れると
     相対パスと解釈され、メールでは開けない。前置きが無ければ https を補う。
     mailto: と tel: はそのまま通す。
  */
  function tidyLinkUrl(value) {
    var url = String(value || '').trim();
    if (!url) return '';
    if (/^(https?:|mailto:|tel:)/i.test(url)) return url;
    if (/^#/.test(url)) return url;
    return 'https://' + url;
  }

  function applyStyleToSelection(styleText) {
    var picked = selectionRange();
    if (!picked) {
      setStatus('装飾したい文字を選択してください', 'err');
      return;
    }

    pushUndo();

    var span = wys.doc.createElement('span');
    span.setAttribute('style', styleText);

    try {
      picked.range.surroundContents(span);
    } catch (err) {
      // 範囲が要素の境界をまたぐ場合は、中身を取り出して包み直す
      span.appendChild(picked.range.extractContents());
      picked.range.insertNode(span);
    }

    picked.selection.removeAllRanges();
    syncFromWys();
  }

  /** 選択範囲の装飾タグとstyleを取り除く */
  function clearFormatting() {
    var picked = selectionRange();
    if (!picked) {
      setStatus('装飾を外したい文字を選択してください', 'err');
      return;
    }

    pushUndo();

    var holder = wys.doc.createElement('div');
    holder.appendChild(picked.range.extractContents());

    holder.querySelectorAll('span, font, b, strong, i, em, u, s, strike').forEach(function (node) {
      while (node.firstChild) node.parentNode.insertBefore(node.firstChild, node);
      node.parentNode.removeChild(node);
    });
    holder.querySelectorAll('[style]').forEach(function (node) {
      node.removeAttribute('style');
    });

    var fragment = wys.doc.createDocumentFragment();
    while (holder.firstChild) fragment.appendChild(holder.firstChild);
    picked.range.insertNode(fragment);

    picked.selection.removeAllRanges();
    syncFromWys();
    setStatus('書式を外しました', 'ok');
  }

  // -------------------------------------------------------------------------
  // 段落の操作
  // -------------------------------------------------------------------------

  /**
   * 箇条書きや引用の対象になる要素を探す。
   * 入れ子のテーブルを含む「入れ物」は壊さないよう除外する。
   */
  function paragraphTarget() {
    var node = wys.selected;
    while (node && wys.doc && node !== wys.doc.body) {
      if (isParagraphish(node)) return node;
      node = node.parentElement;
    }
    return null;
  }

  function isParagraphish(elem) {
    if (['TD', 'DIV', 'P', 'LI'].indexOf(elem.tagName) === -1) return false;

    for (var i = 0; i < elem.children.length; i++) {
      var tag = elem.children[i].tagName;
      if (!INLINE_TAGS[tag] && tag !== 'UL' && tag !== 'OL' && tag !== 'DIV') {
        return false;
      }
    }
    return true;
  }

  function toggleList(tag) {
    var target = paragraphTarget();
    if (!target) {
      setStatus('リストにする段落を選んでください', 'err');
      return;
    }

    var list = target.querySelector('ul, ol');
    pushUndo();

    if (list && list.tagName.toLowerCase() === tag) {
      // 同じ種類なら解除して <br> 区切りに戻す
      target.innerHTML = itemsOf(list).join('<br />');
    } else if (list) {
      // 種類の変更
      target.innerHTML = buildList(tag, itemsOf(list));
    } else {
      var lines = target.innerHTML
        .split(/<br\s*\/?>/i)
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return line.length; });

      if (!lines.length) {
        wys.undo.pop();
        setStatus('リストにする文章がありません', 'err');
        return;
      }
      target.innerHTML = buildList(tag, lines);
    }

    syncFromWys();
    renderInspector();
  }

  function itemsOf(list) {
    return Array.prototype.map.call(list.querySelectorAll('li'), function (li) {
      return li.innerHTML.trim();
    });
  }

  function buildList(tag, items) {
    return '<' + tag + ' style="margin:0; padding-left:1.4em;">'
      + items.map(function (item) {
        return '<li style="margin-bottom:6px;">' + item + '</li>';
      }).join('')
      + '</' + tag + '>';
  }

  function toggleQuote() {
    var target = paragraphTarget();
    if (!target) {
      setStatus('引用にする段落を選んでください', 'err');
      return;
    }

    pushUndo();
    var quote = findQuote(target);

    if (quote) {
      target.innerHTML = quote.innerHTML;
    } else {
      target.innerHTML = '<div style="margin:0; padding:4px 0 4px 16px; border-left:' + QUOTE_BORDER
        + '; color:#6b7280;">' + target.innerHTML + '</div>';
    }

    syncFromWys();
  }

  function findQuote(target) {
    var candidates = target.querySelectorAll('div[style*="border-left"]');
    for (var i = 0; i < candidates.length; i++) {
      if ((candidates[i].getAttribute('style') || '').indexOf(QUOTE_BORDER) !== -1) {
        return candidates[i];
      }
    }
    return null;
  }

  function shiftIndent(direction) {
    var target = paragraphTarget();
    if (!target) {
      setStatus('インデントする段落を選んでください', 'err');
      return;
    }

    pushUndo();
    var current = parseInt(target.style.paddingLeft, 10) || 0;
    var next = Math.max(0, current + direction * INDENT_STEP);
    target.style.paddingLeft = next ? next + 'px' : '';

    syncFromWys();
    renderInspector();
  }

  // -------------------------------------------------------------------------
  // ブロックの操作
  // -------------------------------------------------------------------------

  function contentTable() {
    if (!wys.doc || !wys.doc.body) return null;

    var tables = wys.doc.body.querySelectorAll('table');
    for (var i = 0; i < tables.length; i++) {
      var width = tables[i].getAttribute('width') || '';
      var style = tables[i].getAttribute('style') || '';
      if (width === '600' || style.indexOf('600px') !== -1) return tables[i];
    }
    return tables.length ? tables[tables.length - 1] : null;
  }

  function ensureContentTable() {
    var existing = contentTable();
    if (existing) return existing;

    var idoc = wys.doc;
    if (!idoc || !idoc.body) return null;

    var holder = idoc.createElement('div');
    holder.innerHTML = CONTENT_SCAFFOLD;
    while (holder.firstChild) idoc.body.appendChild(holder.firstChild);

    return contentTable();
  }

  function blockOf(elem) {
    var table = contentTable();
    if (!table || !elem) return null;

    var node = elem;
    while (node && node !== wys.doc.body) {
      if (node.tagName === 'TR') {
        var parent = node.parentElement;
        if (parent === table || (parent && parent.parentElement === table)) return node;
      }
      node = node.parentElement;
    }
    return null;
  }

  // -------------------------------------------------------------------------
  // 選べる単位に名前を付ける
  //
  // HTMLは変えない。「クリックで選べるもの」を4つに絞り、名前を付けるだけ。
  //
  //   背景 … 本文テーブルより外側で、地の色や写真を持つもの
  //   段  … 本文テーブル直下の行。上から順に積まれる帯
  //   枠  … 面の色や角丸を持つ箱。文字のない場所を押したときだけ
  //   部品 … 文字を打てるひとかたまり。押した場所から外へ広げた最も外側
  //
  // 任意のタグを選べるままにしていたので、何を選んだのかを毎回説明する必要が
  // あった。削除・移動・貼り付けの説明が積み上がっていた原因はここ。
  // 名前があれば「部品『注記ボックス』を消します」と言い切れる。
  //
  // 細かいタグに用があるときは、パネルのタグのパンくずから辿れる。
  // -------------------------------------------------------------------------

  /** それ自体が用のある部品。中の文字ではなく、これを選びたい */
  var STANDALONE_TAGS = { IMG: 1, HR: 1, A: 1 };

  /**
   * 面を持っているか。
   *
   * 「枠」は見た目で決める。タグ名では決められない。td のことも div のこともある。
   */
  function hasSurface(elem) {
    if (!elem || !elem.tagName || !wys.doc) return false;

    var style = wys.doc.defaultView.getComputedStyle(elem);
    var color = style.backgroundColor;

    if (color && color !== 'transparent' && !/^rgba\(0, 0, 0, 0\)$/.test(color)) return true;
    if (style.backgroundImage && style.backgroundImage !== 'none') return true;
    if (style.boxShadow && style.boxShadow !== 'none') return true;
    if (parseFloat(style.borderTopWidth) > 0 || parseFloat(style.borderLeftWidth) > 0) return true;
    if (parseFloat(style.borderTopLeftRadius) > 0) return true;

    return false;
  }

  /** 本文テーブルより外側で、地を持っているもの */
  function backdropUnit() {
    var table = contentTable();
    if (!table) return null;

    var node = table.parentElement;
    var found = null;

    while (node && node !== wys.doc.body) {
      if (hasSurface(node)) found = node;
      node = node.parentElement;
    }

    return found;
  }

  /** 段。本文テーブル直下の行 */
  function sectionUnit(elem) {
    return blockOf(elem);
  }

  /**
   * 押した場所の「部品」。
   *
   * ここは一度作り直している。はじめは、枠の中の並びの直下にあるものを部品と
   * していた。素直な考え方だが、実際の原稿では外れる。体裁のために div で
   * 束ねた中に見出しと箱が入っている、という書き方がふつうにあるからで、
   * その束ねた div が部品になってしまい、**文字を編集できない部品**が生まれた。
   * 押した文字が編集できないのは、この画面では致命的な外し方になる。
   *
   * いまは逆から見る。押した場所から外へ向かい、文字を打てるかたまりの
   * いちばん外側までを部品とする。押した文字は必ず編集できる。
   *
   * @return {Element} 部品。文字も画像も無い場所なら null
   */
  function partOf(elem, section) {
    // 画像・区切り線・リンクは、中の文字ではなくそれ自体に用がある
    if (STANDALONE_TAGS[elem.tagName]) return elem;

    var anchor = elem.closest ? elem.closest('a') : null;
    if (anchor && section.contains(anchor)) return anchor;

    var part = null;
    var node = elem;

    // 文字を打てる範囲が続くかぎり外へ出る。段は越えない
    while (node && node !== section && isTextLeaf(node)) {
      part = node;
      node = node.parentElement;
    }

    return part;
  }

  /**
   * その位置が何の単位かを返す。内側にあるものを優先する。
   * @return {Object} {el, lv} 名前が付かない場所なら null
   */
  function unitOf(elem) {
    if (!elem || !elem.tagName || !wys.doc) return null;
    if (elem === wys.doc.body || elem === wys.doc.documentElement) return null;

    var section = sectionUnit(elem);

    if (!section) {
      var back = backdropUnit();
      return (back && (back === elem || back.contains(elem)))
        ? { el: back, lv: 'backdrop' }
        : null;
    }

    var part = partOf(elem, section);
    if (part) return { el: part, lv: 'part' };

    // 文字のない場所。面を持つ、いちばん内側の箱を選ぶ
    var node = elem;

    while (node && node !== section) {
      if (hasSurface(node)) return { el: node, lv: 'panel' };
      node = node.parentElement;
    }

    return { el: section, lv: 'section' };
  }

  /** すでに選んでいる要素が、どの単位にあたるか */
  function levelOf(elem) {
    var unit = unitOf(elem);
    return (unit && unit.el === elem) ? unit.lv : '';
  }

  /**
   * 上の階層へさかのぼる道すじ。パネルに名前で出す。
   *
   * 枠は入れ子になることがある（白いカードの中の、色の付いた箱）。
   * まとめて1つに見せると、外側のカードを選ぶ手立てが無くなるので、
   * 「枠 › 枠」と続けて並べる。ここは名前の重複より、辿れることを取る。
   *
   * @return {Array<Object>} [{el, lv}, ...] 外側から順に
   */
  function unitPath(elem) {
    var path = [];
    var unit = unitOf(elem);
    if (!unit) return path;

    if (unit.lv === 'backdrop') return [unit];

    var section = sectionUnit(unit.el) || sectionUnit(elem);
    if (!section) return [unit];

    var back = backdropUnit();
    if (back) path.push({ el: back, lv: 'backdrop' });
    path.push({ el: section, lv: 'section' });

    // 段と、選んだものの間にある枠を、外側から順に
    var boxes = [];
    var node = unit.el.parentElement;

    while (node && node !== section) {
      if (hasSurface(node)) boxes.unshift({ el: node, lv: 'panel' });
      node = node.parentElement;
    }

    path = path.concat(boxes);

    if (unit.el !== section) path.push(unit);

    return path;
  }

  /**
   * その単位の呼び名。パネルのボタンに添える。
   *
   * 枠が2つ並ぶことがあるので、名前だけでは見分けられない。
   * 中の文字を少し添えて、どちらの箱なのかを分かるようにする。
   */
  function unitName(elem, lv) {
    if (lv === 'backdrop' || lv === 'section') return levelName(lv);

    var text = (elem.textContent || '').replace(/\s+/g, ' ').trim();
    if (!text && elem.querySelector && elem.querySelector('img')) return '画像';
    if (!text) return lv === 'panel' ? levelName(lv) : elementLabel(elem);

    var short = text.length > 16 ? text.slice(0, 16) + '…' : text;

    return lv === 'panel' ? levelName(lv) + '：' + short : short;
  }

  /**
   * 部品はプルダウンにしまわず、名前のついたボタンとして並べる。
   * 何が挿入できるかが一目で分かるようにするため。
   */
  function setInsertTarget(target) {
    state.insertTarget = target;
    el['target-row'].classList.toggle('active', target === 'row');
    el['target-cell'].classList.toggle('active', target === 'cell');
  }

  function renderPartButtons() {
    var container = el['part-buttons'];
    container.textContent = '';

    if (!state.parts.length) {
      container.appendChild(emptyNode('部品を取得できませんでした。'));
      return;
    }

    state.parts.forEach(function (part) {
      var button = document.createElement('button');
      var label = part.key === 'signature' ? '署名…' : part.name;

      if (PART_ICONS[part.key]) {
        button.innerHTML = iconSvg(PART_ICONS[part.key]);
      }
      button.appendChild(document.createTextNode(label));

      if (part.key === 'signature') {
        // 署名は登録したものから選ばせる
        button.title = '登録した署名から選んで挿入します';
        button.addEventListener('click', openSignatures);
      } else {
        button.title = '「' + part.name + '」を挿入';
        button.addEventListener('click', function () {
          insertRow(themed(part.html), part.name);
        });
      }

      container.appendChild(button);
    });
  }

  /**
   * Webページ用テンプレートの本文コンテナ。
   * テーブル組みではないので、部品は行ではなくブロックとして差し込む。
   *
   * `main, article, .page` をまとめて querySelector すると文書順で最初の要素が返り、
   * ヘッダー内の入れ物を拾ってしまう。意味の強い順に個別で探すこと。
   */
  function webContainer() {
    if (!wys.doc || !wys.doc.body) return null;

    var body = wys.doc.body;
    var container = body.querySelector('main')
      || body.querySelector('article')
      || body.querySelector('.page');

    if (container) return container;

    // 該当する入れ物が無くても、<style> があってレイアウト用テーブルが無ければ
    // Webページとみなし、本文の末尾に足す
    return (wys.doc.querySelector('style') && !contentTable()) ? body : null;
  }

  /**
   * 部品の中身（<tr><td> で包まれている場合はセルの内側）を取り出す。
   * セル内へ入れるときや、Webページ用の文書へ入れるときに使う。
   */
  function partInnerHtml(html) {
    var holder = wys.doc.createElement('div');
    holder.innerHTML = /^\s*<tr[\s>]/i.test(html)
      ? '<table><tbody>' + html + '</tbody></table>'
      : html;

    var cell = holder.querySelector('td');
    return cell ? cell.innerHTML.trim() : holder.innerHTML.trim();
  }

  /**
   * 選択中のセル・枠の中へ部品を入れる。
   *
   * HTMLメールではテーブルの入れ子が標準的な組み方なので、
   * カラムの中にボタンや画像を入れても仕様上の問題はない。
   */
  function insertIntoCell(html, label) {
    var target = null;
    var node = wys.selected;

    while (node && wys.doc && node !== wys.doc.body) {
      if (['TD', 'TH', 'DIV'].indexOf(node.tagName) !== -1) { target = node; break; }
      node = node.parentElement;
    }

    if (!target) {
      setStatus('挿入先のセルや枠を選んでください', 'err');
      return;
    }

    pushUndo();

    var block = wys.doc.createElement('div');
    block.innerHTML = partInnerHtml(html);
    target.appendChild(block);

    syncFromWys();
    block.scrollIntoView({ block: 'nearest' });
    selectElement(block);
    setStatus('「' + label + '」を選択中の枠の中に挿入しました', 'ok');
  }

  /**
   * 部品を差し込む。
   * メール用（テーブル組み）なら <tr> として、Webページ用ならブロックとして入れる。
   */
  function insertRow(html, label) {
    if (!wys.doc) return;

    // 挿入先が「セル内」なら、選択中の枠へ入れる
    if (state.insertTarget === 'cell') {
      insertIntoCell(html, label);
      return;
    }

    // 本文テーブルが無く、Webページ用の構造がある場合はそちらへ
    if (!contentTable() && webContainer()) {
      insertBlock(html, label);
      return;
    }

    pushUndo();

    var table = ensureContentTable();
    if (!table) {
      wys.undo.pop();
      setStatus('挿入先を用意できませんでした', 'err');
      return;
    }

    var markup = /^\s*<tr[\s>]/i.test(html)
      ? html
      : '<tr><td style="padding:8px 32px 24px 32px;">' + html + '</td></tr>';

    var block = blockOf(wys.selected);
    var container = block ? block.parentNode : (table.tBodies[0] || table);
    var anchor = block ? block.nextSibling : null;

    // <tr> は tbody を親にしないとパースされない
    var holder = wys.doc.createElement('tbody');
    holder.innerHTML = markup;

    var rows = Array.prototype.slice.call(holder.children);
    rows.forEach(function (row) { container.insertBefore(row, anchor); });

    syncFromWys();
    if (rows.length) {
      rows[0].scrollIntoView({ block: 'nearest' });
      selectElement(rows[0].querySelector('td') || rows[0]);
    }
    setStatus('「' + label + '」を挿入しました', 'ok');
  }

  /**
   * Webページ用の文書へ部品を差し込む。
   * 部品は <tr><td>…</td></tr> で定義されているので、セルの中身だけを取り出す。
   */
  function insertBlock(html, label) {
    var container = webContainer();
    if (!container) return;

    pushUndo();

    var block = wys.doc.createElement('div');
    block.innerHTML = partInnerHtml(html);

    // 選択中の要素が本文コンテナの直下なら、その次に入れる
    var anchor = null;
    var node = wys.selected;
    while (node && node !== wys.doc.body) {
      if (node.parentElement === container) { anchor = node.nextSibling; break; }
      node = node.parentElement;
    }
    container.insertBefore(block, anchor);

    syncFromWys();
    block.scrollIntoView({ block: 'nearest' });
    selectElement(block);
    setStatus('「' + label + '」を挿入しました', 'ok');
  }

  /**
   * 同じ並びにいる要素。編集用に差し込んだものは数えない。
   *
   * body の直下を選んだときに、つまみや落ち先の線まで兄弟として
   * 数えてしまうため。
   */
  function siblingsOf(elem) {
    if (!elem || !elem.parentElement) return [];

    return Array.prototype.filter.call(elem.parentElement.children, function (node) {
      return !node.hasAttribute('data-wys-injected');
    });
  }

  /** 動かせる相手がいるか */
  function movableSiblings(elem) {
    return siblingsOf(elem).length > 1;
  }

  /**
   * 実際に動かす相手。
   *
   * 選んだ要素に兄弟がいなければ、外へさかのぼっていちばん近い
   * 「並びの中にいる祖先」を返す。
   *
   * 見出しの白いカードのように、内側の td には兄弟がいないのに
   * 外側の tr には並びがある、という作りが多いため。これが無いと
   * 見た目のかたまりを動かせない。
   */
  function movableTarget(elem) {
    var node = elem;

    while (node && node.tagName && node !== wys.doc.body) {
      if (movableSiblings(node)) return node;
      node = node.parentElement;
    }

    return null;
  }

  /**
   * 選択中の要素を、同じ並びの中で上下に動かす。
   *
   * 以前はブロック（本文テーブル直下の tr）まで登ってから動かしていた。
   * 手書きのHTMLではそれが本文まるごとの1行だけ、ということが起きるため、
   * 部品を選んだつもりで本文全体が動いていた。削除と同じ直し方をしている。
   */
  function moveSelected(delta) {
    var elem = movableTarget(wys.selected);

    if (!elem) {
      setStatus('動かせる並びが見つかりません', 'err');
      return;
    }

    // 選んだものより外側を動かすときは、何が動くのかを選択で示す
    if (elem !== wys.selected) selectElement(elem);

    var list = siblingsOf(elem);

    var index = list.indexOf(elem);
    var next = index + delta;

    if (next < 0) {
      setStatus('すでに先頭です');
      return;
    }
    if (next >= list.length) {
      setStatus('すでに末尾です');
      return;
    }

    pushUndo();

    if (delta < 0) elem.parentNode.insertBefore(elem, list[next]);
    else elem.parentNode.insertBefore(list[next], elem);

    syncFromWys();
    positionHandles();
    elem.scrollIntoView({ block: 'nearest' });

    setStatus(elementLabel(elem) + 'を' + (delta < 0 ? '上' : '下') + 'へ動かしました'
      + '（Ctrl + Z で戻せます）', 'ok');
  }

  // -------------------------------------------------------------------------
  // 要素のコピーと貼り付け
  //
  // 別ウインドウで開いたこのアプリや、外部のHTMLとやり取りするので、
  // システムのクリップボードを使う。アプリ内の変数に控える方式では窓をまたげない。
  //
  // 持ち出すときは、見た目をインラインに焼き付ける。クラスや <style> に
  // 頼ったままだと、定義の無い原稿へ貼ったときにただの文字になる。
  // （いただいたCFEの原稿の .btn が、まさにその形だった）
  // -------------------------------------------------------------------------

  /*
     焼き付ける見た目。

     幅・高さの類はわざと入れていない。table の width:100%; max-width:600px を
     計算値の px で固定すると、狭い画面で縮まなくなるため。
  */
  var COPY_PROPS = [
    'color', 'background-color', 'background-image', 'background-size',
    'background-position', 'background-repeat',
    'font-family', 'font-size', 'font-weight', 'font-style', 'font-variant',
    'text-decoration', 'text-align', 'text-transform', 'line-height', 'letter-spacing',
    'vertical-align', 'white-space', 'display',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'margin-top', 'margin-right', 'margin-bottom', 'margin-left',
    'border-top-width', 'border-right-width', 'border-bottom-width', 'border-left-width',
    'border-top-style', 'border-right-style', 'border-bottom-style', 'border-left-style',
    'border-top-color', 'border-right-color', 'border-bottom-color', 'border-left-color',
    'border-radius', 'box-shadow', 'opacity'
  ];

  /** 貼り付けで落とすもの。持ち込んだ先で悪さをする */
  var PASTE_DROP_TAGS = ['SCRIPT', 'STYLE', 'LINK', 'META', 'BASE', 'IFRAME',
    'OBJECT', 'EMBED', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT'];

  var baselineFrame = null;
  var baselineCache = {};

  /**
   * まっさらな文書での既定値。
   *
   * 「その見た目がスタイルシート由来か、ブラウザの初期値か」を見分けるために要る。
   * 初期値まで書き出すと、貼り付け先が読めない量になる。
   */
  function baselineStyle(tag) {
    if (baselineCache[tag]) return baselineCache[tag];

    if (!baselineFrame) {
      baselineFrame = document.createElement('iframe');
      baselineFrame.setAttribute('aria-hidden', 'true');
      baselineFrame.style.cssText =
        'position:absolute; width:0; height:0; border:0; visibility:hidden';
      document.body.appendChild(baselineFrame);
      baselineFrame.contentDocument.write('<!DOCTYPE html><body>');
      baselineFrame.contentDocument.close();
    }

    var doc = baselineFrame.contentDocument;
    var probe = doc.createElement(tag);

    // 中身が空だと display が変わる要素があるので、詰め物を入れる
    probe.textContent = 'x';
    doc.body.appendChild(probe);

    var computed = doc.defaultView.getComputedStyle(probe);
    var map = {};
    COPY_PROPS.forEach(function (prop) { map[prop] = computed.getPropertyValue(prop); });

    doc.body.removeChild(probe);
    baselineCache[tag] = map;
    return map;
  }

  /**
   * 持ち出すときに、いっしょに連れて行く外側の箱。
   *
   * 白い枠の中の文字だけを持ち出すと、貼り付け先では白が消える。見えている
   * 通りを運ぶのがコピーの目的なので、面を持つ外側までを1つの荷物にする。
   *
   * 連れて行くのは、いちばん近い面ひとつ分まで。いちばん外側まで取ると、
   * カードの中の小さな箱を1つ持ち出したいだけのときに、カードごと付いてくる。
   * さかのぼるのも段まで。背景（本文より外側）は紙面そのものなので運ばない。
   *
   * @return {Element} 連れて行く外側の要素。無ければ null
   */
  function surfaceAncestor(elem) {
    var stop = sectionUnit(elem) || contentTable();
    if (!stop || !stop.contains(elem) || stop === elem) return null;

    var node = elem.parentElement;

    while (node) {
      if (hasSurface(node)) return node;
      if (node === stop) break;
      node = node.parentElement;
    }

    return null;
  }

  /** 中身を入れない、その要素だけの複製 */
  function shellClone(node) {
    var copy = node.cloneNode(false);

    EDIT_ATTRS.forEach(function (attr) {
      if (copy.hasAttribute(attr)) copy.removeAttribute(attr);
    });

    return copy;
  }

  /** 元の要素と、複製した要素を同じ順で組にする */
  function pairUp(source, clone) {
    var pairs = [[source, clone]];
    var from = source.querySelectorAll('*');
    var to = clone.querySelectorAll('*');

    for (var i = 0; i < from.length; i++) {
      if (to[i]) pairs.push([from[i], to[i]]);
    }

    return pairs;
  }

  /**
   * 表の部品は、表に入れてから持ち出す。
   *
   * tr や td を裸のまま渡すと、受け取った側が innerHTML に流し込んだ時点で
   * ブラウザに捨てられる。中身だけが残り、面の色も余白も消える。
   */
  function tableWrapped(node) {
    var tag = node.tagName;
    if (tag !== 'TR' && tag !== 'TD' && tag !== 'TH') return node;

    var table = wys.doc.createElement('table');
    table.setAttribute('cellpadding', '0');
    table.setAttribute('cellspacing', '0');
    table.setAttribute('border', '0');
    table.setAttribute('width', '100%');
    table.style.width = '100%';
    table.style.borderCollapse = 'collapse';

    var body = wys.doc.createElement('tbody');
    var row = (tag === 'TR') ? node : wys.doc.createElement('tr');

    if (tag !== 'TR') row.appendChild(node);

    body.appendChild(row);
    table.appendChild(body);

    return table;
  }

  /**
   * 選択中の要素を、それだけで成り立つHTMLにする。
   *
   * すでに style 属性で指定されているものは触らない。上書きすると、
   * 作り手が意図して書いた指定を消してしまう。
   */
  function portableHtml(elem, withSurface) {
    var win = wys.doc.defaultView;
    var clone = cleanClone(elem);
    var pairs = pairUp(elem, clone);
    var root = clone;

    // 外側の面を、空の入れ物として重ねていく
    if (withSurface) {
      var top = surfaceAncestor(elem);
      var node = top ? elem.parentElement : null;

      while (node) {
        var shell = shellClone(node);
        shell.appendChild(root);
        pairs.push([node, shell]);
        root = shell;

        if (node === top) break;
        node = node.parentElement;
      }
    }

    pairs.forEach(function (pair) {
      var source = pair[0];
      var target = pair[1];
      if (!target || !target.style) return;

      var tag = source.tagName.toLowerCase();
      var base = baselineStyle(tag);
      var computed = win.getComputedStyle(source);

      COPY_PROPS.forEach(function (prop) {
        if (target.style.getPropertyValue(prop)) return;   // 元から書いてある

        var value = computed.getPropertyValue(prop);
        if (!value || value === base[prop]) return;

        target.style.setProperty(prop, value);
      });

      // クラスは持ち出さない。貼り付け先に定義が無く、誤解のもとになる
      target.removeAttribute('class');
      target.removeAttribute('id');
    });

    return tableWrapped(root).outerHTML;
  }

  /**
   * 貼り付ける中身を安全にする。
   *
   * 外部のページからも持ち込めるようにしたので、何が入っているか分からない。
   */
  function cleanPasted(html) {
    var source = String(html);
    var holder = wys.doc.createElement('div');

    /*
       表の切れ端は、表の中でないと読み込めない。
       <tr> や <td> で始まる断片を div に流し込むと、タグごと捨てられて
       中の文字だけが残る。外部の表からコピーしたときに起きる。
    */
    var fragment = source.replace(/<!--[\s\S]*?-->/g, '').replace(/^\s+/, '');

    if (/^<t[rdh][\s>]/i.test(fragment)) {
      var open = /^<tr[\s>]/i.test(fragment) ? '<table><tbody>' : '<table><tbody><tr>';
