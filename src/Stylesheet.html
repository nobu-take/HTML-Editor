<style>
  /*
   * 線ではなく面のコントラストで層をつくる。
   *
   *   下地 --bg → パネル --panel → 入力欄 --sunken
   *
   * 枠線と区切り線は使わない。パネル同士は 5px の隙間を空け、
   * 下地の色をそのまま継ぎ目にする。まとまりは間隔の差で示す
   * （群と群のあいだ 18px / 群の中 2px）。
   *
   * 暗い下地にしてある。理由は2つ。
   *
   *   ・作るものが白い。原稿は白い紙のようなもので、画面の中でいちばん
   *     明るい。まわりを暗くすると、そこだけが浮き上がって見える。
   *     編集の道具は、道具そのものではなく作りかけを見せるためにある。
   *   ・長く見る画面だから。テンプレートを直し、文面を練り、色を合わせる。
   *     白い面を広く出し続けるのは、その使い方には向かない。
   *
   * 明度は 3 段に絞ってある。段を増やすほど、どれが手前なのか読みにくくなる。
   */
  :root {
    --bg: #0e1013;          /* 下地。パネルの隙間から見える */
    --panel: #191c21;       /* ヘッダー・一覧・ツールバーなど */
    --sunken: #23272e;      /* 入力欄 */
    --hover: #2d323a;       /* ボタンのホバー */
    --canvas: #08090b;      /* プレビューの地。原稿の白がいちばん映える */

    --text: #e9ecf1;
    --body: #c3c9d4;        /* ボタンの文字 */
    --muted: #a2aab7;
    /*
       ラベルと無効。暗い下地では、明るいときと同じ濃さでは沈む。
       ここは実測で決めた。パネルの上で 5.3、入力欄の上で 4.65。
       いずれも本文として読める下限（4.5）を超える。
    */
    --faint: #87909e;

    /*
       強調の色。暗い下地では、明るい配色のままだと沈んで読めない。
       彩度を落とし、明度を上げてある。
    */
    --accent: #5b9cf8;
    --accent-weak: #1e2c42;   /* 選択中の下地。青の気配だけ残す */
    --accent-ink: #a8c9ff;    /* その上に乗る文字 */
    --danger: #f2837a;
    --danger-weak: #3a211f;
    --ok: #62c98b;
    --ok-weak: #172b20;
    --warn: #e0b25f;
    --warn-weak: #302617;

    /*
       浮いていることの示し方。

       暗い下地では黒い影が見えない。落ち影ではなく、上の縁に淡い光を
       入れて、面が手前にあることを示す。
    */
    --lift: inset 0 1px 0 rgba(255, 255, 255, .06);
    --lift-strong: inset 0 1px 0 rgba(255, 255, 255, .09),
                   0 18px 44px rgba(0, 0, 0, .55);

    /* アプリ全体の表示サイズ。JSが実際の値を入れる */
    --ui-scale: 1;

    /*
       コード画面。地は他の面より一段沈める。書いたものが主役で、
       まわりの道具より奥にある、という並びにする。

       文字の色は、この地の上で contrast 4.5 以上を確認してある
       （4.52〜14.07）。コードは全部が本文なので、例外を作らない。
    */
    --code-bg: #14171c;
    --code-ink: #dfe4ec;
    --code-tag: #79bbff;
    --code-attr: #c4a7ff;
    --code-text: #8fd694;
    --code-note: #8b95a3;
    --code-num: #f0a76b;
    --code-key: #ef8fa8;
    --code-meta: #a7b0bd;
    --code-mark: #aab3c0;
    --code-def: #7fd7c4;

    --radius: 6px;
    --radius-panel: 10px;
    --seam: 4px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    gap: var(--seam);
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 操作の基本形 ---------- */

  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--body);
    font: inherit;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }

  /*
    上の display 指定は、ブラウザ既定の [hidden] { display: none } より
    強い。hidden を付けたボタンがそのまま出てしまうので、ここで戻す。

    全体に [hidden] を効かせないのは、.panes.split .pane[hidden] のように
    わざと表示している箇所があるため。
  */
  button[hidden] { display: none; }

  button svg { flex: none; color: var(--muted); }

  button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  button:hover:not(:disabled) svg { color: var(--text); }

  button:disabled { color: var(--faint); cursor: default; }
  button:disabled svg { color: var(--faint); }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* 塗るのは画面にひとつ。主要な動作だけ */
  button.primary {
    padding: 6px 14px;
    background: var(--accent);
    /* 明るい青の上は、白より暗い文字のほうが読める */
    color: #0e1013;
    font-weight: 600;
  }

  button.primary svg { color: #0e1013; }
  button.primary:hover:not(:disabled) { background: #78b0ff; color: #0e1013; }
  button.primary:disabled { background: #34404f; color: #7b8492; }

  /* 破壊的な操作は、色を文字とアイコンだけに乗せる */
  button.danger { color: var(--danger); }
  button.danger svg { color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-weak); color: var(--danger); }

  /* ダイアログの確定ボタンだけは、押す前に気づけるよう塗る */
  .dialog-actions button.danger {
    background: var(--danger);
    color: #fff;
  }

  .dialog-actions button.danger:hover:not(:disabled) { background: #8f1e18; }

  /* 選択中 */
  button.active,
  .chip.active,
  .tab.active,
  .loc-tab.active {
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-weight: 600;
  }

  button.active svg { color: var(--accent-ink); }

  /* アイコンだけのボタン */
  .icon-only { padding: 6px; }

  /* ---------- アプリ全体の表示サイズ ---------- */

  .pop-wrap { position: relative; display: inline-flex; }

  .pop {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 40;
    width: 300px;
    padding: 14px 16px 12px;
    border-radius: 10px;
    background: var(--panel);
    box-shadow: var(--lift-strong);
  }

  .pop[hidden] { display: none; }
  .pop h3 { margin: 0 0 2px; font-size: 13px; }
  .pop-why { margin: 0 0 10px; font-size: 11.5px; color: var(--muted); }

  .scale-opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 7px;
    text-align: left;
  }

  .scale-opt:hover { background: var(--sunken); }
  .scale-opt.active { background: var(--accent-weak); }

  .scale-opt .mark {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    border-radius: 50%;
    background: var(--sunken);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .scale-opt.active .mark { background: var(--accent); }

  .scale-opt.active .mark::after {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
  }

  .scale-opt b { display: block; font-size: 13px; }
  .scale-opt span span { display: block; font-size: 11.5px; color: var(--muted); }
  .scale-opt.active b, .scale-opt.active span span { color: var(--accent-ink); }

  .menu-pop { width: 268px; padding-bottom: 8px; }

  .menu-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    width: 100%;
    padding: 7px 10px;
    border-radius: 7px;
    text-align: left;
    white-space: normal;
  }

  .menu-item:hover:not(:disabled) { background: var(--sunken); }
  .menu-item:disabled { opacity: .4; }
  .menu-item svg { flex: 0 0 auto; margin-top: 3px; }
  .menu-item .mi { min-width: 0; }
  .menu-item b { display: block; font-size: 12.5px; font-weight: 500; }
  .menu-item .mi span { display: block; font-size: 11px; color: var(--muted); }
  .menu-item.danger b { color: var(--danger); }

  .dialog-sub { color: var(--muted); font-size: 12px; }

  .pop-note {
    margin: 10px 0 0;
    padding: 9px 11px;
    border-radius: 7px;
    background: var(--sunken);
    font-size: 11.5px;
    color: var(--muted);
  }

  .pop-note b { color: var(--text); }

  .scale-hint {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    background: var(--accent-weak);
    color: var(--accent-ink);
  }

  .scale-hint[hidden] { display: none; }
  .scale-hint b { font-size: 13px; }
  .scale-hint p { margin: 2px 0 0; font-size: 12px; }
  .scale-hint-actions { margin-left: auto; display: flex; gap: 8px; white-space: nowrap; }

  /* 群の中は 2px、群と群のあいだは 18px */
  .seg { display: flex; align-items: center; gap: 2px; }

  input[type="text"],
  input[type="search"],
  input[type="number"],
  input[type="color"],
  select,
  textarea {
    border: 0;
    border-radius: var(--radius);
    background: var(--sunken);
    padding: 7px 10px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
  }

  input::placeholder, textarea::placeholder { color: var(--faint); }

  select { padding: 6px 8px; cursor: pointer; }

  input[type="color"] {
    width: 30px;
    height: 26px;
    padding: 0;
    background: none;
    cursor: pointer;
  }

  /* ---------- ヘッダー ---------- */

  header {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 16px 6px;
    background: var(--panel);
  }

  header .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .row + .row { gap: 16px; }

  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-weight: 700;
    white-space: nowrap;
  }

  /*
     用途を添える一言。太い本体より一段落として、
     名前の一部でありながら読み下せるようにする。
  */
  .brand-for {
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .spacer { flex: 1 1 auto; }

  /* ファイル名は伸ばしすぎない。空いた幅はタグとボタンに回す */
  #title { flex: 0 1 260px; min-width: 120px; }
  #tags { flex: 1 1 auto; min-width: 110px; }

  #status {
    min-width: 92px;
    text-align: right;
    font-size: 12px;
    color: var(--muted);
  }

  #status.ok { color: var(--ok); }
  #status.err { color: var(--danger); }

  /* ---------- レイアウト ---------- */

  main {
    flex: 1 1 auto;
    display: flex;
    gap: var(--seam);
    min-height: 0;
  }

  .sidebar {
    flex: 0 0 250px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
  }

  .sidebar[hidden] { display: none; }

  .aside-head {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 12px;
  }

  .location-row {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .loc-tab {
    flex: 1 1 0;
    justify-content: center;
    font-size: 12px;
  }

  .loc-badge {
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--warn-weak);
    color: var(--warn);
    font-size: 11px;
    white-space: nowrap;
  }

  .loc-badge[hidden] { display: none; }
  .loc-badge.err { background: var(--danger-weak); color: var(--danger); }

  /* 隠したものを戻すための細い帯 */
  .rail {
    flex: 0 0 14px;
    padding: 0;
    border-radius: 0;
    background: var(--panel);
    color: var(--faint);
    font-family: Consolas, monospace;
    font-size: 12px;
    justify-content: center;
  }

  .rail:hover { background: var(--accent-weak); color: var(--accent); }
  .rail[hidden] { display: none; }

  #search { width: 100%; }

  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .chip {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
  }

  /*
     作り手を示す一行。一覧の足元に置く。

     ヘッダーには伸縮の余りが無く、足すと他が押し出される。ここなら
     一覧の高さを20px弱ぶん譲るだけで済む。控えめな色にしてあるのは、
     作業中に目を引く場所ではないため。
  */
  .side-foot {
    flex: 0 0 auto;
    padding: 8px 12px 10px;
    font-size: 11px;
    text-align: center;
  }

  .side-foot a {
    color: var(--faint);
    text-decoration: none;
  }

  .side-foot a:hover { color: var(--accent-ink); text-decoration: underline; }

  #list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 8px 8px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  .item:hover { background: var(--hover); }

  .item.active { background: var(--accent-weak); }
  .item.active .item-title { color: var(--accent-ink); font-weight: 600; }
  .item.active .item-meta { color: #8fb0dd; }

  .item-title {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-meta { font-size: 11px; color: var(--faint); }

  .item-tags { display: flex; flex-wrap: wrap; gap: 4px; }

  .badge {
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--sunken);
    color: var(--muted);
    font-size: 11px;
  }

  /*
     選択中の原稿のタグ。

     明るい配色のときの色（#c5d9f7）が残っていて、暗くしたあとは
     薄い地に薄い文字になり、比 1.17 で読めなかった。
     選択中の地（--accent-weak）より一段明るい面に置き直す。
  */
  .item.active .badge { background: #2b3d57; color: #cfe0ff; }

  .empty {
    padding: 16px 10px;
    color: var(--faint);
    font-size: 13px;
    line-height: 1.7;
  }

  /* ---------- 作業領域 ---------- */

  .workspace {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--seam);
  }

  .tabbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 14px;
    background: var(--panel);
  }

  .tabs { display: inline-flex; gap: 2px; }

  .canvas-size {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .inline-label,
  .tool-label,
  .mini,
  .unit {
    font-size: 11px;
    color: var(--faint);
    white-space: nowrap;
  }

  .inline-label { margin-right: 4px; }

  #width-input {
    width: 64px;
    padding: 5px 8px;
    font-size: 12px;
    text-align: right;
  }

  .panes {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--seam);
  }

  .pane {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--seam);
  }

  .pane[hidden] { display: none; }

  .panes.split { flex-direction: row; }

  .panes.split .pane,
  .panes.split .pane[hidden] {
    display: flex;
    min-width: 0;
  }

  .panes.split #pane-wys { flex: 0 0 55%; }
  .panes.split #pane-code { flex: 1 1 auto; }
  .panes.split .inspector { flex-basis: 210px; }

  .splitter { display: none; }

  .panes.split .splitter {
    display: block;
    flex: 0 0 var(--seam);
    background: var(--bg);
    cursor: col-resize;
  }

  .panes.split .splitter:hover,
  .splitter.dragging { background: var(--accent); }

  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe { pointer-events: none; }

  .pane-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 14px;
    background: var(--panel);
    font-size: 12px;
    color: var(--faint);
  }

  /* ---------- ツールバー ---------- */

  .wys-toolbar {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 5px 44px 5px 14px;
    background: var(--panel);
  }

  .wys-toolbar[hidden] { display: none; }

  /* 群は囲まず、間隔の差だけで示す */
  .tool-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* ツールバーの中は詰めて、2行に収める */
  .tool-row select {
    padding: 5px 7px;
    font-size: 12px;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tool-group-wide { flex: 1 1 auto; min-width: 0; }

  .tool-items {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 2px;
  }

  .toolbar-hide {
    position: absolute;
    top: 8px;
    right: 10px;
    padding: 3px 8px;
    color: var(--faint);
    font-size: 11px;
  }

  .toolbar-show {
    width: 100%;
    justify-content: center;
    padding: 5px;
    border-radius: 0;
    background: var(--panel);
    color: var(--faint);
    font-size: 12px;
  }

  .toolbar-show[hidden] { display: none; }

  .color-field {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  #wys-color-apply { padding: 5px 7px; font-size: 11px; }

  .hex {
    width: 56px;
    padding: 5px 7px;
    font-family: Consolas, monospace;
    font-size: 12px;
    text-transform: lowercase;
  }

  .mini { display: inline-flex; align-items: center; gap: 4px; }
  .mini.off { opacity: .45; }

  #body-width, #body-min-width {
    width: 48px;
    padding: 5px 7px;
    font-size: 12px;
    text-align: right;
  }

  .warn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    border-radius: var(--radius);
    background: var(--warn-weak);
    color: var(--warn);
    font-size: 12px;
  }

  .warn[hidden] { display: none; }
  .warn button { padding: 3px 8px; font-size: 11px; color: var(--warn); }
  .warn button:hover { background: #3a2f1c; color: var(--warn); }

  .hint { font-size: 12px; color: var(--faint); }

  /* ---------- 署名の編集 ---------- */

  /*
     署名で変えたいのは、文面と、文字の大きさ・行間・色だけ。
     そのためにタグを書かせる理由がないので、選ぶ形にしてある。
  */
  .sig-simple {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1 1 auto;
    min-height: 0;
  }

  .sig-simple textarea { min-height: 96px; resize: vertical; }

  /* 3行を1行にまとめた。縦を使わないほうが、窓に収まる */
  .sig-look {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
  }

  .sig-look-label {
    flex: 0 0 auto;
    color: var(--faint);
    font-size: 11.5px;
  }

  .sig-look .choice { padding: 4px 12px; background: var(--sunken); font-size: 12.5px; }
  .sig-look .choice:hover:not(:disabled) { background: var(--hover); }
  .sig-look .choice.active { background: var(--accent-weak); color: var(--accent-ink); font-weight: 600; }

  .sig-color-value {
    color: var(--faint);
    font-family: Consolas, monospace;
    font-size: 11.5px;
  }

  /*
     プレビューは、実際に入る見た目そのまま。
     原稿は白い紙なので、ここも白地で見せないと色の出方が変わる。
  */
  .sig-preview {
    min-height: 64px;
    max-height: 132px;
    padding: 12px 14px;
    border-radius: var(--radius);
    background: #ffffff;
    overflow-y: auto;
  }

  .signature-form.is-raw textarea { min-height: 180px; }

  /*
     どの高さでもはみ出さないための割り当て。

     題と操作ボタンは窓に固定し、**中身だけをスクロールさせる**。
     以前は操作ボタンも中身と一緒にスクロール領域へ入っていたので、
     縦が足りないと画面の外に出て押せなくなっていた。左の一覧も同じ。

     フルHDで表示倍率150%にすると、CSS上の高さは約620pxになる。
     そのくらいで起きる。珍しい環境ではない。
  */
  .sig-dialog .dialog-head,
  .sig-dialog .dialog-actions { flex: 0 0 auto; }

  .sig-dialog .signature-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .sig-dialog .signature-list { min-height: 0; }

  .sig-dialog .signature-form {
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }

  /* 操作ボタンの左に、いま何を編集しているかを出す */
  .sig-dialog .dialog-actions .hint { margin-right: auto; }

  /*
     同じことが、入力欄を縦に伸ばす他の窓でも起きる。

     .field-grow は縮むが、中の入力欄は min-height を持っていて縮まない。
     縦が足りないと枠からはみ出す。**入力欄そのものにも下限を持たせて、
     枠と一緒に縮むようにする。**
  */
  /*
     display を指定した要素は、ブラウザ既定の [hidden] { display: none }
     より強い。hidden を立てても消えないので、ここで戻す。
     ボタンで同じことが起きていた（button[hidden]）。
  */
  .field[hidden],
  .sig-simple[hidden] { display: none; }

  /* ---------- 件名 ---------- */

  .subject-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 14px;
    background: var(--panel);
  }

  .subject-bar label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }

  #subject {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
  }

  /* ---------- プレビューと要素パネル ---------- */

  .wys-body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    gap: var(--seam);
  }

  /*
     左の縦レール。ふだんは44pxでアイコンだけを見せ、カーソルを寄せた（または
     キーボードで入った）ときだけ名前が読める幅まで開く。

     開くのは中身（.rail-inner）だけで、外枠は44pxのまま。こうすると紙面が
     押し動かされず、名前を読むあいだも見え方が変わらない。
  */
  .tool-rail {
    position: relative;
    flex: 0 0 44px;
    background: var(--panel);
  }

  .rail-inner {
    position: absolute;
    inset: 0 auto 0 0;
    z-index: 6;
    width: 44px;
    padding: 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow: hidden auto;
    background: var(--panel);
    transition: width .12s ease, box-shadow .12s ease;
  }

  .tool-rail:hover .rail-inner,
  .tool-rail:focus-within .rail-inner {
    width: 176px;
    box-shadow: var(--lift-strong);
  }

  .rail-head {
    margin: 2px 0 5px 9px;
    font-size: 10.5px;
    color: var(--faint);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .12s ease;
  }

  .tool-rail:hover .rail-head,
  .tool-rail:focus-within .rail-head { opacity: 1; }

  .rail-modes { margin-bottom: 4px; padding-bottom: 5px; }

  .rail-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 32px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
  }

  .rail-item svg { flex: 0 0 auto; color: var(--accent); }
  .rail-item:hover { background: var(--sunken); }
  .rail-item.active { background: var(--accent-weak); }
  .rail-item.active, .rail-item.active svg { color: var(--accent-ink); }

  /* 部品の並び。renderPartButtons が中身を作る */
  .rail-list { display: flex; flex-direction: column; gap: 1px; }

  .rail-list button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 32px;
    padding: 0 8px;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
  }

  .rail-list button svg { flex: 0 0 auto; color: var(--accent); }
  .rail-list button:hover { background: var(--sunken); }

  .canvas-col {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--seam);
  }

  .preview-body {
    flex: 1 1 auto;
    min-width: 0;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-bottom: 16px;
    background: var(--canvas);
  }

  /* 高さは中身に合わせてJSが入れる。枠を画面いっぱいに広げると、
     原稿の下に背景色だけの帯が延々と続いて見えるため */
  #preview {
    flex: 0 0 auto;
    width: 600px;
    max-width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }

  .inspector {
    flex: 0 0 264px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
  }

  .inspector[hidden] { display: none; }


  /* キャンバスサイズも小窓へ。前提が見出しに出るので、中の言葉は短くてよい */
  .canvas-pop { width: 288px; }

  .canvas-pop .canvas-size {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 8px;
  }

  .canvas-pop .canvas-size .chip {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 6px 10px;
    text-align: left;
  }

  .canvas-pop .canvas-size .chip span { font-size: 10.5px; color: var(--muted); }
  .canvas-pop .canvas-size .chip.active span { color: var(--accent-ink); }

  .canvas-custom { display: flex; align-items: center; gap: 6px; }

  /* #width-input の 64px 固定を打ち消すため、こちらもIDで指定する */
  .canvas-custom #width-input {
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
    padding: 5px 10px;
    font-size: 13px;
    text-align: right;
  }

  .canvas-custom .chip { flex: 0 0 auto; }
  .canvas-custom .unit { font-size: 11px; color: var(--muted); }

  /* いま選ばれている幅を、ボタンの上に出しておく */
  #btn-canvas b {
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-size: 11px;
    font-weight: 700;
  }

  /*
     見出し行。削除もここに置く。

     下に固定の枠を作ると、そのぶん編集項目の高さが常に削られる。
     フルHD・文字150%の環境では効いてしまうため、元からあるこの行に寄せた。
  */
  .inspector-head {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 7px 8px 7px 14px;
    font-size: 11px;
    color: var(--faint);
  }

  .inspector-title { margin-right: auto; }

  /* ふだんは他のアイコンと同じ扱い。触れたときだけ赤くする */
  .inspector-head .kill:hover:not(:disabled) {
    background: var(--danger-weak);
    color: var(--danger);
  }

  .inspector-head .kill:disabled { opacity: .35; }

  .inspector-body {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 14px 14px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field label { font-size: 11px; color: var(--faint); }

  .field input[type="text"],
  .field input[type="number"],
  .field textarea { width: 100%; }

  .field-row { display: flex; align-items: center; gap: 6px; }

  .field-note {
    font-size: 11px;
    line-height: 1.7;
    color: var(--faint);
  }

  .field-grow { flex: 1 1 auto; min-height: 0; }

  /*
     名前の付いた道すじ。背景 › 段 › 枠 › 部品。
     プレビュー上の枠線と同じ色にして、目と言葉を結び付ける。
  */
  .unit-path {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 2px;
    margin-bottom: 6px;
  }

  .unit {
    padding: 3px 9px;
    border-radius: 5px;
    background: var(--sunken);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
  }

  .unit:hover { color: var(--text); }

  .unit.active { color: #fff; }

  .unit.active[data-lv="backdrop"] { background: #7c5cbf; }
  .unit.active[data-lv="section"]  { background: #1a73e8; }
  .unit.active[data-lv="panel"]    { background: #0f8a6a; }
  .unit.active[data-lv="part"]     { background: #c2610c; }

  .unit-sep { color: var(--faint); font-size: 12px; }

  /*
     選択中の要素の居場所。押すと祖先へさかのぼれる。
     背景画像のように、外側の要素が持っている指定に手が届かなかったため。
  */
  .breadcrumb-field {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 1px;
    margin-bottom: 2px;
  }

  .crumb {
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--sunken);
    color: var(--muted);
    font-family: Consolas, monospace;
    font-size: 11.5px;
  }

  .crumb:hover { background: var(--canvas); color: var(--text); }

  .crumb.active {
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-weight: 700;
  }

  /* 背景画像を持つ要素には印を付ける。どこにあるか探さずに済む */
  .crumb.has-bg::after {
    content: "";
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-left: 5px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
  }

  .crumb-sep { color: var(--faint); font-size: 11px; }

  /* 配色の選び方。テンプレート一覧の先頭 */
  .theme-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 16px;
  }

  .theme-label {
    margin-right: 4px;
    color: var(--faint);
    font-size: 11px;
  }

  .theme-chip {
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--sunken);
    color: var(--muted);
    font-size: 12px;
  }

  .theme-chip:hover { color: var(--text); }

  .theme-chip.active {
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-weight: 700;
  }

  /* 差し色。ジャンルの下に並べる */
  .accent-row { margin-top: -10px; }

  .accent-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px 4px 8px;
    border-radius: 999px;
    background: var(--sunken);
    color: var(--muted);
    font-size: 12px;
  }

  /* 色そのものを見せる。名前だけでは選べない */
  .accent-chip::before {
    content: "";
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--swatch);
  }

  .accent-chip:hover { color: var(--text); }
  .accent-chip.active { color: var(--text); font-weight: 700; }

  /* タグのパンくずの開け閉め。畳んでいるのがふだんの姿 */
  .crumb-fold {
    padding: 2px 7px;
    border-radius: 5px;
    color: var(--faint);
    font-size: 11px;
  }

  .crumb-fold:hover { color: var(--muted); }
  .crumb-fold.open { color: var(--muted); margin-bottom: 3px; }

  /* ---------- 要素パネル ---------- */

  /* まとまりの見出し。畳んでいても中身の数が分かる */
  .acc {
    display: flex;
    align-items: center;
    gap: 7px;
    width: calc(100% + 16px);
    margin: 8px -8px 6px;
    padding: 7px 8px;
    border-radius: 6px;
    background: var(--sunken);
    font-size: 11.5px;
    font-weight: 700;
  }

  .acc:hover { background: var(--canvas); }
  .acc.open { background: var(--accent-weak); color: var(--accent-ink); }

  .acc-count {
    min-width: 16px;
    padding: 0 5px;
    border-radius: 8px;
    background: var(--panel);
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
  }

  .acc-count:empty { display: none; }
  .acc-caret { margin-left: auto; font-size: 10px; color: var(--faint); }
  .acc.open .acc-caret { color: var(--accent-ink); }

  /* 設定済みの印と、その場での取り消し */
  .field > label { display: flex; align-items: center; gap: 5px; }

  .set-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex: 0 0 auto;
  }

  .field-reset {
    margin-left: auto;
    padding: 0 5px;
    border-radius: 4px;
    color: var(--faint);
    font-size: 12px;
    line-height: 1;
  }

  .field-reset:hover { background: var(--sunken); color: var(--danger); }

  /* 原稿で使われている色 */
  .used-colors { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .used-colors > span { width: 100%; font-size: 10px; color: var(--faint); }

  .used-swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
  }

  .used-swatch:hover { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 枠線：辺を図で選ぶ */
  .border-row { display: flex; gap: 8px; align-items: flex-start; }
  .border-stack { flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .border-line { display: flex; gap: 4px; align-items: center; }
  .border-line .num { width: 46px; text-align: right; }
  .border-line input[type="color"] { width: 28px; }
  .unit-static { font-size: 10.5px; color: var(--muted); }

  .side-box { position: relative; width: 52px; height: 44px; flex: 0 0 auto; }

  .side-edge {
    position: absolute;
    padding: 0;
    border-radius: 2px;
    background: var(--canvas);
  }

  .side-edge:hover { background: var(--faint); }
  .side-edge.has { background: var(--muted); }
  .side-edge.active { background: var(--accent); }

  .side-top { left: 8px; right: 8px; top: 0; height: 5px; }
  .side-bottom { left: 8px; right: 8px; bottom: 0; height: 5px; }
  .side-left { top: 8px; bottom: 8px; left: 0; width: 5px; }
  .side-right { top: 8px; bottom: 8px; right: 0; width: 5px; }

  .side-all {
    position: absolute;
    inset: 8px;
    border-radius: 3px;
    background: var(--sunken);
    font-size: 9.5px;
    color: var(--faint);
  }

  .side-all:hover { background: var(--canvas); }
  .side-all.active { background: var(--accent-weak); color: var(--accent-ink); font-weight: 700; }

  /* 数値4つと、まとめて変える連結 */
  .quad-row { display: flex; gap: 5px; align-items: flex-end; }
  .quad-row .pad-grid { flex: 1 1 auto; }

  .quad-link {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--sunken);
    color: var(--faint);
    font-size: 12px;
    flex: 0 0 auto;
  }

  .quad-link:hover { background: var(--canvas); color: var(--text); }
  .quad-link.active { background: var(--accent-weak); color: var(--accent-ink); }

  /* よく使う値のボタン＋数値 */
  .preset-row { display: flex; gap: 3px; }

  .preset-row button {
    flex: 1 1 0;
    padding: 5px 4px;
    border-radius: 6px;
    background: var(--sunken);
    font-size: 11px;
    white-space: nowrap;
  }

  .preset-row button:hover { background: var(--canvas); }
  .preset-row button.active { background: var(--accent-weak); color: var(--accent-ink); font-weight: 700; }
  .preset-row .num { flex: 0 0 46px; width: 46px; text-align: right; }

  /* 幅の単位 */
  .width-row { display: flex; gap: 4px; align-items: center; }
  .width-row .grow { flex: 1 1 auto; min-width: 0; text-align: right; }
  .unit-row { display: flex; gap: 2px; flex: 0 0 auto; }

  .unit-row button {
    padding: 5px 7px;
    border-radius: 6px;
    background: var(--sunken);
    font-size: 10.5px;
    color: var(--muted);
  }

  .unit-row button:hover { background: var(--canvas); }
  .unit-row button.active { background: var(--accent-weak); color: var(--accent-ink); font-weight: 700; }

  /* 影は見本そのものを選ばせる */
  .shadow-row { display: flex; gap: 5px; }

  .shadow-sample {
    flex: 1 1 0;
    height: 30px;
    border-radius: 6px;
    background: var(--panel);
    font-size: 10px;
    color: var(--muted);
  }

  .shadow-sample:first-child { background: var(--sunken); }
  .shadow-sample.active { outline: 2px solid var(--accent); outline-offset: -2px; color: var(--accent-ink); font-weight: 700; }

  /* URL欄。実物と確認手段を添える */
  .url-row { display: flex; gap: 5px; align-items: center; }
  .url-row input { flex: 1 1 auto; min-width: 0; }

  .url-thumb {
    width: 36px;
    height: 26px;
    border-radius: 5px;
    object-fit: cover;
    background: var(--canvas);
    flex: 0 0 auto;
  }

  .url-thumb.broken { visibility: hidden; }

  .url-open {
    padding: 5px 9px;
    border-radius: 6px;
    background: var(--sunken);
    font-size: 11px;
    flex: 0 0 auto;
  }

  .url-open:hover:not(:disabled) { background: var(--canvas); }
  .url-open:disabled { opacity: .4; }

  .choice-row { display: flex; flex-wrap: wrap; gap: 3px; }

  /* 透明度の目盛り */
  .field-row input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
  .alpha-value { flex: 0 0 auto; width: 40px; text-align: right; font-size: 11.5px; color: var(--muted); }

  .choice-row button {
    flex: 1 1 0;
    padding: 5px 4px;
    border-radius: 6px;
    background: var(--sunken);
    font-size: 11.5px;
    white-space: nowrap;
  }

  .choice-row button:hover { background: var(--canvas); }
  .choice-row button.active { background: var(--accent-weak); color: var(--accent-ink); font-weight: 700; }

  .field-note.warn {
    padding: 7px 9px;
    border-radius: 6px;
    background: var(--warn-weak);
    color: var(--warn);
  }

  .pad-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
  }

  .pad-cell { display: flex; flex-direction: column; gap: 3px; }

  .pad-cell span {
    font-size: 10px;
    text-align: center;
    color: var(--faint);
  }

  .pad-cell input {
    width: 100%;
    padding: 5px 2px;
    font-size: 12px;
    text-align: center;
  }

  .align-buttons { display: flex; gap: 2px; }

  .align-buttons button {
    flex: 1 1 0;
    justify-content: center;
    padding: 6px 0;
  }

  .op-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
  }

  .op-grid button {
    justify-content: center;
    padding: 6px;
    background: var(--sunken);
    font-size: 12px;
  }

  .op-grid button:hover:not(:disabled) { background: var(--hover); }
  .op-grid button.span2 { grid-column: 1 / -1; }

  .inline-fields { display: flex; gap: 6px; }
  .inline-fields > * { flex: 1 1 0; min-width: 0; }

  .check-inline,
  .check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }

  .check { font-size: 13px; color: var(--text); }

  /* ---------- コード ---------- */

  .editor-body {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    background: var(--panel);
  }

  /*
     コード欄の中だけ、表示サイズの zoom を打ち消す。

     CodeMirror は選択の色を行ごとの矩形として重ねて描くが、その高さを
     測るときに zoom を考えていない。倍率のぶんだけ矩形が短くなり、
     **見えている範囲とコピーされる範囲が食い違う**（選択そのものは正しい）。

     zoom は掛け算で伝わるので、1/倍率 を当てれば CodeMirror から見た
     倍率は 1 になり、測り方が合う。それだけだと文字が元の大きさに戻るので、
     font-size に倍率を掛けて見た目を保つ。
  */
  .CodeMirror {
    position: absolute;
    inset: 0;
    height: 100%;
    zoom: calc(1 / var(--ui-scale));
    font-family: Consolas, "SF Mono", "Roboto Mono", monospace;
    font-size: calc(13px * var(--ui-scale));

    background: var(--code-bg);
    color: var(--code-ink);
  }

  /*
     CodeMirror の既定は明るいテーマで、地が白い。他の面が暗いので、
     そこだけが光る。地と文字を置き換える。

     色はすべて、地 var(--code-bg) の上で contrast 4.5 以上。
  */
  .CodeMirror-gutters {
    border-right: 0;
    background: var(--panel);
  }

  .CodeMirror-linenumber { color: #7b8492; }

  .CodeMirror-cursor { border-left-color: var(--text); }

  .CodeMirror-selected { background: #2b3547; }
  .CodeMirror-focused .CodeMirror-selected { background: #33415a; }
  .CodeMirror-line::selection,
  .CodeMirror-line > span::selection,
  .CodeMirror-line > span > span::selection { background: #33415a; }

  .CodeMirror-activeline-background { background: #1a1e25; }
  .CodeMirror-matchingbracket { color: var(--code-ink); background: #2b3547; }

  /*
     既定テーマは .cm-s-default .cm-tag のように2つの class で書かれている。
     こちらも同じ数で書かないと勝てない。読み込みはこちらが後なので、
     同じ強さなら後勝ちになる。
  */
  .cm-s-default .cm-tag { color: var(--code-tag); }
  .cm-s-default .cm-attribute { color: var(--code-attr); }
  .cm-s-default .cm-string,
  .cm-s-default .cm-string-2 { color: var(--code-text); }
  .cm-s-default .cm-comment { color: var(--code-note); font-style: italic; }
  .cm-s-default .cm-number,
  .cm-s-default .cm-atom { color: var(--code-num); }
  .cm-s-default .cm-keyword,
  .cm-s-default .cm-qualifier { color: var(--code-key); }
  .cm-s-default .cm-meta { color: var(--code-meta); }
  .cm-s-default .cm-bracket,
  .cm-s-default .cm-operator,
  .cm-s-default .cm-punctuation { color: var(--code-mark); }
  .cm-s-default .cm-def,
  .cm-s-default .cm-variable,
  .cm-s-default .cm-variable-2,
  .cm-s-default .cm-variable-3,
  .cm-s-default .cm-property,
  .cm-s-default .cm-builtin { color: var(--code-def); }
  .cm-s-default .cm-error { color: var(--danger); }

  /* ---------- 全画面 ---------- */

  body.zen > header,
  body.zen .sidebar,
  body.zen #sidebar-show,
  body.zen .tabbar,
  body.zen .wys-toolbar,
  body.zen .toolbar-show,
  body.zen .inspector,
  body.zen #inspector-show {
    display: none;
  }

  .zen-bar {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--panel);
    box-shadow: var(--lift), 0 4px 18px rgba(0, 0, 0, .45);
  }

  .zen-bar[hidden] { display: none; }

  .zen-title {
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- ダイアログ ---------- */

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(31, 35, 40, .42);
  }

  .backdrop[hidden] { display: none; }

  .dialog {
    /*
       余白を変数で持つ。貼り付ける題や操作列が、この値ぶんだけ
       外へはみ出して幅いっぱいを覆う。直接22pxと書くと、余白の違う
       入れ物（.ai-card は20px）で2pxずれ、横スクロールが出る。
    */
    --pad-x: 22px;
    --pad-y: 22px;

    display: flex;
    flex-direction: column;
    gap: 14px;
    width: min(400px, 100%);
    max-height: 100%;
    padding: 22px;
    border-radius: 12px;
    background: var(--panel);
    box-shadow: var(--lift-strong);

    /*
       高さが足りないときは、ダイアログの中でスクロールさせる。

       これが無いと、max-height で枠は縮むのに中身は縮まないので
       （flexの子は既定で内容より小さくならない）、下から溢れる。
       いちばん下にある操作ボタンが画面の外に出て、押せなくなる。
       ノートPCの縦768pxでもブラウザのUIを引くと600px台になるので、
       珍しい状況ではない。
    */
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .dialog-wide { width: min(880px, 100%); }

  /*
     メールのダイアログだけ広げる。操作が4つ並ぶので、400pxだと
     どの言語でも1行に収まらない。
  */
  .dialog-mail { width: min(520px, 100%); }

  /*
     題と閉じるを横に並べる。

     ✕ は「この窓を閉じる」の意味を、OSの窓の右上にあることから
     得ている記号。下の操作列に置くと、その手がかりが無くなって
     何の記号か分からない。閉じるは右上に置く。

     スクロールしても消えないように、題ごと貼り付けておく。
  */
  .dialog-head {
    position: sticky;
    top: calc(var(--pad-y) * -1);
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: calc(var(--pad-y) * -1) calc(var(--pad-x) * -1) 0;
    padding: var(--pad-y) var(--pad-x) 4px;
    background: var(--panel);
  }

  .dialog-head h2 { flex: 1 1 auto; min-width: 0; }
  .dialog-head button { flex: none; margin-right: -4px; }

  /*
     行き先ごとのまとまり。

     手順を1・2・3と並べるのをやめ、行き先で束ねた。GmailとOutlookは
     「開いてから貼り付ける」という同じ一文を共有しているので、
     まとまりの見出しの下に一度書けば足りる。手順ごとに書くと、
     同じことが3か所に散る。
  */
  .opt-group { display: flex; flex-direction: column; gap: 7px; }

  .opt-label {
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
  }

  .opt-hint {
    margin: -2px 0 1px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
  }

  .opt-row { display: flex; flex-wrap: wrap; gap: 6px; }

  /*
     行き先はどれも等しく押せるので、4つとも同じ面を持たせる。

     面の有無で差をつけると、地のままの方が「押せない文字」に見える。
     どれを選ぶかの案内は、まとまりの見出しと説明文が担う。
  */
  .opt-row button { padding: 7px 13px; background: var(--sunken); }

  /*
     窓の締め。不安を消す一文と、詳しい説明への導線だけを置く。
     説明そのものは、読んだ結果やることが変わらないのでマニュアルへ移した。
  */
  .dialog-foot {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0;
    color: var(--faint);
    font-size: 11.5px;
  }

  .dialog-foot a { margin-left: auto; color: var(--accent); }

  /*
     気をつけてほしいことは、1行のまま色で示す。

     以前は110文字の枠付きの警告を常設していた。常にあるものは
     読まれなくなるので、短くして、関係する操作のすぐそばに移した。
     ただし地の文と同じ濃さでは見落とすため、色は残す。
  */
  .dialog-foot .caution { color: var(--warn); }

  .dialog h2 { margin: 0; font-size: 17px; }

  .dialog > p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.75;
  }

  .dialog code {
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--sunken);
    font-family: Consolas, monospace;
    font-size: 12px;
  }

  .dialog-actions {
    display: flex;
    /*
       折り返せるようにする。メールのダイアログは操作が5つあり、
       語の長い言語では400px幅に1行で収まらない。折り返さないと
       左端が枠の外に出て、ボタンが切れる。
    */
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 5px;
    margin-top: auto;

    /*
       スクロールしても操作ボタンは常に見えるようにする。
       スクロールできること自体に気づかず「壊れている」と受け取られるため。

       下の余白22pxはダイアログのpaddingぶん。ここで自分で持ち直して、
       同じ位置に貼り付けている。
    */
    position: sticky;
    bottom: calc(var(--pad-y) * -1);
    margin-bottom: calc(var(--pad-y) * -1);
    padding-top: 10px;
    padding-bottom: var(--pad-y);
    background: var(--panel);
  }

  .note {
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-size: 13px;
    line-height: 1.8;

    /*
       長いURLをはみ出させないための指定。break-all にすると英単語まで
       途中で割れて "Copy the bo dy" のようになるので、必要なときだけ
       割る anywhere を使う。日本語は既定でどこでも折り返せる。
    */
    overflow-wrap: anywhere;
  }

  .note[hidden] { display: none; }
  .note b { display: block; margin-bottom: 2px; }
  .note.warn { display: block; background: var(--warn-weak); color: var(--warn); }
  .note.err { background: var(--danger-weak); color: var(--danger); }

  /* テンプレート */

  .template-list { overflow-y: auto; }

  .template-group + .template-group { margin-top: 18px; }

  .template-group h3 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--faint);
  }

  .template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
    gap: 8px;
  }

  /* カードは「見本 → 名前 → 一言」の縦積み */
  .template-card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 0;
    border-radius: 8px;
    background: var(--sunken);
    text-align: left;
    white-space: normal;
    min-width: 0;
    overflow: hidden;
  }

  .template-card:hover { background: var(--accent-weak); }

  /*
     見本。本文600px幅のHTMLを、そのまま縮めて見せる。
     iframe は sandbox を空にして、中のスクリプトも同一オリジンも与えない。
     pointer-events を切っているので、クリックはカードに届く。
  */
  .tpl-thumb {
    position: relative;
    height: 132px;
    background: #ffffff;
    overflow: hidden;
    flex: none;
  }

  .tpl-thumb iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 600px;
    height: 440px;
    border: 0;
    transform-origin: top left;
    pointer-events: none;
  }

  /* 読み込む前の下地。真っ白のちらつきを避ける */
  .tpl-thumb::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--canvas);
  }

  .tpl-thumb.ready::before { display: none; }

  .tpl-body { padding: 9px 12px 11px; min-width: 0; }
  .template-card b { display: block; font-size: 13px; color: var(--text); }
  .template-card:hover b { color: var(--accent-ink); }
  .template-card span { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.6; }

  /* 自分のテンプレートだけ、消すボタンを重ねる */
  .tpl-del {
    position: absolute;
    top: 5px;
    right: 5px;
    z-index: 1;
    padding: 2px 7px;
    background: rgba(255, 255, 255, .92);
    color: var(--danger);
    font-size: 12px;
    border-radius: 5px;
    opacity: 0;
  }

  .template-card:hover .tpl-del,
  .tpl-del:focus-visible { opacity: 1; }
  .tpl-del:hover { background: var(--danger-weak); }

  /* 中身が無い・読めない分類に出す説明 */
  .tpl-note a { color: inherit; }
  .tpl-note {
    padding: 10px 12px;
    background: var(--warn-weak);
    color: var(--warn);
    border-radius: 6px;
    font-size: 12.5px;
  }

  /* 履歴・署名・依頼 */

  .history-body,
  .signature-body {
    display: flex;
    gap: 14px;
    flex: 1 1 auto;
    min-height: 0;
  }

  .history-list,
  .signature-list {
    flex: 0 0 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
    border-radius: 8px;
    background: var(--sunken);
  }

  .history-preview {
    flex: 1 1 auto;
    min-width: 0;
    height: 420px;
    border: 0;
    border-radius: 8px;
    background: #fff;
  }

  .signature-form {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #signature-html,
  #prompt-body,
  #web-output,
  #ai-prompt,
  #ai-answer {
    flex: 1 1 auto;
    /*
       縦が足りないときは、枠と一緒に縮む。

       ここを大きいまま固定すると、枠（.field-grow）は縮むのに入力欄は
       縮まず、枠からはみ出して下の行に重なる。フルHDで表示倍率150%の
       とき、CSS上の高さは約620pxになり、そこで実際に起きていた。
    */
    min-height: 72px;
    width: 100%;
    font-family: Consolas, "SF Mono", monospace;
    font-size: 12px;
    line-height: 1.75;
    resize: vertical;
  }

  #ai-question { width: 100%; resize: vertical; }

  .item-actions { display: flex; gap: 3px; }
  .item-actions button { padding: 3px 8px; font-size: 11px; }

  /* 保存場所の設定 */

  .loc-picker { display: flex; gap: 16px; flex: 1 1 auto; min-height: 0; }

  .loc-browse {
    flex: 1 1 55%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .loc-manual { flex: 1 1 45%; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    color: var(--faint);
  }

  .breadcrumb button { padding: 2px 6px; color: var(--accent); font-size: 12px; }

  .loc-folders {
    flex: 1 1 auto;
    min-height: 180px;
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
    border-radius: 8px;
    background: var(--sunken);
  }

  .loc-folder {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius);
    cursor: pointer;
  }

  .loc-folder:hover { background: var(--hover); }

  .loc-folder .name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .loc-folder .ro { font-size: 11px; color: var(--warn); white-space: nowrap; }
  .loc-folder button { padding: 3px 8px; font-size: 11px; background: var(--panel); }

  /* 自分のテンプレートとして登録する欄 */
  .tpl-save { margin-top: 14px; padding: 12px 14px; background: var(--sunken); border-radius: 6px; }
  .tpl-save .field-row { margin-top: 10px; }
  .tpl-save-msg { margin: 10px 0 0; font-size: 12.5px; color: var(--ok); }
  .tpl-save-msg.warn { color: var(--danger); }

  .spacer { flex: 1; }

  /* AIに聞く */

  /*
   * AIに聞く画面だけは、下地の上に白い面を並べる形にする。
   * 「何のための画面か」「何を頼むか」「渡す文面」「操作」を面で区切り、
   * どこまでがひとまとまりかを読み取れるようにするため。
   */
  .ai-dialog {
    gap: var(--seam);
    padding: 0;
    background: var(--bg);
  }

  .ai-card {
    --pad-x: 20px;
    --pad-y: 18px;

    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 20px;
    border-radius: var(--radius-panel);
    background: var(--panel);
  }

  /* 説明は面で囲わず、白地に文字を置くだけにする */
  .ai-explain {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.85;
  }

  .ai-explain b { color: var(--text); }

  /*
     手順は縦に並べる。

     横3列にすると、400pxのダイアログでは1列あたり100px弱しか取れない。
     日本語の「本文をコピー」は収まっても、英語の "Copy the body" は
     3行に折れて読めなくなる。語の長さは言語で変わるので、横並びは
     どの言語でも安全とは言えない。
  */
  .ai-steps {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: ai;
  }

  .ai-steps li {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    counter-increment: ai;
    font-size: 13px;
  }

  .ai-steps li::before {
    content: counter(ai);
    flex: none;
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
  }

  .ai-steps b { flex: none; }

  /*
     説明は見出しの後ろに続け、余った幅いっぱいを使う。
     入りきらないときだけ、この中で折り返る。
  */
  .ai-steps span {
    flex: 1 1 auto;
    min-width: 0;
    color: var(--faint);
    font-size: 11.5px;
    line-height: 1.6;
  }

  .ai-body { display: flex; gap: var(--seam); flex: 1 1 auto; min-height: 0; }

  .ai-col {
    flex: 1 1 50%;
    min-width: 0;
  }

  .ai-actions {
    flex-direction: row;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    padding: 12px 20px 14px;
  }

  .ai-actions__group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .ai-actions .seg { gap: 3px; }


  /* AI画面の白い面の中では、見出しと注意書きの余白を詰める */
  .ai-card h2 { margin: 0; font-size: 17px; }
  .ai-card .note { margin: 0; }
  .ai-card .field-note { display: inline; margin-left: 6px; }

  @media (max-width: 900px) {
    .ai-actions { flex-direction: column; align-items: stretch; }
  }

  /*
     段の見出し。番号を段そのものに付ける。

     以前は「1. 依頼を選ぶ / 2. コピーしてAIへ / 3. 回答を取り込む」という
     一覧を上に別に置いていた。だが画面はもともとその順に並んでいるので、
     並びが示していることを言葉でもう一度書いていた。番号を段の見出しへ
     移せば、一覧は消しても順番は伝わる。
  */
  .step-label {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
  }

  .step-label i {
    display: grid;
    place-items: center;
    flex: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-size: 11px;
    font-style: normal;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  /* 段の見出しをラベルに使うときは、ラベル側の字組みを打ち消す */
  label > .step-label { margin-bottom: 1px; }

  /*
     依頼の種類。左に一覧、右に選んだものの中身。

     横に流して折り返す形にしていたが、登録した依頼が増えるほど背が高く
     なり、下の入力欄を押し下げる。数がいくつでも高さが変わらないよう、
     縦のリストにして、入りきらないぶんはスクロールさせる。

     右に「実際にAIへ渡す文」を出すのは、名前だけでは何を頼むのか
     分からないため。選ぶ前に中身が読める。
  */
  .ai-pick {
    display: flex;
    gap: var(--seam);

    /*
       高さは、行がちょうど半分で切れるところに合わせている。

       つまみの見え方はブラウザと環境で変わる（オーバーレイ式だと
       触るまで出ない）。切れた行が見えていれば、続きがあることは
       つまみに頼らず伝わる。
    */
    height: 143px;
  }

  .ai-presets {
    flex: 0 0 150px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
    border-radius: var(--radius);
    background: var(--sunken);

    /*
       スクロールできることが分かるように、つまみは常に出しておく。
       隠れていると、下にまだあることに気づけない。

       暗い下地では既定のつまみが溶けて見えないので、色を与える。
       auto ではなく scroll にして、動かせる余地が無いときも
       溝が見えるようにしてある。
    */
    overflow-y: scroll;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) var(--panel);
  }

  /*
     スクロールバーは、画面のどこでも同じ見た目にする。

     以前は AI の窓と入力欄にだけ指定していた。指定の無いところは
     ブラウザ既定の明るいつまみが出て、暗い画面の中で白く浮く。
     **場所を数えて足すやり方をやめ、全体に当てる。**

     例外は白い地の上だけ（署名のプレビュー）。暗い溝を敷くと、
     白い紙の上に黒い帯が乗る。
  */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--faint) var(--panel);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }

  ::-webkit-scrollbar-track {
    border-radius: 5px;
    background: var(--panel);
  }

  ::-webkit-scrollbar-thumb {
    border: 2px solid var(--sunken);
    border-radius: 5px;
    background: var(--faint);
  }

  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::-webkit-scrollbar-corner { background: var(--panel); }

  /* 白い地の上は、明るいつまみに戻す */
  .sig-preview { scrollbar-color: #b7bec9 #f1f3f6; }
  .sig-preview::-webkit-scrollbar-track { background: #f1f3f6; }
  .sig-preview::-webkit-scrollbar-thumb { border-color: #ffffff; background: #b7bec9; }

  .ai-preset {
    flex: none;
    justify-content: space-between;
    width: 100%;
    padding: 5px 8px;
    font-size: 12.5px;
    text-align: left;
  }

  .ai-preset span { overflow: hidden; text-overflow: ellipsis; }

  /* 自分で登録したものの印 */
  .ai-preset i {
    flex: none;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--panel);
    color: var(--faint);
    font-size: 10px;
    font-style: normal;
  }

  .ai-preset:hover:not(:disabled) { background: var(--hover); }

  .ai-preset.active {
    background: var(--accent-weak);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .ai-preset.active i { color: var(--accent-ink); }

  /*
     選んだ依頼の中身。面は持たせない。

     入れ物を並べるほど画面は詰まって見える。ここは読むだけの場所で、
     押したり書き込んだりしないので、面で囲う理由がない。左の一覧が
     面を持っていれば、境目はそれで足りる。
  */
  .ai-pick-body {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 9px 4px 9px 8px;
    overflow-y: auto;
  }

  .ai-pick-body p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.75;
  }

  @media (max-width: 1100px) {
    .inspector { flex-basis: 210px; }
  }

  @media (max-width: 900px) {
    .sidebar { flex-basis: 190px; }
    .inspector { display: none; }
    .history-body, .signature-body, .loc-picker, .ai-body { flex-direction: column; }
    .history-list, .signature-list { flex-basis: 140px; }
    .history-preview { height: 220px; }
  }

  /* =========================================================================
     段階1: スマホで触れるようにする

     並べ方は変えない。触れないものを触れるようにするだけ。

     **前回はここで overflow-x: auto を帯に当てて事故を起こした。**
     ヘッダーとタブの帯には「取り出す」「原稿の扱い」「表示サイズ」
     「紙面の幅」の4つのメニューが入っている。overflow を指定した箱は
     中から飛び出す要素を切り取るので、下に開くメニューが全部切られた。
     **同じ手はもう使わない。** 折り返しで逃がす。

     区切りは600px。iPhoneは縦390〜430px、横向きは844〜932pxなので
     横向きは既存の900pxの指定に入り、ここには落ちてこない。
     ========================================================================= */
  /* =========================================================================
     段階2: スマホの並べ方

     横に3つ並べる前提が、縦画面に合っていない。実測で一覧が190px、
     プレビューの中身は148pxしか残らなかった。詰めても足りない。

     **帯に overflow は使わない。** ヘッダーとタブの帯は「取り出す」
     「原稿の扱い」「表示サイズ」「紙面の幅」の4つのメニューを抱えていて、
     overflow を指定すると下に開くメニューが切り落とされる。一度やった。
     道具の帯だけはメニューを持たないので、そこは流してよい。
     ========================================================================= */
  @media (max-width: 600px) {
    /*
       一覧を、常設の列から**呼んだときだけ出る全面**に変える。
       390pxのうち190pxを占め続ける理由がない。使うのは開くときだけ。
    */
    .sidebar {
      position: fixed;
      inset: 0;
      z-index: 60;
      flex-basis: auto;
      padding: 10px 12px;
      overflow-y: auto;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .5);
    }

    /*
       一覧を出す取っ手。

       最初は幅30pxの細い舌にしていたが、**小さすぎて気づかれなかった。**
       浮いた丸ボタンにして、色も前に出す。指の的は52px。
    */
    /*
       部品の帯の直上に、左右へ振り分ける。

         左  › ファイル一覧
         右  要素パネル ‹

       前は左下の丸い › だけだった。**何のボタンか想像がつかない**、との
       指摘を受けた。名前を付ければ、押す前に何が起きるか分かる。
       向きの記号も添える。一覧は左から、要素パネルは右から出るので、
       記号がそのまま出てくる方向を指す。

       札は data-label で受け取る（スタイル側に文字を書くと訳に載らない）。

       画面の下は、下から順に積む。
         部品の帯（流れの中）  いちばん下
         この2つのボタン        その上
    */
    .rail,
    #inspector-show {
      position: fixed;
      bottom: 46px;
      z-index: 56;
      width: auto;
      height: 40px;
      min-height: 40px;
      padding: 0 12px;
      gap: 6px;
      border: 0;
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--lift-strong);
      font-size: 0;
    }

    .rail { left: 8px; }
    #inspector-show { right: 8px; left: auto; }

    .rail::after,
    #inspector-show::after {
      content: attr(data-label);
      font-size: 13px;
      color: var(--text);
    }

    /* 出てくる向きを、記号で指す */
    .rail::before { content: "\203A"; font-size: 15px; color: var(--faint); }

    #inspector-show::before {
      content: "\2039";
      order: 2;
      font-size: 15px;
      color: var(--faint);
    }

    /* 元の絵は畳む。文字の札に置き換えたため */
    .rail > svg,
    #inspector-show > svg { display: none; }

    /*
       閉じるボタンは、一覧が画面いっぱいに出ているときのもの。
       重なる相手がいないので、左下のまま大きく置く。
    */
    #sidebar-hide {
      position: fixed;
      left: 12px;
      bottom: 16px;
      z-index: 62;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--sunken);
      box-shadow: var(--lift-strong);
    }

    /* 一覧の頭にあった置き場所は、もう使わない */
    .location-row .spacer { display: none; }

    /* 浮きボタンに隠れないよう、一覧の足元をあける */
    .side-foot { padding-bottom: 76px; }

    /*
       ヘッダーを1段に近づける。
       文字の札を落として絵だけにすると、12個の操作が2段に収まる。
       font-size:0 で札を畳み、絵には大きさを戻す。
       :has は iOS 15.4 以降で使える（対象は iOS 18）。
    */
    header .row { flex-wrap: wrap; gap: 6px; row-gap: 4px; }
    header .row .spacer { display: none; }

    header .row button:has(> svg) { font-size: 0; padding: 6px 6px; }
    header .row button:has(> svg) > svg { width: 18px; height: 18px; }

    /*
       言語の選び欄を詰める。ここが十数px余るだけで、
       絵の並びが1段に収まる（収まらないと ? だけが3段目に落ちる）。
    */
    header .lang-pick { max-width: 62px; padding: 4px 2px; }

    /*
       名札は畳む。狭い画面では、いま開いているアプリは分かっている。
       状態表示も消す。出るのは一瞬で、その1行のために場所は割けない。
    */
    .brand { display: none; }
    #status { display: none; }

    /*
       名前とタグを1行に収める。分けると、それだけで2段使う。
       名前を広く、タグを狭く。どちらも残す（消すと打てなくなる）。
    */
    header #title { flex: 2 1 150px; min-width: 0; }
    header #tags { flex: 1 1 95px; min-width: 0; }
    header #btn-save { flex: 0 0 auto; }

    /*
       言語の選び欄は、絵の並びと一緒に下の行へ送る。
       上の行に置くと、名前とタグを押し潰す（最初にそうなった）。
    */
    header .lang-pick { order: 2; flex: 0 0 auto; }
    header .row button:has(> svg) { order: 2; }

    /*
       タブの帯も、ヘッダーと同じ扱い。**ここも overflow は使えない**
       （紙面の幅のメニューを抱えている）。折り返して逃がす。
    */
    .tabbar { flex-wrap: wrap; gap: 6px; }
    .tabbar .spacer { display: none; }
    .tabbar button:has(> svg) { font-size: 0; padding: 6px 8px; }
    .tabbar button:has(> svg) > svg { width: 18px; height: 18px; }

    /*
       「プレビュー ＋ コード」は畳む。390pxで2つ並べても、
       どちらも読める幅にならない。札も長く、1行を余計に使う。
    */
    #tab-split { display: none; }

    /*
       表示サイズの入口は畳む。

       html の zoom は、Safariでは**幅をそのままに中身だけを縮める**。
       0.85にすると右に15%の余りが残り、原稿が左へ寄る。
       起動時に当てないようにしたが、**その場で押せてしまえば同じことが
       起きる。** 入口ごと閉じる。

       スマホには文字サイズの設定もピンチもあるので、困らない。
    */
    #btn-scale { display: none; }

    /*
       パネルを、半分より小さく。

       292x470 では画面の39%を覆っていた。数字の上では半分以下でも、
       **直している部品がパネルの下に隠れる。** 直しながら結果が見えないの
       では直せない。256x350（26%）まで詰め、原稿の左146pxと上を残す。

       そのぶん中身は、札で言えるものを絵にし、余白を削る。
    */

    /* 「選択中の要素」は、パネルが出ている時点で分かっている */
    .inspector .inspector-head { padding: 6px 8px; }
    .inspector .inspector-title { display: none; }

    /* 道すじ（背景 › 段 › 部品）は残す。何を選んでいるかの手がかりはこれだけ */
    #inspector-body .unit-path { gap: 2px; font-size: 11px; }
    #inspector-body .unit-path .unit { padding: 2px 6px; }

    /* タブは絵にする。3つ並べても幅を食わない */
    #inspector-body > .acc { min-height: 34px; font-size: 0; gap: 0; }
    #inspector-body > .acc .acc-count { font-size: 10px; }
    #inspector-body > .acc::before { font-size: 15px; }
    #inspector-body > .acc:nth-of-type(1)::before { content: "T"; font-weight: 700; }
    #inspector-body > .acc:nth-of-type(2)::before { content: "\25A4"; }
    #inspector-body > .acc:nth-of-type(3)::before { content: "\2921"; }

    /* 項目の余白を詰める。説明文は畳む（狭いところでは読まれない） */
    #inspector-body .field { gap: 3px; margin-bottom: 6px; }
    #inspector-body .field > label { font-size: 11px; }
    #inspector-body .field-note { display: none; }

    #inspector-body .seg button,
    #inspector-body .chip { min-height: 30px; padding: 0 8px; font-size: 11.5px; }

    #inspector-body .swatch { width: 18px; height: 18px; }

    /*
       208pxに4つ並ぶ選び分け（小・標準・大・特大）は入りきらない。
       折り返させる。横に押し出すより、2段になるほうが押せる。
    */
    #inspector-body .seg { flex-wrap: wrap; }
    #inspector-body .seg button { flex: 1 1 auto; }

    /* パネルの内側の余白も詰める。幅が効くのはここ */
    .inspector .inspector-head,
    #inspector-body { padding-left: 8px; padding-right: 8px; }

    /*
       ✕ は畳む。開いたボタンが、そのまま閉じるボタンになる。

       開くのと閉じるのが別の場所にあると、閉じるほうを探すことになる。
       **出したのと同じ場所で戻せる**ほうが迷わない。
       開いている間は記号を返して、押すと閉じることを示す。
    */
    #inspector-hide { display: none; }

    #inspector-show[data-open] { background: var(--sunken); }
    #inspector-show[data-open]::before { content: "\203A"; }

    /*
       メニューは下から出す。

       元は「ボタンの右端にそろえて幅300px」。画面の左寄りにあるボタンから
       開くと、**左が画面の外へ出て操作できない。** 390pxの画面に300pxの
       箱をボタン基準で置くこと自体が、そもそも成り立たない。

       下から出せば、ボタンがどこにあっても必ず画面に収まる。指も届く。
       高さが足りなければ中で送る。

       ここが実機で切れていた。**祖先による切り取りだけを見て、画面の外へ
       出ているかを見ていなかった**のが、見逃した原因。
    */
    .pop {
      position: fixed;
      top: auto;
      right: 0;
      left: 0;
      bottom: 0;
      width: auto;
      max-height: 72vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-radius: 14px 14px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /*
       メニューが出ている間は、浮きボタンを引っ込める。
       下から出すようにした結果、**最後の項目に重なって押せなくなった。**
    */
    body:has(.pop:not([hidden])) .rail { display: none; }

    /*
       要素パネルも、下から出す。

       900px以下で display:none にしていた（210pxの横パネルを置く場所が
       無いため）。狭い画面ではメニューと同じシートの形にして戻す。

       出しっぱなしにはしない。**選んだときだけ細い帯を出し、押すと開く。**
       選ぶたびに下半分が埋まると、原稿が見えなくなる。
    */
    /*
       **右から出す。**

       一覧は左から右へ出る。要素パネルだけ下から上へ出ていて、
       同じアプリの中で動きの向きが揃っていなかった。

       画面を覆う量も減らす。下から62vhだと、原稿の下半分が丸ごと
       消えていた。右から82%幅で出せば、原稿の左端が残って
       「どこを直しているか」が見えたままになる。
       入りきらない項目は、中で送る。
    */
    .inspector {
      display: flex;
      position: fixed;
      left: auto;
      right: 0;
      top: auto;
      bottom: 92px;      /* 部品の帯46px + ボタン列40px + 隙間 の上 */
      z-index: 58;
      /*
         幅は左右の半分まで。402pxなら208px。

         **面積で測っていたのが誤りだった。** 256x350 を「26%」と report して
         いたが、目に入るのは左右の占め方で、256/402 = 64%。埋まって見えて
         当然だった。以後は幅の割合で見る。
      */
      width: min(208px, 52vw);
      /*
         全高にしない。右から300px×全高で出すと画面の77%を覆い、
         下から62vhで出していたときより**広くなってしまう**。
         高さを抑えて右下に寄せれば45%まで下がり、原稿の上と左が残る。
      */
      height: min(42vh, 350px);
      max-height: none;
      flex-basis: auto;
      border-radius: 14px 0 0 14px;
      box-shadow: var(--lift-strong);
      padding: 0 0 env(safe-area-inset-bottom, 0px);
      transform: translateX(0);
      transition: transform .18s ease, visibility .18s;
    }

    /*
       畳んだ状態は display:none にしない。**消すと動きが出ない。**
       右へ寄せて隠し、押せないようにしておく。
    */
    .inspector[hidden] {
      display: flex;
      visibility: hidden;
      transform: translateX(100%);
      pointer-events: none;
    }

    /* 中身だけを送る。頭の閉じるボタンは止めておく */
    .inspector > * { flex: 0 0 auto; }
    #inspector-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

    /*
       選んだときに出る帯。

       札は「要素：枠」のように、いま何を選んでいるかを言葉で出す。
       札が無い＝何も選んでいないので、そのときは帯ごと引っ込める。

       左は一覧の浮きボタンをよけて空ける。重ねると、どちらも押しにくい。
    */
    /*
       閉じるボタンは、パネルの上部中央に置く。

       元は頭の右端の » だった。**まず記号の意味が分からない。**
       中央に大きく置いて、押す場所を迷わせない。
    */
    #inspector-hide {
      position: absolute;
      left: 50%;
      top: 6px;
      transform: translateX(-50%);
      z-index: 3;
      width: 64px;
      height: 30px;
      border-radius: 999px;
      background: var(--sunken);
      font-size: 0;
    }

    /* 元の » は絵で描かれている。font-size:0 では消えないので、隠す */
    #inspector-hide > svg { display: none; }

    #inspector-hide::after {
      content: "\2715";
      font-size: 15px;
      color: var(--text);
    }

    /* 閉じるボタンのぶん、頭をあける */
    .inspector .aside-head { padding-top: 40px; }

    /*
       3つのまとまりを、タブとして横に並べる。

       見出しと中身は 見出し→中身→見出し→中身 の順に並んでいるので、
       order で見出しだけを先に集める。中身は必ず1つしか作られないので、
       その下に1枚だけ出る。
    */
    #inspector-body {
      display: flex;
      /*
         向きを明示する。元は column で、そのまま折り返すと**次の「列」へ
         回る**。中身が画面の右外（x380〜625）へ出ていた。
      */
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px 4px;
    }

    #inspector-body > * { flex: 1 1 100%; order: 1; }

    #inspector-body > .acc {
      flex: 1 1 0;
      order: 2;
      justify-content: center;
      min-height: 40px;
      border-radius: 8px;
    }

    /*
       選んでいるタブを、はっきり見せる。地の色を変えるだけだと、
       シートの地と近くてどれが出ているのか分からない。下に線を引く。
    */
    #inspector-body > .acc.open {
      background: var(--sunken);
      color: var(--text);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    #inspector-body > .acc .acc-caret { display: none; }
    #inspector-body > .acc-body { flex: 1 1 100%; order: 3; }

    /* 帯とシートに隠れないよう、原稿の足元をあける */
    .editor-body { padding-bottom: 46px; }

    /*
       道具の帯だけは横に流す。ここはメニューを持たないので切られない。
       選び欄と色の欄はブラウザが画面の上に描くので、これも切られない。
    */
    .wys-toolbar .tool-row {
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .wys-toolbar .tool-row::-webkit-scrollbar { display: none; }
    .wys-toolbar .tool-row > * { flex-shrink: 0; }
    .wys-toolbar .tool-row .spacer { display: none; }

    /*
       部品の縦帯を、原稿の下へ寝かせる。

       縦に置くと、390pxのうち左44pxを取り続ける。原稿は48〜390pxに
       押し込まれ、**画面の左に黒い帯、右端に原稿**という並びになる。
       原稿そのものは寄っていないが、左右が釣り合わないので寄って見える。

       下へ移せば原稿は0〜390pxの全幅になり、左右が揃う。
       部品は横に流して指でなぞる（ここはメニューを持たないので切られない）。

       .rail-inner は絶対配置で幅44px固定なので、位置と向きを置き直す。
       前に一度、ここを直さずに向きだけ変えて幅0の状態を作った。
    */
    .wys-body { flex-direction: column; }

    .tool-rail {
      order: 2;
      flex: 0 0 46px;
      height: 46px;
      width: auto;
      max-width: none;
    }

    .tool-rail .rail-inner,
    .tool-rail:hover .rail-inner,
    .tool-rail:focus-within .rail-inner {
      inset: 0;
      width: auto;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
